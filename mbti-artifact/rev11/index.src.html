<title>คุณเป็นไทป์ไหน</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one centered column. Three screens: setup (seed, contexts, length) -> one question per screen -> result with function stack. */
:root {
  --bg: #FFF3F4;
  --surface: #FFFFFF;
  --fg: #2B1519;
  --muted: #7A5761;
  --line: #F4D2D8;
  --accent: #D42A3C;
  --accent-fg: #FFFFFF;
  --accent-soft: #FFE3E7;
  --track: #FBE4E8;
  --edge: #D9A0AA;
  --field: #FFFFFF;
  --hl: #D42A3C;
  --glow: rgba(242, 86, 106, .14);
  --font-display: "Kanit", "Noto Sans Thai", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1013;
    --surface: #28171C;
    --fg: #FBECEF;
    --muted: #CBA6AF;
    --line: #46262E;
    --accent: #FF7D8D;
    --accent-fg: #2B0A10;
    --accent-soft: #4A1F29;
    --track: #3A2329;
    --edge: #A87582;
    --field: #1F1216;
    --hl: #FF7D8D;
    --glow: rgba(255, 125, 141, .10);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1013;
  --surface: #28171C;
  --fg: #FBECEF;
  --muted: #CBA6AF;
  --line: #46262E;
  --accent: #FF7D8D;
  --accent-fg: #2B0A10;
  --accent-soft: #4A1F29;
  --track: #3A2329;
  --edge: #A87582;
  --field: #1F1216;
  --hl: #FF7D8D;
  --glow: rgba(255, 125, 141, .10);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: 20px 40px;
}
.wrap { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
.top { flex-wrap: wrap; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 500; font-size: 18px; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; }
.progress { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px 20px; display: flex; flex-direction: column; gap: 22px; }
h1.h1 { font-family: var(--font-display); font-weight: 500; font-size: 24px; line-height: 1.35; margin: 0; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); font-size: 15px; max-width: 62ch; }

/* setup form */
.field { display: flex; flex-direction: column; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > label, .field > legend { font-weight: 600; font-size: 15px; padding: 0; }
.row { display: flex; gap: 8px; }
.row input { flex: 1; min-width: 0; }
input[type="text"] { font: inherit; font-size: 16px; color: var(--fg); background: var(--field); border: 1px solid var(--edge); border-radius: 10px; padding: 10px 12px; }
input[type="text"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chips2 { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; display: inline-flex; }
.chip input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.chip span { display: inline-flex; flex-direction: column; border: 1px solid var(--edge); background: var(--field); color: var(--fg); border-radius: 10px; padding: 8px 14px; font-size: 15px; line-height: 1.3; }
.chip small { color: var(--muted); font-size: 12px; }
.chip input:checked + span { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip input:disabled { cursor: not-allowed; }
.chip input:disabled + span { opacity: .6; }

/* question */
.tag { align-self: flex-start; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
.q { font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1.5; margin: 0; text-wrap: balance; min-height: 6.5em; display: flex; align-items: center; }
.ab { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); }
.ab b { color: var(--fg); font-weight: 600; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; align-items: start; }
.opt { appearance: none; border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; line-height: 1.3; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; min-width: 0; text-align: center; }
.dot { border-radius: 50%; border: 2px solid var(--edge); background: var(--surface); transition: transform .12s ease, background .12s ease, border-color .12s ease; }
.opt[data-v="2"] .dot, .opt[data-v="-2"] .dot { width: 46px; height: 46px; }
.opt[data-v="1"] .dot, .opt[data-v="-1"] .dot { width: 36px; height: 36px; }
.opt[data-v="0"] .dot { width: 28px; height: 28px; }
@media (hover: hover) { .opt:hover .dot { transform: scale(1.06); } }
.opt[aria-checked="true"] .dot { background: var(--accent); border-color: var(--accent); }
.opt[aria-checked="true"] { color: var(--fg); font-weight: 600; }
.opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.scale .slot { display: flex; justify-content: center; }

.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn { font: inherit; font-weight: 500; font-size: 15px; border-radius: 10px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.block { width: 100%; padding-block: 12px; font-size: 16px; }
.hint { font-size: 13px; color: var(--muted); }

/* result */
.result { display: flex; flex-direction: column; gap: 22px; }
.type-head { display: flex; flex-direction: column; gap: 4px; }
.code { font-family: var(--font-display); font-weight: 500; font-size: 56px; letter-spacing: .06em; line-height: 1.1; color: var(--accent); }
.tname { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0; }
.desc { margin: 0; max-width: 62ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0; }
.chips li { background: var(--accent-soft); color: var(--fg); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
h2.sec { font-family: var(--font-display); font-weight: 500; font-size: 16px; margin: 0 0 8px; }
.stack { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; list-style: none; padding: 0; margin: 0; }
.stack li { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; min-width: 0; }
.stack .role { font-size: 12px; color: var(--muted); }
.stack .fn { font-weight: 600; }
.stack .fn small { font-weight: 400; color: var(--muted); font-size: 13px; }
.fbars { display: flex; flex-direction: column; gap: 10px; }
.fbar { display: grid; grid-template-columns: minmax(0, 11em) 1fr; gap: 10px; align-items: center; font-size: 14px; }
.fbar .lab { min-width: 0; }
.fbar .lab b { font-weight: 600; }
.fbar .lab small { color: var(--muted); display: block; font-size: 12px; line-height: 1.3; }
.bar { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--edge); border-radius: 5px; }
.bar > i.on { background: var(--accent); }
.small { font-size: 13px; color: var(--muted); margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.q:focus { outline: none; }
.code.unclear { font-size: 30px; letter-spacing: 0; }
.note { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin: 0; }
@media (prefers-reduced-motion: reduce) { .progress > i, .dot { transition: none; } }
@media (max-width: 380px) { .q { font-size: 20px; } .opt { font-size: 11px; } .fbar { grid-template-columns: minmax(0, 9em) 1fr; } }

/* ---- v4 additions ---- */
.chips2.tight { gap: 6px; }
.mini { display: flex; gap: 8px; flex-wrap: wrap; }
.btn.small { font-size: 13px; padding: 4px 12px; border-radius: 8px; }
.btn.ghost { background: transparent; }
.guard { margin: 0; font-size: 13px; color: var(--muted); }
.lock { border: 1px solid var(--edge); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: var(--field); }
.lock p { margin: 0; font-size: 14px; }
.lock label { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; font-weight: 600; cursor: pointer; }
.lock input[type="checkbox"] { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
.na { align-self: center; font: inherit; font-size: 14px; color: var(--muted); background: none; border: 0; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; padding: 8px 12px; cursor: pointer; }
.na[aria-pressed="true"] { color: var(--fg); font-weight: 600; }
.na:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.undo { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--edge); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-size: 14px; overflow: hidden; }
.undo::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--accent); transform-origin: left; animation: shrink 2s linear forwards; }
@keyframes shrink { to { transform: scaleX(0); } }
.alts { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.alts li { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.alts label { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; cursor: pointer; }
.alts input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }
.alts .c { font-family: var(--font-display); font-size: 18px; letter-spacing: .04em; }
.alts .m { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.alts small { grid-column: 2 / 4; color: var(--muted); font-size: 13px; }
.lens { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.lens > div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lens .k { font-size: 12px; color: var(--muted); }
.lens b { font-weight: 600; }
.lens p { margin: 0; font-size: 13px; color: var(--muted); }
@media (max-width: 440px) { .lens { grid-template-columns: 1fr; } }
.ctxs { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.ctxs li { font-size: 14px; }
.ctxs b { font-weight: 600; }
.ctxs ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); }
.fbar .val { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; margin-left: 6px; }
.refs { padding-left: 20px; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.refs a { color: var(--accent); overflow-wrap: anywhere; }
.refs .lv { display: inline-block; font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; color: var(--muted); margin-left: 4px; }
.disc { padding-left: 20px; margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
.warn { border: 1px solid var(--edge); background: var(--surface); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin: 0; }
details.fold > summary { cursor: pointer; font-family: var(--font-display); font-size: 16px; padding: 2px 0; }
details.fold > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details.fold[open] > summary { margin-bottom: 8px; }
@media (prefers-reduced-motion: reduce) { .undo::after { animation: none; transform: scaleX(0); } }
.q.bip { min-height: 0; display: flex; flex-direction: column; align-items: stretch; gap: 10px; font-family: var(--font-body); font-size: 17px; line-height: 1.55; }
.q.bip .side { margin: 0; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--field); }
.q.bip .side b { font-family: var(--font-display); color: var(--accent); margin-right: 4px; }
.opt-line { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.opt-line input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
.opt-line small { display: block; color: var(--muted); font-size: 13px; }

.vchip { display: inline-block; font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; margin-left: 6px; color: var(--muted); white-space: nowrap; }
.vchip.v-confirm { border-color: var(--accent); color: var(--fg); background: var(--accent-soft); }
.vchip.v-contradict { border-style: dashed; border-color: var(--fg); color: var(--fg); }
.sec2 { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 14px 0 6px; }
.probes { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.probes li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; overflow-wrap: anywhere; }
.probes small { color: var(--muted); font-size: 13px; }
/* ---- rev8: FirstThread brand ---- */
body { background: radial-gradient(120% 60% at 100% 0%, var(--glow), transparent 60%), radial-gradient(90% 50% at 0% 100%, var(--glow), transparent 60%), var(--bg); background-repeat: no-repeat; background-color: var(--bg); }
.brand { display: inline-flex; align-items: center; gap: 8px; color: var(--hl); font-weight: 600; letter-spacing: .01em; }
.brand img { width: 28px; height: 28px; border-radius: 8px; flex: none; }
.card { border-radius: 20px; box-shadow: 0 10px 30px -18px var(--glow), 0 1px 0 var(--line); }
.btn { border-radius: 999px; }
.btn.primary { box-shadow: 0 8px 18px -10px var(--accent); }
.chip span { border-radius: 999px; }
.hero-ft { display: flex; flex-direction: column; gap: 10px; }
.hero-ft .kicker { margin: 0; color: var(--hl); font-family: var(--font-display); font-weight: 500; font-size: 15px; letter-spacing: .02em; }
.hero-ft h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 8vw, 40px); line-height: 1.2; margin: 0; text-wrap: balance; }
.hero-ft h1 .hl { color: var(--hl); }

.steps3 { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 10px; }
.steps3 li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; background: var(--accent-soft); border-radius: 14px; padding: 10px 12px; }
.steps3 .n { width: 34px; height: 34px; border-radius: 10px; background: var(--surface); color: var(--hl); font-family: var(--font-display); font-weight: 600; display: grid; place-items: center; }
.steps3 b { display: block; font-family: var(--font-display); font-weight: 600; color: var(--fg); }
.steps3 span.d { font-size: 14px; color: var(--muted); }
.fnchips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.fnchips i { font-style: normal; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--surface); color: var(--hl); }
.ftcta { flex-direction: row; align-items: center; gap: 16px; background: linear-gradient(135deg, var(--accent-soft), var(--surface)); }
.ftcta img { width: 56px; height: 56px; border-radius: 14px; flex: none; }
.ftcta div { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ftcta .cta-h { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 20px; color: var(--hl); }
.ftcta p { margin: 0; }
.ftcta a { color: var(--hl); font-weight: 600; }
.handle { text-align: center; color: var(--muted); font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.handle img { width: 22px; height: 22px; border-radius: 6px; }
.handle a { color: var(--hl); font-weight: 600; text-decoration: none; }
.setup-h { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 4px 0 0; }
.steps3 + .setup-h { padding-top: 6px; border-top: 1px dashed var(--line); }
/* ---- rev9: ข้อถามตรงเรื่อง I/E ---- */
.eibox { display: flex; flex-direction: column; gap: 10px; background: var(--accent-soft); border-radius: 16px; padding: 16px; }
.eibox p { margin: 0; }
.eiscale { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 13px; color: var(--hl); }
.eitrack { position: relative; height: 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.eitrack::before { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--edge); }
.eitrack i { position: absolute; top: 50%; width: 18px; height: 18px; margin-left: -9px; margin-top: -9px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 2px 6px -2px var(--accent); }
.eifacets { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px; }
.eifacets li { background: var(--surface); border-radius: 10px; padding: 6px 10px; font-size: 14px; min-width: 0; }
.eifacets li .small { display: block; }
/* ---- rev10: พัก/ทำต่อ แชร์ และข้อเลือกข้าง ---- */
.qnav { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.helper { margin: -6px 0 0; }
.sharebtns { display: flex; flex-wrap: wrap; gap: 8px; }
.sharebtns .btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; }
a.btn { color: var(--fg); }
a.btn.primary { color: var(--accent-fg); }
.codebox, .capbox { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; word-break: break-all; margin: 0; user-select: all; }
.capbox { font-family: var(--font-body); font-size: 14px; word-break: normal; overflow-wrap: anywhere; }
.pause { gap: 14px; }
.pause p { margin: 0; }
.resumebox summary { cursor: pointer; font-weight: 600; color: var(--hl); }
.resumebox .row { margin-top: 8px; }
.share { gap: 14px; }

.storyimg { width: 100%; max-width: 270px; aspect-ratio: 9 / 16; border-radius: 16px; display: block; margin-inline: auto; border: 1px solid var(--line); }
.storyfull { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); }
.storyfull img { max-height: calc(100% - 60px); max-width: 100%; aspect-ratio: 9 / 16; border-radius: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); text-align: center; pointer-events: none; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.mbars { display: grid; gap: 6px; }
.mb { display: grid; grid-template-columns: 34px 1fr; column-gap: 8px; align-items: center; }
.mb .bar { height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; display: block; }
.mb .bar i { display: block; height: 100%; background: var(--accent); }
.mb small { grid-column: 2; color: var(--muted); font-size: 12px; }

function makeRng(str) {
  var h = 1779033703 ^ str.length;
  for (var i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  var a = (h ^ (h >>> 16)) >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rnd) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rnd() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

       · ถ้าอีกแท็บกำลังใช้รอบเดียวกันอยู่ (มีสัญญาณชีพภายใน 90 วินาที) แท็บนี้จะแยกเป็นรอบใหม่ที่คัดลอกคำตอบเดิมมา แทนที่จะเขียนทับกัน
       · ทุกการอ่าน/เขียนอยู่ใน try/catch ถ้าเบราว์เซอร์ปิด storage แบบทดสอบยังทำงานได้ แค่บันทึกไม่ได้
       · แต่ละรอบเก็บแยกคีย์ (ft11_run_<runId>) แต่ละแท็บเขียนเฉพาะคีย์ของตัวเอง สองแท็บที่บันทึกพร้อมกันจึงไม่ทับคำตอบของกัน */
    var RUNS = "ft11_runs", RUNPFX = "ft11_run_", TABRUN = "ft11_tabrun", MAXRUNS = 6, LIVE_MS = 90000;
    var TAB = Math.random().toString(36).slice(2, 10) + Date.now().toString(36), runId = "", lineage = [], saveOK = true, mineLoaded = false;
    function newRunId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
    function readRuns() {
      var m = {};
      try {
        /* ย้ายข้อมูลรูปแบบเดิม (แผนที่ก้อนเดียว) มาเป็นคีย์แยก */
        var old = localStorage.getItem(RUNS);
        if (old) {
          var om = JSON.parse(old) || {};
          Object.keys(om).forEach(function (k) { if (!localStorage.getItem(RUNPFX + k)) localStorage.setItem(RUNPFX + k, JSON.stringify(om[k])); });
          localStorage.removeItem(RUNS);
        }
      } catch (e) { try { localStorage.removeItem(RUNS); } catch (e2) {} }
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (key && key.indexOf(RUNPFX) === 0) { try { m[key.slice(RUNPFX.length)] = JSON.parse(localStorage.getItem(key)); } catch (e) {} }
        }
      } catch (e) {}
      return m;
    }
    function validRun(r) { return !!r && r.v === BANKV && typeof r.seed === "string" && Array.isArray(r.tape) && Date.now() - (r.at || 0) <= KEEP_DAYS * 864e5; }
    /* เขียนเฉพาะรอบเดียว แล้วตัดรอบเกิน MAXRUNS (สำเนาต้นทางของรอบที่แยกออกไปแล้วถูกตัดก่อนรอบของคนอื่น) */
    function putRun(id, rec) {
      var ok = true;
      try { localStorage.setItem(RUNPFX + id, JSON.stringify(rec)); } catch (e) { ok = false; }
      prune(id);
      return ok;
    }
    function delRun(id) { try { localStorage.removeItem(RUNPFX + id); } catch (e) {} }
    function prune(keepId) {
      var m = readRuns(), anc = {};
      Object.keys(m).forEach(function (k) { ((m[k] && m[k].lin) || []).forEach(function (a) { anc[a] = 1; }); });
      var ids = Object.keys(m).filter(function (k) { if (validRun(m[k])) return true; delRun(k); return false; });
      ids.sort(function (a, b) { return (a === keepId ? -1 : b === keepId ? 1 : 0) || (anc[a] ? 1 : 0) - (anc[b] ? 1 : 0) || m[b].at - m[a].at; })
        .slice(MAXRUNS).forEach(delRun);
    }
    function liveElsewhere(r) { return !!r && r.tab !== TAB && Date.now() - (r.beat || 0) < LIVE_MS; }
    function claim(id) { runId = id; try { sessionStorage.setItem(TABRUN, id); } catch (e) {} }
    function unclaim() { runId = ""; try { sessionStorage.removeItem(TABRUN); } catch (e) {} }
    function forkRun(why) { if (runId) lineage = lineage.concat([runId]).slice(-8); claim(newRunId()); if (why) toast(why); }
    /* ปิดหรือรีเฟรชหน้า: ปล่อยรอบนี้ (สัญญาณชีพ = 0) แท็บเดิมที่รีเฟรชจึงรับรอบเดิมกลับได้ ส่วนแท็บที่ถูกทำซ้ำขณะแท็บเดิมยังเปิดอยู่จะยังแยกรอบตามปกติ */
    function release() {
      if (!runId) return;
      var m = readRuns(), r = m[runId];
      if (r && r.tab === TAB) { r.beat = 0; putRun(runId, r); }
    }
    function save() {
      if (!usedSeed) return;
      var m = readRuns();
      if (!runId) claim(newRunId());
      else if (liveElsewhere(m[runId])) forkRun("รอบนี้เปิดอยู่อีกแท็บ แท็บนี้จึงแยกเป็นรอบของตัวเอง (คำตอบเดิมคัดลอกมาแล้ว)");
      var now = Date.now();
      m[runId] = { v: BANKV, seed: usedSeed, chosen: usedChosen, L: usedL, tape: tape, best: bestFit, cps: cps, ph: ph, at: now, beat: now, tab: TAB, lin: lineage };
      var ok = putRun(runId, m[runId]);
      if (!ok && saveOK) toast("บันทึกในเครื่องนี้ไม่ได้ (เบราว์เซอร์ปิดการบันทึกหรือพื้นที่เต็ม) ทำต่อได้ตามปกติ แต่ถ้าจะพัก ให้เก็บลิงก์ทำต่อไว้");
      saveOK = ok;
    }
    function wipe() {
      var m = readRuns();
      /* ลบรอบนี้และสำเนาต้นทางทั้งหมดของมัน (ที่ไม่มีแท็บอื่นใช้อยู่) */
      [runId].concat(lineage, (m[runId] && m[runId].lin) || []).forEach(function (k) { if (k && m[k] && (k === runId || !liveElsewhere(m[k]))) delRun(k); });
      unclaim(); lineage = [];
    }
    /* รอบที่จะเสนอให้ทำต่อ: รอบของแท็บนี้ก่อน (เช่น กดรีเฟรช) ไม่งั้นรอบล่าสุดที่ไม่มีแท็บอื่นใช้อยู่ */
    function loadLocal() {
      var m = readRuns(), mine = null;
      try { mine = sessionStorage.getItem(TABRUN); } catch (e) {}
      var ids = Object.keys(m).filter(function (k) { return validRun(m[k]); });
      var pick = mine && ids.indexOf(mine) >= 0 ? mine : ids.filter(function (k) { return !liveElsewhere(m[k]); }).sort(function (a, b) { return m[b].at - m[a].at; })[0];
      if (!pick) return null;
      lineage = (m[pick].lin || []).slice();
      mineLoaded = pick === mine && !liveElsewhere(m[pick]);
      if (liveElsewhere(m[pick])) { runId = pick; forkRun("แบบทดสอบนี้เปิดอยู่อีกแท็บ แท็บนี้แยกเป็นรอบของตัวเอง เพื่อไม่ให้คำตอบทับกัน"); }
      else claim(pick);
      return m[pick];
    }
    function heartbeat() {
      if (!runId) return;
      var m = readRuns(), r = m[runId];
      if (!r) return;
      if (liveElsewhere(r)) { forkRun("รอบนี้ถูกเปิดในอีกแท็บ แท็บนี้แยกเป็นรอบของตัวเองแล้ว"); save(); return; }
      r.beat = Date.now(); r.tab = TAB; putRun(runId, r);
    }
    try {
      setInterval(heartbeat, 20000);

      window.addEventListener("pageshow", function (e) { if (e.persisted) heartbeat(); });
      /* อีกแท็บเขียนทับรอบเดียวกัน: แยกตัวทันที แล้วบันทึกสถานะของแท็บนี้ในรอบใหม่ */
      window.addEventListener("storage", function (e) {
        if (e.key !== RUNPFX + runId || !runId || !usedSeed) return;
        var r = readRuns()[runId];
        if (r && r.tab !== TAB) { forkRun("รอบนี้ถูกเปิดในอีกแท็บ แท็บนี้แยกเป็นรอบของตัวเองแล้ว"); save(); }

    /* ----- รหัส/ลิงก์ทำต่อ: r1.<ver>.<คำสุ่ม base64url>.<ความยาว><เรื่อง>.<เทป>.<checksum> ----- */
    function b64u(str) {
      var bytes = unescape(encodeURIComponent(str)), out = btoa(bytes);

    function encodeResume() {
      var body = "r1." + BANKV.toString(36) + "." + b64u(usedSeed) + "." + LENS.indexOf(usedL) + usedChosen.join("") + "." + tape.join("");
      return body + "." + chk(body);
    }
    function decodeResume(raw) {
      var s = String(raw || "").replace(/\s+/g, "");
      var h = s.indexOf("#"); if (h >= 0) s = s.slice(h + 1);
      if (s.charAt(0) === "r" && s.charAt(1) !== "1") s = s.slice(1);
      if (s.indexOf("r1.") !== 0) return { err: "bad" };
      var parts = s.split(".");
      if (parts.length !== 6) return { err: "cut" };
      var body = parts.slice(0, 5).join(".");
      if (chk(body) !== parts[5]) return { err: "cut" };
      if (parseInt(parts[1], 36) !== BANKV) return { err: "old" };
      var seed; try { seed = unb64u(parts[2]); } catch (e) { return { err: "cut" }; }

    /* ----- คัดลอกข้อความ (มีทางสำรองเมื่อคลิปบอร์ดใช้ไม่ได้) ----- */

      }).join("");

    function typeLine(S) { return S.alt ? "ใกล้เคียง: " + S.code + " / " + S.alt : S.code; }
    function captionOf(S, link) {
      var st = STACKS[S.code];
      return (S.alt ? "ผลของฉันใกล้กับ " + S.code + " / " + S.alt : "ผลของฉันใกล้กับ " + S.code + " (" + st[0] + "-" + st[1] + ") ที่สุด") +
        " จากแบบสะท้อนตัวเองเรื่อง 8 ฟังก์ชันตามแนวคิดของยุง โดย FirstThread · ไม่ใช่ MBTI ทางการ · ลองทำแล้วมาเทียบกัน " + link;
    }
    function miniBars(S) {
      return '<div class="mbars">' + FUNCS.slice().sort(function (a, b) { return S.bars[b] - S.bars[a]; }).map(function (f) {
        return '<div class="mb"><b>' + f + '</b><span class="bar" aria-hidden="true"><i style="width:' + Math.round(S.bars[f] / 15 * 100) + '%"></i></span><small>' + FNAME[f] + '</small></div>';
      }).join("") + '</div>';
    }
    function loadRecv() { try { return decodeShare(localStorage.getItem(RECV) || ""); } catch (e) { return null; } }
    function compareHtml(me, them) {
      /* เทียบลำดับฟังก์ชันภายในตัวแต่ละคน ไม่เทียบคะแนนข้ามคน (คะแนนแบบเลือกข้างเป็นค่าเทียบภายในตัวคนนั้นเท่านั้น) */
      var rk = function (S) { var o = FUNCS.slice().sort(function (a, b) { return S.bars[b] - S.bars[a]; }), r = {}; o.forEach(function (f, i) { r[f] = i + 1; }); return r; }, rm = rk(me), rt = rk(them);
      var diffs = FUNCS.map(function (f) { return { f: f, d: rm[f] - rt[f] }; }).sort(function (a, b) { return Math.abs(b.d) - Math.abs(a.d); }).filter(function (x) { return x.d !== 0; }).slice(0, 3);
      return '<div class="compare"><h3 class="sec2">เทียบกับลิงก์ที่ได้รับ</h3><div class="cmp2"><div><span class="small">คุณ</span><b>' + esc(typeLine(me)) + '</b><span class="small">' + EI_BAND_TXT[me.ei] + '</span></div>' +
        '<div><span class="small">อีกคน (แชร์เอง)</span><b>' + esc(typeLine(them)) + '</b><span class="small">' + EI_BAND_TXT[them.ei] + '</span></div></div>' +
        '<p class="small">' + (diffs.length ? 'ลำดับฟังก์ชันต่างกันมากที่สุดตรง: ' + diffs.map(function (x) { return x.f + ' (' + FNAME[x.f] + ') อันดับ ' + rm[x.f] + ' ของคุณ / อันดับ ' + rt[x.f] + ' ของอีกคน'; }).join(' · ') : 'ลำดับฟังก์ชันของสองคนเหมือนกัน') + ' — เทียบลำดับภายในตัวแต่ละคน ไม่ได้บอกว่าใครใช้ฟังก์ชันไหนมากกว่ากัน และไม่มีคะแนนความเข้ากัน</p>' +
        '<button type="button" class="btn small ghost" id="clearrecv">ลบลิงก์ที่เทียบ</button></div>';
    }
    function shareSection(V, hide) {
      var invite = ART_URL;
      if (hide) {
        return '<section class="card share" id="shareslot"><h2 class="sec">ชวนเพื่อนมาลอง</h2><p class="small">ผลรอบนี้ยังไม่ชัด จึงยังไม่มีการ์ดผลให้แชร์ ส่งลิงก์แบบทดสอบให้เพื่อนได้</p>' +
          '<div class="sharebtns"><button type="button" class="btn" id="copyinvite">คัดลอกลิงก์แบบทดสอบ</button></div>' + igCta() + '</section>';
      }
      var S = summaryOf(V), link = ART_URL + "#" + encodeShare(S), cap = captionOf(S, link), recv = loadRecv();
      var M = mailLinks("ผลแบบทดสอบไทป์ของฉัน (FirstThread)", cap);
      return '<section class="card share" id="shareslot">' +
        '<h2 class="sec">แชร์ผล &amp; ชวนเพื่อนมาเทียบ</h2>' +
        '<p class="small">ลิงก์แชร์มีแค่สรุปผล (ไทป์ แถบฟังก์ชัน และระดับ I/E) ไม่มีคำตอบของคุณ ผู้รับจะเห็นป้าย “ผลที่ผู้ทำแชร์เอง ไม่ใช่ผลยืนยัน”</p>' +
        '<p class="capbox" id="caption">' + esc(cap) + '</p>' +
        '<div class="sharebtns">' +
          '<button type="button" class="btn primary" id="copycap">คัดลอกข้อความ + ลิงก์</button>' +
          '<a class="btn sh" href="https://line.me/R/share?text=' + encodeURIComponent(cap) + '" target="_blank" rel="noopener noreferrer">LINE</a>' +
          '<a class="btn sh" href="https://twitter.com/intent/tweet?text=' + encodeURIComponent(cap) + '" target="_blank" rel="noopener noreferrer">X</a>' +
          '<a class="btn sh" href="https://www.threads.net/intent/post?text=' + encodeURIComponent(cap) + '" target="_blank" rel="noopener noreferrer">Threads</a>' +
          '<a class="btn sh" data-fb="1" href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(link) + '" target="_blank" rel="noopener noreferrer">Facebook</a>' +
          '<a class="btn sh" href="' + M.gmail + '" target="_blank" rel="noopener noreferrer">อีเมล</a></div>' +
        '<p class="small">กดปุ่มแพลตฟอร์มแล้วระบบจะคัดลอกข้อความให้ก่อน ถ้าแอปไม่เติมข้อความให้ วางเองได้เลย · <a href="' + M.mailto + '">ใช้แอปอีเมลอื่น</a></p>' +
        '<h3 class="sec2">สตอรี่ IG</h3><p class="small">Instagram ไม่มีปุ่มแชร์จากเว็บ ให้สร้างรูปสตอรี่ แล้วโพสต์เอง ใส่สติกเกอร์ลิงก์ด้วยลิงก์ที่คัดลอกไว้</p>' +
        '<div class="sharebtns"><button type="button" class="btn primary" id="mkstory">สร้างรูปสตอรี่ 9:16</button><button type="button" class="btn" id="copylink">คัดลอกลิงก์ไว้ใส่สติกเกอร์ลิงก์</button></div>' +
        '<div id="storyout" aria-live="polite"></div>' +
        (recv ? compareHtml(S, recv) : '<p class="small">ชวนแฟนหรือเพื่อนมาทำ แล้วส่งลิงก์ผลให้กัน เปิดลิงก์ของอีกคนแล้วกด “ลองทำของคุณ” จะได้เห็นผลเทียบกันตรงนี้ (ไม่มีคะแนนความเข้ากัน)</p>') +
        igCta() + '</section>';
    }
    function igCta() {
      return '<div class="ftcta"><img src="img/firstthread-icon.png" alt="" width="56" height="56"><div><p class="cta-h">ได้ผลแล้ว กลับมาแชร์กัน</p><p>แท็ก <a href="' + IG_URL + '" target="_blank" rel="noopener noreferrer">@firstthread.app</a> บนไอจี</p><p class="small">เพื่อสำรวจตัวเอง ไม่ใช่การวินิจฉัย</p></div></div>';
    }
    function bindShare(V, hide) {
      var ci = document.getElementById("copyinvite");
      if (ci) ci.addEventListener("click", function () { copyText(ART_URL, ci, "คัดลอกลิงก์แบบทดสอบแล้ว"); });
      if (hide) return;
      var S = summaryOf(V), link = ART_URL + "#" + encodeShare(S), cap = captionOf(S, link);
      document.getElementById("copycap").addEventListener("click", function () { copyText(cap, this, "คัดลอกข้อความและลิงก์แล้ว"); });
      document.getElementById("copylink").addEventListener("click", function () { copyText(link, this, "คัดลอกลิงก์แล้ว"); });
      app.querySelectorAll("a.sh").forEach(function (a) {
        a.addEventListener("click", function () {
          copyText(cap, a, a.getAttribute("data-fb") ? "คัดลอกข้อความแล้ว วางในโพสต์ได้เลย (ตัวอย่างลิงก์ของ Facebook ไม่แสดงผล)" : "คัดลอกข้อความไว้แล้ว ถ้าแอปไม่เติมให้ วางเองได้เลย");
        });
      });
      document.getElementById("mkstory").addEventListener("click", function () { buildStory(S); });
      var cr = document.getElementById("clearrecv");
      if (cr) cr.addEventListener("click", function () { try { localStorage.removeItem(RECV); } catch (e) {} var w = cr.parentNode; if (w) w.remove(); });
    }

    /* ----- รูปสตอรี่ 1080x1920 วาดด้วย canvas (ตัวอักษรและรูปทรงเท่านั้น) ----- */
    function wrapLines(ctx, text, maxW) {
      var segs = [];
      try { if (window.Intl && Intl.Segmenter) { var sg = new Intl.Segmenter("th", { granularity: "word" }); for (var it of sg.segment(text)) segs.push(it.segment); } } catch (e) { segs = []; }
      if (!segs.length) segs = text.split("");
      var lines = [], cur = "";
      segs.forEach(function (s) {
        if (ctx.measureText(cur + s).width > maxW && cur) { lines.push(cur.trim()); cur = s.trimStart ? s.trimStart() : s; }
        else cur += s;
      });
      if (cur.trim()) lines.push(cur.trim());
      return lines;
    }
    function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
    function buildStory(S) {
      var out = document.getElementById("storyout");
      out.innerHTML = '<p class="small">กำลังสร้างรูป…</p>';
      var fontsReady = (document.fonts && document.fonts.load) ? Promise.all([
        document.fonts.load('700 200px "Kanit"'), document.fonts.load('600 64px "Kanit"'), document.fonts.load('500 36px "IBM Plex Sans Thai"')
      ]).catch(function () {}) : Promise.resolve();
      var icon = new Image(), iconP = new Promise(function (res) { icon.onload = function () { res(true); }; icon.onerror = function () { res(false); }; });
      icon.src = "img/firstthread-icon.png";
      Promise.all([fontsReady, iconP]).then(function (r) {
        var res = drawStory(S, r[1] ? icon : null), url;
        try { url = res.toDataURL("image/png"); } catch (e) { res = drawStory(S, null); url = res.toDataURL("image/png"); }
        showStory(S, res, url);
      }).catch(function () { out.innerHTML = '<p class="warn">สร้างรูปไม่ได้ในเบราว์เซอร์นี้ ลองแคปหน้าจอผลแทน</p>'; });
    }
    function drawStory(S, icon) {
        var W = 1080, H = 1920, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
        var x = cv.getContext("2d");
        var g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, "#FF8A96"); g.addColorStop(1, "#F2566A");
        x.fillStyle = g; x.fillRect(0, 0, W, H);
        x.fillStyle = "rgba(255,255,255,0.12)"; x.beginPath(); x.arc(950, 220, 260, 0, 7); x.fill(); x.beginPath(); x.arc(120, 1750, 300, 0, 7); x.fill();
        var D = "'Kanit', 'Noto Sans Thai', sans-serif", B = "'IBM Plex Sans Thai', 'Noto Sans Thai', sans-serif";
        x.fillStyle = "#FFFFFF"; x.textAlign = "center";
        x.font = "600 54px " + D; x.fillText("คุณเป็นไทป์ไหน?", W / 2, 190);
        rr(x, 70, 260, W - 140, 1340, 56); x.fillStyle = "#FFFFFF"; x.fill();
        x.fillStyle = "#D42A3C"; x.font = "500 40px " + D; x.fillText(S.alt ? "ไทป์ของฉันใกล้เคียง" : "ไทป์ของฉัน", W / 2, 360);
        x.font = "700 " + (S.alt ? 150 : 210) + "px " + D; x.fillText(S.alt ? S.code + " / " + S.alt : S.code, W / 2, S.alt ? 540 : 580);
        x.fillStyle = "#2B1519"; x.font = "600 60px " + D; x.fillText(TYPES[S.code].n, W / 2, 680);
        var st = STACKS[S.code];
        x.fillStyle = "#7A5761"; x.font = "500 38px " + B; x.fillText("หลัก " + st[0] + " · รอง " + st[1], W / 2, 750);
        var fs = FUNCS.slice().sort(function (a, b) { return S.bars[b] - S.bars[a]; });
        x.textAlign = "left";
        fs.forEach(function (f, i) {
          var y = 840 + i * 74;
          x.fillStyle = "#2B1519"; x.font = "600 36px " + D; x.fillText(f, 150, y + 30);
          rr(x, 250, y + 4, 400, 34, 17); x.fillStyle = "#FBE4E8"; x.fill();
          rr(x, 250, y + 4, Math.max(34, 400 * S.bars[f] / 15), 34, 17); x.fillStyle = i < 2 ? "#D42A3C" : "#F59AA6"; x.fill();
          x.fillStyle = "#7A5761"; x.font = "500 28px " + B; x.fillText(FNAME[f], 672, y + 31, 270);
        });
        x.textAlign = "center"; x.fillStyle = "#D42A3C"; x.font = "600 40px " + D; x.fillText(EI_BAND_TXT[S.ei], W / 2, 1490);
        x.fillStyle = "#7A5761"; x.font = "500 28px " + B;
        wrapLines(x, "แบบสะท้อนตัวเองจากฟังก์ชันการคิด 8 แบบ ไม่ใช่แบบทดสอบ MBTI ทางการ และไม่ใช่การวินิจฉัย", 820).forEach(function (l, i) { x.fillText(l, W / 2, 1545 + i * 46); });
        x.fillStyle = "#FFFFFF"; x.font = "600 50px " + D; x.fillText("ลองทำแล้วมาเทียบกัน", W / 2, 1730);
        if (icon) x.drawImage(icon, W / 2 - 250, 1785, 72, 72);
        x.textAlign = "left"; x.font = "600 46px " + D; x.fillText("@firstthread.app", W / 2 - 160, 1838);
        return cv;
    }
    function showStory(S, cv, url) {
        var out = document.getElementById("storyout"), st = STACKS[S.code], fname = "firstthread-" + S.code + ".png";
        var alt = "รูปสตอรี่ผลไทป์ " + typeLine(S) + " หน้าที่หลัก " + st[0] + " รอง " + st[1] + " " + EI_BAND_TXT[S.ei];
        out.innerHTML = '<img class="storyimg" src="' + url + '" alt="' + esc(alt) + '"><p class="small">แตะค้างที่รูปเพื่อบันทึก หรือใช้ปุ่มด้านล่าง</p>' +
          '<div class="sharebtns"><button type="button" class="btn" id="savestory" hidden>บันทึกรูป</button><button type="button" class="btn" id="fullstory">เปิดเต็มจอเพื่อแคป</button></div>';
        document.getElementById("fullstory").addEventListener("click", function () {
          var ov = document.createElement("div"); ov.className = "storyfull"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-label", "การ์ดสตอรี่เต็มจอ");
          ov.innerHTML = '<img src="' + url + '" alt="' + esc(alt) + '"><button type="button" class="btn small" id="closefull">ปิด</button>';
          document.body.appendChild(ov);
          document.getElementById("closefull").addEventListener("click", function () { ov.remove(); });
        });
        downloadsCap().then(function (dl) {
          var sb = document.getElementById("savestory");
          if (!dl || !sb) return;
          sb.hidden = false;
          sb.addEventListener("click", function () {
            cv.toBlob(function (blob) {
              if (!blob) return;
              dl.save({ filename: fname, data: blob }).then(function () { toast("บันทึกรูปแล้ว"); }, function (e) {
                if (e && e.code === "declined") return;
                sb.hidden = true; toast("บันทึกจากปุ่มไม่ได้ในหน้านี้ แตะค้างที่รูปเพื่อบันทึกแทน");
              });
            }, "image/png");
          });
        });
    }

    /* ----- หน้าผลที่มีคนแชร์มา (#s) ----- */
    function renderShared(S) {
      app.innerHTML =
        '<div class="top"><span class="brand">' + BRAND + '</span><span class="count">ผลที่ถูกแชร์</span></div>' +
        '<section class="card result shared">' +
          '<p class="warn">ผลที่ผู้ทำแชร์เอง ไม่ใช่ผลยืนยัน</p>' +
          '<div class="type-head"><span class="small">แชร์เมื่อ ' + dateTxt(S.days) + (S.alt ? ' · ผลก้ำกึ่ง ใกล้เคียงสองประเภท' : '') + '</span><div class="code' + (S.alt ? ' code2' : '') + '">' + esc(S.alt ? S.code + ' / ' + S.alt : S.code) + '</div><h1 class="tname" tabindex="-1" id="h1focus">' + TYPES[S.code].n + '</h1></div>' +
          '<p class="desc">ตามทฤษฎี ประเภทนี้มัก' + TYPES[S.code].d + '</p>' +
          '<h2 class="sec">แถบฟังก์ชัน</h2>' + miniBars(S) +
          '<p class="small">เทียบกันเองในตัวคนนั้น ไม่ใช่เทียบกับคนอื่น · ' + EI_BAND_TXT[S.ei] + '</p>' +
          '<p class="small">แบบสะท้อนตัวเองที่เขียนขึ้นใหม่ ไม่ใช่แบบทดสอบ MBTI ทางการ ยังไม่ผ่านการตรวจสอบความตรง ใช้เพื่อสำรวจตัวเอง ไม่ใช่การวินิจฉัย</p>' +
          '<button type="button" class="btn primary block" id="tryme">ลองทำของคุณ แล้วมาเทียบกัน</button>' +
        '</section>' + '<p class="handle"><img src="img/firstthread-icon.png" alt="" width="22" height="22"><a href="' + IG_URL + '" target="_blank" rel="noopener noreferrer">@firstthread.app</a></p>';
      document.getElementById("tryme").addEventListener("click", function () {
        try { localStorage.setItem(RECV, encodeShare(S)); } catch (e) {}
        var s = loadLocal();
        if (s && replay(s.seed, s.chosen, s.L, s.tape)) { bestFit = s.best || null; cps = s.cps || []; backUsed = true; renderResume("local"); }
        else renderSetup();
      });
      var hf = document.getElementById("h1focus"); if (hf) hf.focus({ preventScroll: true });
    }

    /* ----- เริ่มต้น ----- */
    var h0 = "";
    try { h0 = (location.hash || "").slice(1); } catch (e) {}
    var sh0 = h0.indexOf("s1.") === 0 ? decodeShare(h0) : null;
    if (sh0) renderShared(sh0);
    else if (h0.indexOf("r1.") === 0) {
      var d0 = decodeResume(h0);
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
      if (!d0.err && replay(d0.seed, d0.chosen, d0.L, d0.tape)) { backUsed = true; cps = CHECKPOINTS.filter(function (n) { return n <= answeredCount(); }); save(); renderResume("link"); }
      else renderSetup(RESUME_ERR[d0.err || "bad"]);
    } else {
      var s0 = loadLocal();
      if (s0 && replay(s0.seed, s0.chosen, s0.L, s0.tape)) {
        bestFit = s0.best || null; cps = s0.cps || []; backUsed = true;
        if (s0.ph === 3 && ph === 2) ph = 3;
        if (mainN && firstOpen() < 0 && mineLoaded) renderResult();
        else renderResume("local");
      } else {
        var v10 = null; try { v10 = localStorage.getItem("ft10_progress"); if (v10) localStorage.removeItem("ft10_progress"); } catch (e) {}
        renderSetup(v10 ? "แบบทดสอบที่ทำค้างไว้มาจากเวอร์ชันเก่า คำถามเปลี่ยนไปแล้ว ทำต่อไม่ได้ เริ่มใหม่ได้เลย" : undefined);
      }
    }
  })();
}
