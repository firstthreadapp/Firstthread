ทำมักมาจากความรู้สึกส่วนตัว ถ้าใจไม่ได้อินกับมัน ฉันก็ทำต่อไม่ค่อยลง","Fii1":"เวลาเลือกว่าจะลงเงินกับอะไร ฉันมักเลือกสิ่งที่ใจรู้สึกผูกพัน แม้บางทีจะไม่ใช่ทางที่คุ้มที่สุด","Fik3":"เวลาต้องตัดสินใจเรื่องส่วนตัว ฉันมักถามตัวเองว่าแบบไหนที่ “ใช่” กับฉัน แม้จะอธิบายให้คนอื่นเข้าใจได้ยาก","Fil0":"เวลาว่าง ฉันมักจดหรือขีดเขียนความรู้สึกส่วนตัวเก็บไว้ โดยไม่ได้ตั้งใจให้ใครเห็น","Fim1":"สิ่งที่ฉันโพสต์ต้องตรงกับที่รู้สึกจริง ถ้าไม่ใช่ ฉันยอมไม่โพสต์ แม้จะเป็นช่วงที่ใคร ๆ ก็โพสต์กัน","Fir2":"ถ้าคนใกล้ตัวทำไม่ตรงกับสิ่งที่เขาเองบอกว่าเชื่อ ฉันมักรู้สึกห่างจากเขาไปเงียบ ๆ แม้เขาจะยังดีกับฉัน","Fiv2":"หนังที่กระทบใจ ฉันมักต้องใช้เวลาอยู่กับความรู้สึกนั้นก่อน ถึงจะบอกได้ว่ามันหมายถึงอะไรกับฉัน","Fiz0":"ความฝันของฉันต้องรู้สึกว่าเป็นของฉันจริง ๆ ถ้าเป็นแค่สิ่งที่คนรอบตัวคาดหวัง ฉันก็ไม่ค่อยมีแรงทำ","Nek0":"เจอเรื่องอะไร ฉันมักเห็นทางเลือกหลายแบบผุดขึ้นมาพร้อมกัน จนบางทีเลือกไม่ถูกว่าจะเอาทางไหน","Ner2":"ฉันมักนึกเล่น ๆ ว่าคนใกล้ตัวน่าจะลองเป็นหรือทำอะไรได้อีกหลายแบบ แม้เขาเองจะไม่ได้คิดแบบนั้น","New0":"ในการระดมสมอง ฉันมักโยนไอเดียออกมาหลายทาง จนบางทีทีมต้องช่วยดึงกลับมาที่โจทย์","Ney1":"ถ้ามีคนเล่าหลักใช้ชีวิตที่ฉันเพิ่งเคยได้ยิน ฉันมักอยากรู้ต่อว่าเขาได้มันมาจากไหนและโยงกับอะไรได้บ้าง จนบางทีคุยออกนอกเรื่องไปไกล","Nib1":"เวลาอ่าน ฉันมักสนใจความหมายที่อาจซ่อนอยู่ระหว่างบรรทัด มากกว่าสิ่งที่ผู้เขียนพูดตรง ๆ","Niv0":"เวลาดูหนังหรือซีรีส์ ฉันมักมีความรู้สึกบางอย่างว่าเรื่องกำลังจะไปจบตรงไหน แล้วดูต่อเพื่อเช็กว่าใช่ไหม","Sea1":"ฉันมักหยุดดูสี แสง และพื้นผิวของสิ่งรอบตัว จนบางทีเดินช้ากว่าคนที่มาด้วย","Seg0":"ในเกม ฉันมักกดตอบโต้ตามภาพและเสียงที่โผล่มาทันที แล้วค่อยคิดเรื่องแผนทีหลัง","Sel1":"เวลาว่าง ฉันชอบทำอะไรที่ได้ใช้ประสาทสัมผัสเต็มที่ เช่น ว่ายน้ำหรือเดินตลาด จนลืมเรื่องอื่นไปชั่วขณะ","Ser3":"เวลาอยู่กับคนใกล้ตัว ฉันมักเปลี่ยนแผนไปตามสิ่งที่เจอตรงหน้า เช่น แวะร้านที่เพิ่งเห็นว่าเปิดใหม่","Set2":"ตอนอยู่กับสัตว์เลี้ยง ตาและหูฉันมักจับอยู่กับสิ่งที่เกิดรอบตัวมัน เช่น เสียงแปลก ๆ หรือกลิ่นที่ลอยมา","Sew1":"เมื่อเกิดเหตุไม่คาดฝัน ฉันมักขยับลงมือตามสิ่งที่เห็นตรงหน้าเลย แม้บางทีจะยังไม่ได้คิดให้รอบ","Sey1":"เวลาชีวิตมีเรื่องไม่คาดคิด หลักของฉันคือจัดการสิ่งที่อยู่ตรงหน้าให้ได้ก่อน แม้ภาพรวมของเรื่องจะยังไม่ชัดเลย","Sii1":"ฉันมักเลือกลงทุนในของที่คุ้นเคยหรือใช้อยู่ทุกวัน มากกว่ากิจการที่ยังไม่รู้จัก แม้จะพลาดโอกาสใหม่บางอย่าง","Siv0":"ฉันชอบดูหนังหรือซีรีส์เรื่องโปรดซ้ำหลายรอบ เพราะได้ความสุขแบบคุ้นเคยกลับมาอีก","Siy2":"ก่อนเรื่องสำคัญ ฉันมักทำเช้าวันนั้นให้เหมือนวันปกติที่คุ้น เช่น กินมื้อเช้าแบบเดิมหรือนั่งรถสายเดิม แม้ต้องตื่นเช้ากว่าปกติ","Tek2":"ฉันเชื่อตัวเลขและหลักฐานมากกว่าคำบอกเล่า จนบางทีคนที่เล่าให้ฟังรู้สึกว่าฉันไม่ค่อยเชื่อเขา","Tem2":"เมื่อเห็นข้อมูลผิดในกลุ่มแชท ฉันมักส่งลิงก์ข้อมูลที่ตรวจได้ไปเลย แม้บางคนจะรู้สึกว่าจริงจังไป","Tep0":"ฉันบันทึกตัวเลขการซ้อมแทบทุกรอบ เช่น ระยะหรือเวลา จนบางทีสนุกน้อยลงเพราะคิดแต่ตัวเลข","Ter1":"ฉันมักเป็นคนวางแผนเรื่องที่ทำร่วมกับคนใกล้ตัว เช่น ทริปหรือกิจกรรม ให้มีตารางชัด แม้บางคนอยากไปแบบสบาย ๆ","Tew1":"เมื่อเห็นขั้นตอนที่เสียเวลาโดยไม่จำเป็น ฉันมักอยากรีบปรับทันที แม้คนอื่นจะยังคุ้นกับแบบเดิม","Tey3":"เวลาลองหลักคิดใหม่ ๆ เช่น “ทำทีละอย่าง” ฉันมักจดว่ามันเปลี่ยนวันของฉันไปแค่ไหน ถ้าไม่เห็นผลก็เลิกแล้วลองแบบอื่น","Tia2":"เวลาดูงานศิลปะ ฉันมักดูว่าแนวคิดของงานต่อกันลงตัวในตัวมันเองไหม","Tid1":"เวลาชิมอาหาร ฉันชอบแยกรสในหัวเป็นเปรี้ยว เค็ม หวาน แล้วคิดว่าแต่ละรสทำหน้าที่อะไรในจาน","Tij2":"เวลามีคนแนะนำเส้นทางเที่ยวมา ฉันชอบไล่คิดเองก่อนว่าทำไมต้องเรียงแบบนั้น แม้จะช้ากว่าทำตามไปเลย","Tik3":"ระหว่างคุย ถ้าคำสำคัญยังหมายถึงได้หลายแบบ ฉันมักนึกในใจว่ามันหมายถึงอะไรแน่ แม้บางช่วงจะตามบทสนทนาไม่ทัน","Tim2":"ก่อนกดแชร์อะไร ฉันมักไล่เช็กว่าเหตุผลในโพสต์ต่อกันติดไหม จนบางทีแชร์ช้ากว่าคนอื่น","Tir2":"เวลาอธิบายความคิดให้คนใกล้ตัวฟัง ฉันมักอยากใช้คำให้ตรงกับที่คิดเป๊ะ ๆ แม้เขาไม่ได้ต้องการละเอียดขนาดนั้น","Tiu2":"เวลาคุยกันว่าเพลงไหนดี ฉันอยากอธิบายได้ว่าดีตรงไหนเพราะอะไร ไม่ใช่แค่บอกว่าชอบ","Tiw2":"ก่อนเริ่มถกประเด็นในงาน ฉันชอบนิยามคำและแนวคิดให้ชัดก่อน แม้บางคนอยากข้ามไปคุยเรื่องหลักเลย","Tiy1":"เวลาฟังคำคมหรือสูตรใช้ชีวิตที่คนแชร์กัน ฉันชอบแยกดูว่าส่วนไหนเหตุผลต่อกันจริง ส่วนไหนเป็นแค่ความเห็นของคนพูด แม้จะฟังไม่ค่อยสนุก","BNeSi1":{"a":"เวลาเลือกที่กินข้าว ฉันมักอยากลองร้านใหม่ที่ยังไม่ได้ไป แม้อาจไม่ถูกปาก","b":"เวลาเลือกที่กินข้าว ฉันมักอยากไปร้านเดิมที่รู้รสอยู่แล้ว แม้จะไม่ได้เจออะไรใหม่"},"BNeSi7":{"a":"เมื่อเจอของใหม่ ฉันมักนึกต่อว่ามันเอาไปใช้แบบไหนได้อีกบ้าง","b":"เมื่อเจอของใหม่ ฉันมักเทียบกับของเดิมที่เคยใช้ว่าต่างกันตรงไหน"},"BNeSih1":{"a":"คนที่ใช่ คือคนที่ชวนฉันไปลองอะไรใหม่ ๆ ด้วยกันอยู่เรื่อย ๆ","b":"คนที่ใช่ คือคนที่ทำเรื่องเดิม ๆ ด้วยกันได้สบาย ๆ เหมือนอยู่บ้าน"},"BNiSe5":{"a":"ฉันมักตัดสินใจโดยยึดภาพที่มองไว้ในระยะยาว แม้บางทีจะพลาดโอกาสตรงหน้าไป","b":"ฉันมักตัดสินใจตามสถานการณ์ตรงหน้า แม้บางทีจะออกนอกภาพที่ตั้งใจไว้แต่แรก"},"BTeFi1":{"a":"เวลาทำงานของตัวเอง ฉันมักยึดแผนและเกณฑ์ที่ตั้งไว้ แม้บางส่วนจะไม่ค่อยเป็นแบบของฉัน","b":"เวลาทำงานของตัวเอง ฉันมักยึดสิ่งที่ฉันให้ค่าเป็นหลัก แม้บางส่วนจะไม่ตรงตามแผน"},"BTeFi2":{"a":"เห็นวิธีทำงานในกลุ่มที่ฉันไม่โอเค ฉันมักดูว่ามันเสียเวลาตรงไหน แล้วเสนอขั้นตอนที่สั้นกว่า แม้บางคนจะยังชินกับแบบเดิม","b":"เห็นวิธีทำงานในกลุ่มที่ฉันไม่โอเค ฉันมักดูว่ามันขัดกับสิ่งที่ฉันให้ค่าตรงไหน แล้วทำส่วนของฉันในแบบที่สบายใจ แม้จะดูไม่เข้าพวก"},"BTeFih0":{"a":"ฉันดูความจริงจังของอีกฝ่ายจากแผนที่เขาวาง และการที่เขาทำตามนั้นจริง","b":"ฉันดูความจริงจังของอีกฝ่ายจากว่าเขาให้ค่ากับสิ่งเดียวกับที่ฉันให้ค่าไหม"},"BTeFii1":{"a":"เวลาหุ้นที่ถือขาดทุนถึงจุดที่ตั้งไว้ ฉันมักขายตามกฎที่วางไว้ทันที แม้บางครั้งราคาจะดีดกลับหลังขายไปไม่นาน","b":"เวลาหุ้นที่ถือขาดทุนถึงจุดที่ตั้งไว้ ฉันมักถามตัวเองก่อนว่าบริษัทยังทำสิ่งที่ฉันเชื่ออยู่ไหม แม้บางครั้งราคาจะลงต่ออีก"},"BTeFin1":{"a":"อ่านข่าว ฉันมักโฟกัสที่ตัวเลขและผลกระทบว่าใครต้องทำอะไรต่อ","b":"อ่านข่าว ฉันมักโฟกัสว่าเรื่องนี้แตะสิ่งที่ฉันให้ค่าตรงไหน"},"BTeFiu0":{"a":"เวลาฟังเพลงไปทำงานไป ฉันมักเลือกเพลงตามว่าช่วยให้งานเดินไหม แม้ฟังทั้งวันแล้วจะไม่ได้รู้สึกอะไรเลย","b":"เวลาฟังเพลงไปทำงานไป ฉันมักเลือกเพลงตามที่ใจอยากฟังตอนนั้น แม้บางเพลงจะพาใจลอยไปจากงานบ้าง"},"BTeFiy1":{"a":"สำหรับฉัน หลักคิดที่หยิบมาใช้บ่อยคือหลักที่เอาไปจัดการเรื่องตรงหน้าได้จริง แม้บางข้อจะไม่ค่อยตรงกับตัวตนของฉัน","b":"สำหรับฉัน หลักคิดที่หยิบมาใช้บ่อยคือหลักที่ตรงกับตัวตนลึก ๆ ของฉัน แม้บางข้อจะเอาไปใช้กับเรื่องตรงหน้าได้ไม่ค่อยตรง"},"BTeFiz1":{"a":"เวลาคิดถึงความฝัน ฉันมักถามว่าต้องได้ผลอะไรที่วัดได้บ้างถึงจะนับว่าใกล้ขึ้น แม้ฝันจะดูแห้งลงไปหน่อย","b":"เวลาคิดถึงความฝัน ฉันมักถามว่ามันยังตรงกับสิ่งที่ใจให้ค่าอยู่ไหม แม้จะบอกไม่ได้ว่าใกล้ขึ้นแค่ไหน"},"BTiFe4":{"a":"เวลาฟังคนอธิบายอะไร ฉันมักไล่ดูว่าแต่ละขั้นต่อกันติดไหม จนบางทีไม่ได้ฟังว่าเขารู้สึกอะไร","b":"เวลาฟังคนอธิบายอะไร ฉันมักฟังว่าเขากำลังรู้สึกอย่างไร จนบางทีไม่ได้ฟังว่าเนื้อหาคืออะไร"},"BTiFeh1":{"a":"เวลาคนที่รักเล่าปัญหา ฉันมักช่วยเขาไล่ดูว่าต้นเรื่องอยู่ตรงไหน ให้เขาเห็นภาพชัดขึ้น แม้เขาอาจแค่อยากระบาย","b":"เวลาคนที่รักเล่าปัญหา ฉันมักพูดคล้อยตามความรู้สึกเขาไปก่อน แม้บางคำจะไม่ตรงกับที่ฉันคิดจริง"},"BTiFej1":{"a":"เวลาทริปมีปัญหา ฉันมักไล่ดูก่อนว่ามันเกิดจากอะไร จนเข้าใจว่าต้นเหตุจริงคืออะไร แม้บรรยากาศในกลุ่มจะยังไม่ดีขึ้น","b":"เวลาทริปมีปัญหา ฉันมักอยากให้บรรยากาศในกลุ่มกลับมาก่อน แม้เรื่องเดิมอาจเกิดซ้ำในวันถัดไป"},"BTiFez1":{"a":"ความฝันของฉันมักผูกกับการได้เข้าใจเรื่องที่สนใจจนต่อกันครบ แม้คนรอบตัวจะไม่ได้สนใจด้วย","b":"ความฝันของฉันมักผูกกับสิ่งที่คนรอบตัวเห็นว่ามีค่าร่วมกัน แม้จะไม่ใช่เรื่องที่ฉันสนใจที่สุด"},"EIeq3":{"E":"ในวงคุยกับเพื่อน ฉันชอบให้วงคึกคัก มีเสียงหัวเราะ และคุยกันเร็ว ๆ","I":"ในวงคุยกับเพื่อน ฉันชอบให้วงสบาย ๆ คุยกันช้า ๆ และเงียบไปบ้างได้"},"EIir0":{"E":"ไปงานที่ไม่รู้จักใคร ฉันมักเดินไปทักคนที่อยู่ใกล้ ๆ ก่อน แล้วค่อยคุยต่อ แม้บางวงจะคุยกันแค่ผิว ๆ","I":"ไปงานที่ไม่รู้จักใคร ฉันมักดูบรรยากาศสักพัก แล้วคุยกับคนที่นั่งข้าง ๆ แม้จะได้รู้จักคนไม่กี่คน"},"EIir3":{"E":"ในวงที่มีคนใหม่ ๆ ฉันมักเป็นคนเปิดเรื่องคุยก่อน แล้วดูว่าใครจะคุยต่อ","I":"ในวงที่มีคนใหม่ ๆ ฉันมักฟังก่อนว่าแต่ละคนสนใจอะไร แล้วค่อยคุยต่อจากตรงนั้น"},"Feg0":"ในเกมทีม ถ้าเพื่อนเริ่มเสียงแข็งใส่กัน ฉันมักหยอดมุกให้บรรยากาศเบาลง แม้ต้นเรื่องที่ทะเลาะจะยังค้างอยู่","Feh3":"ในความรัก ฉันมักแสดงความรักตามแบบที่อีกฝ่ายชอบ จนบางทีทำออกมาเก้ ๆ กัง ๆ เพราะไม่ใช่แบบของฉัน","Fen1":"เวลาอ่านข่าว ฉันมักนึกถึงความรู้สึกของคนในเหตุการณ์ก่อน จนบางทีข้ามรายละเอียดว่าเกิดอะไรขึ้นจริงไป","Fep1":"ถ้าเพื่อนร่วมทีมดูหมดกำลังใจ ฉันมักเข้าไปพูดปลุกใจทันที ทั้งที่บางทีเขาอยากอยู่เงียบ ๆ มากกว่า","Fer3":"กับคนในบ้าน ฉันมักยอมถอยในเรื่องเล็ก ๆ ให้บรรยากาศดี จนบางทีเรื่องที่ค้างใจก็ไม่ได้พูดออกไป","Fes2":"เรียนอะไรใหม่มา ฉันมักนึกก่อนว่าคนใกล้ตัวน่าจะสนุกกับส่วนไหน แล้วเล่าแค่ส่วนนั้น จนบางทีเนื้อหาจริงแทบไม่ได้พูดถึง","Fey3":"ถ้าเพื่อนกำลังไม่สบายใจแล้วเล่าคติที่เขายึดไว้ให้ฟัง ฉันมักพยักหน้าตามให้เขามีแรง แม้ในใจจะไม่ได้คิดแบบนั้น","Fez2":"เวลาเล่าความฝันให้คนอื่นฟัง ฉันมักเล่าแค่ส่วนที่คนฟังน่าจะโอเค จนภาพที่อยากได้จริง ๆ แทบไม่มีใครรู้","Fia2":"ฉันมักตัดสินว่างานศิลปะชิ้นไหนดี จากว่ามันกระทบใจฉันจริงไหม แม้คนส่วนใหญ่จะชอบชิ้นอื่น","Fig1":"ในเกม ฉันมักเลือกตัวละครหรือสไตล์ที่รู้สึกว่าเป็นตัวเอง แม้จะไม่ใช่ทางที่ชนะง่ายที่สุด","Fil3":"เวลาว่าง ฉันชอบทำเรื่องที่ใจฉันผูกพันเป็นพิเศษ แม้คนอื่นจะมองว่าไม่เห็นได้อะไร","Fip1":"ถ้าทีมเลือกวิธีเล่นที่ฉันรู้สึกว่าไม่ใช่ตัวเอง ฉันมักเล่นตามได้แต่ใจไม่ค่อยไปด้วย จนสนุกน้อยลงไปเยอะ","Fit0":"เรื่องเลี้ยงสัตว์ ฉันมักตัดสินใจตามสิ่งที่ใจฉันเห็นว่าใช่ แม้คนรอบตัวจะแนะนำอีกทาง","Fiw0":"ในงาน ฉันมักค่อย ๆ ปรับส่วนที่ฉันทำให้ตรงกับแบบที่ใจฉันรู้สึกว่า “ใช่” แม้จะต้องใช้เวลาเพิ่มอีกหน่อย","Nek1":"ความคิดของฉันมักกระโดดจากเรื่องหนึ่งไปอีกเรื่องที่เชื่อมกัน จนบางทีคนฟังตามไม่ทัน","New1":"ในงาน ฉันมักโยงเรื่องที่ดูไม่เกี่ยวกันเข้าหากัน จนบางทีไอเดียไปไกลกว่าที่งานต้องการ","Nez0":"ฉันมักมีความฝันหลายอันพร้อมกัน เพราะนึกถึงทางใหม่ ๆ ที่ชีวิตอาจเป็นได้อยู่เรื่อย ๆ จนเลือกไม่ค่อยถูก","Nig2":"ในเกม ฉันมักมีภาพในหัวว่าอีกฝ่ายกำลังจะทำอะไร แล้วเล่นดักทางนั้นไว้ แม้บางทีจะเดาผิดทั้งตา","Nip0":"เวลาเล่นกีฬา ฉันมักรู้สึกว่าเกมกำลังจะไปทางไหน แล้วเล่นเผื่อทางนั้นไว้ก่อน แม้บางทีมันจะไม่ไปทางนั้นเลย","Niv2":"หนังที่ฝังใจฉันมักเป็นเรื่องที่ทำให้ภาพบางอย่างของชีวิตชัดขึ้นมา แล้วติดอยู่ในหัวไปอีกนาน","Sej0":"สิ่งที่ฉันชอบที่สุดตอนเที่ยวคือได้ลองจริงกับตัว เช่น ลงเล่นน้ำ เดินขึ้นเขา หรือชิมสตรีทฟู้ดของที่นั่น","Seu2":"เวลาฟังเพลง ฉันมักจับรายละเอียดของเสียง เช่น เบสแน่นไหม เสียงร้องใสไหม จนบางทีลืมฟังเนื้อเพลง","Sii0":"ฉันมักลงทุนแบบเดิมเป็นประจำ เช่น ซื้อเท่า ๆ กันทุกเดือน แม้บางช่วงจะพลาดจังหวะที่คนอื่นได้กันเยอะ","Sij1":"เวลาจัดกระเป๋า ฉันมักมีลิสต์ของที่พกเป็นประจำ และจัดวางแบบเดิมจนชินมือ","Siu0":"เพลงเก่าที่ชอบ ฉันมักฟังวนเป็นปี ๆ และเปิดทีไรก็พากลับไปยังความรู้สึกเดิม","Siw1":"ในงาน ฉันมักใช้ขั้นตอนเดิมที่เคยใช้มาแล้ว แม้จะมีวิธีใหม่ที่คนอื่นกำลังลองกัน","Siy1":"หลักใช้ชีวิตหลายข้อของฉันผูกอยู่กับเหตุการณ์ที่ยังนึกภาพออกเหมือนเพิ่งผ่านมา แม้ชีวิตตอนนี้จะต่างจากตอนนั้นไปมากแล้ว","Teg2":"ในเกม ฉันมักเปิดดูสถิติของตัวเองเพื่อหาว่าต้องปรับอะไร จนบางทีเล่นเพื่อตัวเลขมากกว่าเพื่อสนุก","Tek1":"ฉันมักจับเวลาเรื่องที่ทำซ้ำทุกวัน แล้วหาทางตัดให้สั้นลง จนคนในบ้านว่าจริงจังเกินเรื่อง","Tep2":"ในทีมกีฬา ฉันมักเป็นคนกำหนดแผนและตำแหน่งให้ทุกคน แม้บางคนจะอยากเล่นตำแหน่งอื่น","Ter2":"ถ้าคนใกล้ตัวไม่ทำตามที่ตกลงกันไว้ เช่น เรื่องแบ่งงานบ้าน ฉันมักทวงตรง ๆ แม้บรรยากาศจะกร่อยไปบ้าง","Teu1":"ฉันมักใช้เพลงเป็นตัวจับเวลา เช่น ตั้งใจทำงานให้จบภายในหนึ่งเพลย์ลิสต์ จนบางทีฟังแทบไม่รู้เรื่องว่าเพลงอะไร","Tev2":"ฉันมักให้คะแนนหนังเป็นข้อ ๆ เช่น บท การแสดง จังหวะ แล้วรวมเป็นคะแนนเดียว จนบางทีเพื่อนว่าดูหนังเหมือนตรวจงาน","Tib0":"เวลาอ่านงานที่ให้เหตุผล ฉันมักไล่ทีละขั้นว่าเหตุผลต่อกันได้จริงไหม จนบางทีอ่านเล่มเดียวอยู่นาน","Til1":"เวลาว่าง ฉันมักหยิบปริศนาหรือเกมที่ต้องไล่เหตุผลทีละขั้นมาเล่น จนบางทีติดอยู่ข้อเดียวเป็นชั่วโมง","Tim1":"เวลาเห็นโพสต์ที่แชร์กันเยอะ ฉันมักไล่ดูในใจเงียบ ๆ ว่าเหตุผลในนั้นต่อกันทุกขั้นไหม แม้จะเสียเวลากับโพสต์เดียวนาน","Tin0":"อ่านข่าวแล้ว ฉันมักไล่เองในหัวว่าข้อสรุปของคนเขียนต่อจากข้อมูลได้จริงไหม จนอ่านได้ทีละไม่กี่ข่าว","Tir3":"ระหว่างคุยกับคนในบ้าน ฉันมักไล่เช็กในหัวว่าเหตุผลของแต่ละคนต่อกันติดไหม จนบางทีหลุดจากอารมณ์ของวง","Tiv0":"เวลาดูหนัง ฉันมักสะดุดกับพล็อตที่ไม่ต่อกัน หรือตัวละครที่ทำขัดกับกติกาของเรื่องเอง จนบางทีดูไม่ค่อยอิน","Tiz0":"ก่อนจะเอาจริงกับความฝันไหน ฉันต้องเข้าใจก่อนว่ามันทำงานยังไง และอะไรทำให้มันเป็นไปได้ แม้จะทำให้เริ่มช้า","Nek5":"ระหว่างคุย ฉันมักนึกถึงเรื่องอื่นที่เชื่อมกันได้ แล้วชวนคุยต่อไปทางนั้น แม้บางทีจะต้องวนกลับ เกินเหตุ","Fiz1":"ฉันเลือกเส้นทางจากความรู้สึกว่า “ใช่” จนคนรอบตัวต้องถามว่าคิดเรื่องเงินหรือยัง","Fii0":"ธุรกิจไหนทำสิ่งที่ใจฉันรับไม่ได้ ฉันมักไม่ลงเงิน แม้จะเสียดายเมื่อเห็นคนอื่นได้กำไร","Fik4":"ถ้าทางเลือกดูดีพอ ๆ กัน ฉันมักเลือกทางที่ใจรู้สึกว่าเป็นตัวเองมากกว่า แม้อีกทางจะได้เปรียบกว่านิดหน่อย","Few3":"เวลาเพื่อนร่วมงานไม่ลงรอยกัน ฉันมักเข้าไปคุยกับทั้งสองฝ่ายเอง จนบางทีถูกมองว่ายุ่งเรื่องที่ไม่ใช่ของตัวเอง","Fer2":"ถ้าคนใกล้ตัวเริ่มหงุดหงิด ฉันมักรีบหาอะไรมาทำให้เขาอารมณ์ดีขึ้น จนบางทีเขารำคาญกว่าเดิม","Fel0":"เวลานัดเพื่อน ฉันมักรอจนทุกคนโอเคก่อนค่อยสรุปที่นัด จนบางทีนัดลากไปหลายวันกว่าจะได้เจอกันจริง","Fel2":"ถ้าเพื่อนขอให้ไปเป็นเพื่อน ฉันมักตอบตกลงทันที แล้วค่อยมานึกเสียดายแผนของตัวเองที่ต้องยกเลิกทีหลัง","Fel3":"ฉันมักดูซีรีส์ที่เพื่อนดูกัน เพื่อจะได้อินด้วยกัน แม้ไม่ใช่แนวฉัน","Fes0":"เวลาเรียนเป็นกลุ่ม ฉันมักคอยดูสีหน้าว่าใครเริ่มงง แล้วขอให้วงช้าลง จนคนที่ตามทันแล้วเริ่มหงุดหงิด","Fes1":"ถ้าใครในเวิร์กช็อปหรือคลาสออนไลน์เปิดไมค์ตอบแล้วติดขัด ฉันมักเขินแทนจนฟังต่อไม่ค่อยเข้าหัว","Feb0":"ฉันมักเล่าหนังสือเล่มที่คิดว่าคนฟังจะอิน แม้ไม่ใช่เล่มที่ฉันชอบที่สุด","Feb2":"อ่านหนังสือจบ ฉันมักนึกว่าคนใกล้ตัวจะรู้สึกเหมือนกันไหม จนความรู้สึกของตัวเองไม่ค่อยชัด","Fem1":"ก่อนโพสต์ ฉันมักนึกว่าใครอ่านแล้วจะคิดมากไหม จนบางทีลบทิ้งทั้งโพสต์ ไม่ได้พูดสิ่งที่อยากพูดเลย","Feg2":"ปาร์ตี้เกม ถ้าเห็นใครหน้าเสียเพราะแพ้บ่อย ฉันมักแอบออมมือ จนคนที่กำลังสนุกบ่นว่าเกมไม่มัน","Fev2":"เลือกหนังดูกับกลุ่ม ฉันมักเลือกเรื่องที่ไม่มีใครค้าน แม้จะไม่มีใครอินจริงสักคน","Fep2":"ในทีม ถ้าเห็นเพื่อนคนไหนเริ่มเสียกำลังใจ ฉันมักเข้าไปพูดเชียร์ จนบางทีตัวเองหลุดโฟกัสเกมไปพักหนึ่ง","Fea1":"ทำงานศิลปะกับกลุ่ม ฉันมักปรับส่วนของตัวเองตามกลุ่ม จนแทบไม่เหลือลายมือฉัน","Feh0":"ถ้าคนที่คบอารมณ์ไม่ดี ฉันมักลดเรื่องของตัวเองลงแล้วคอยดูว่าเขาอยากได้อะไร จนเรื่องที่ตั้งใจจะเล่าก็เก็บไว้ก่อน","Feh1":"ก่อนพาแฟนไปเจอเพื่อนกลุ่มใหญ่ ฉันมักกังวลว่าทุกฝ่ายจะเข้ากันได้ไหม จนไปถึงก็เกร็งเองทั้งงาน","Feh2":"เวลาผิดใจกับคนที่คบ ฉันมักรีบง้อก่อนเพราะทนบรรยากาศอึมครึมไม่ไหว จนเรื่องที่ตัวเองไม่พอใจก็ไม่ได้พูด","Fey0":"หลักของฉันคือถ้าเพื่อนชวนไปงานวันเกิด ก็มักรีบตอบรับไว้ก่อนเพราะกลัวเขาจะรู้สึกว่าไม่มีใครไป ทั้งที่งานนั้นอาจมีคนไปเต็มอยู่แล้ว","Fey2":"อยู่กับกลุ่มเพื่อน ฉันมักทำตามสิ่งที่กลุ่มถือกันในเรื่องเล็ก ๆ เช่น ต้องถ่ายรูปก่อนกิน แม้ปกติฉันจะไม่ได้ทำแบบนั้นเลย","Fez1":"เวลาเล่าความฝันให้คนใกล้ตัวฟัง ฉันมักเลือกเล่าส่วนที่เขาน่าจะอินด้วย จนบางทีส่วนที่ฉันอยากทำที่สุดไม่ได้พูดถึงเลย","Fez3":"เลือกเส้นทาง ฉันมักนึกก่อนว่าคนที่แคร์จะรู้สึกยังไง จนตัดบางทางทิ้งทั้งที่ยังไม่ได้ถามเขา","Fej0":"เวลาเที่ยวเป็นกลุ่ม ถ้าเห็นใครเริ่มเงียบ ฉันมักเดาว่าเขาเบื่อแล้วรีบชวนย้ายที่ จนคนอื่นงงว่าทำไมต้องรีบ","Fej1":"ระหว่างทริป ถ้าคนส่วนใหญ่อยากเปลี่ยนแผน ฉันมักเออออตาม แล้วค่อยมาเสียดายที่ที่ตั้งใจไว้","Fen0":"คุยข่าวที่วงเห็นต่างกันแรง ๆ ฉันมักพูดแค่จุดที่ทุกคนเห็นตรงกัน จนดูเหมือนไม่มีความเห็น","Fen3":"มีข่าวร้ายทีไร ฉันมักทักถามเพื่อนว่าโอเคไหม แม้เขาจะไม่ได้รู้สึกอะไรกับข่าวนั้น","Fei0":"เวลาเพื่อนสนิทชวนลงขันทำอะไรด้วยกัน ฉันมักตกลงเพราะไม่อยากให้วงกร่อย แม้เงินก้อนนั้นจะกันไว้ทำเรื่องของตัวเอง","Fei2":"เวลาวงเพื่อนคุยเรื่องเงิน ฉันมักรีบเปลี่ยนเรื่องทันทีที่คิดว่ามีคนอึดอัด แม้บางทีเขากำลังอยากปรึกษาอยู่พอดี","Feu0":"เวลาเปิดเพลงในรถหรือในวง ฉันมักเลือกเพลงที่ทุกคนร้องตามได้ แม้จะเป็นเพลงที่ฉันฟังจนเบื่อแล้ว","Fek0":"ฉันมักเผลอเปลี่ยนน้ำเสียงตามอารมณ์คนที่คุยด้วย จนบางทีเหนื่อยเอง","Fek1":"ถ้ามีใครในวงดูเหมือนตามเรื่องไม่ทัน ฉันมักหยุดเล่าย้อนให้เขาฟัง จนเรื่องที่วงกำลังคุยสนุกสะดุดไปหลายรอบ","BNiSe4":{"a":"ในวันว่าง ฉันมักปล่อยใจนึกถึงภาพข้างหน้าว่าชีวิตกำลังไปทางไหน จนบางทีไม่ได้ออกไปทำอะไรเลย","b":"ในวันว่าง ฉันมักออกไปหาอะไรทำตามที่สะดุดตาตอนนั้น จนบางทีกลับมาเหนื่อยกว่าตอนเริ่ม"},"BNiSe7":{"a":"เวลาเจอปัญหา ฉันมักนิ่งคิดจนรู้สึกว่าเห็นต้นตอก่อน แม้ระหว่างนั้นปัญหาจะค้างอยู่","b":"เวลาเจอปัญหา ฉันมักลงมือลองแก้เลย แล้วปรับจากผลตรงหน้า แม้บางทีจะแก้ผิดจุดไปก่อน"},"BNeSi5":{"a":"ระหว่างทำงาน ฉันมักเห็นทางเลือกใหม่ผุดขึ้นมาแล้วอยากลอง แม้งานจะออกมาต่างจากที่ตั้งใจไว้","b":"ระหว่างทำงาน ฉันมักนึกถึงวิธีที่เคยใช้มาก่อน แล้วทำตามวิธีนั้นต่อ แม้งานจะออกมาคล้ายครั้งก่อน ๆ"},"BTiFe3":{"a":"เวลาคุยกันในกลุ่ม ฉันมักฟังว่าเหตุผลของแต่ละคนต่อกันได้จริงไหม แม้บางทีจะยังติดอยู่ที่ประเด็นก่อนหน้า","b":"เวลาคุยกันในกลุ่ม ฉันมักดูว่าแต่ละคนรู้สึกอย่างไรและยังโอเคกันอยู่ไหม แม้บางทีจะตามเนื้อหาที่คุยไม่ทัน"},"BTiFe6":{"a":"เวลาตัดสินใจ ฉันมักถามตัวเองว่า “เหตุผลของเรื่องนี้ลงตัวในหัวฉันไหม” แม้บางทีจะคิดนานจนเรื่องเลยไปแล้ว","b":"เวลาตัดสินใจ ฉันมักถามตัวเองว่า “คนรอบตัวจะรู้สึกอย่างไรกับเรื่องนี้” แม้บางทีจะถามคนนั้นคนนี้จนเรื่องเลยไปแล้ว"},"BTeFi3":{"a":"เวลาทำงานกลุ่ม ฉันมักให้น้ำหนักกับสิ่งที่ทำให้งานเดินหน้าและวัดผลได้ แม้งานจะดูแห้งและไม่ค่อยมีใครอิน","b":"เวลาทำงานกลุ่ม ฉันมักให้น้ำหนักกับว่างานนั้นมีความหมายกับฉันไหม แม้จะบอกเป็นตัวเลขไม่ได้ว่าคืบไปแค่ไหน"},"BTeFi5":{"a":"ฉันมักจัดของในห้องตามว่าหยิบใช้อะไรบ่อย แม้ห้องจะดูไม่ค่อยเป็นสไตล์ของฉัน","b":"ฉันมักจัดของในห้องตามว่าชิ้นไหนมีความหมายกับฉัน แม้บางชิ้นที่ใช้บ่อยจะหยิบยากขึ้น"},"BTeFi6":{"a":"เมื่อทีมไม่ลงรอย ฉันมักเสนอให้ใช้ตัวเลขหรือเกณฑ์ที่วัดได้มาตัดสิน แม้บางคนจะรู้สึกว่าเรื่องของเขาถูกลดเหลือแค่ตัวเลข","b":"เมื่อทีมไม่ลงรอย ฉันมักกลับไปดูก่อนว่าทางไหนตรงกับสิ่งที่ฉันให้ค่าที่สุด แม้ทีมจะยังไม่รู้ว่าฉันเอนไปทางไหน"},"BTeFi7":{"a":"เรื่องใหญ่อย่างการย้ายงาน ฉันมักเทียบเงื่อนไขที่จับต้องได้ เช่น รายได้ เวลา การเดินทาง แม้งานนั้นจะไม่ค่อยตรงกับใจ","b":"เรื่องใหญ่อย่างการย้ายงาน ฉันมักดูว่างานนั้นตรงกับสิ่งที่ฉันให้ค่าไหมเป็นหลัก แม้รายได้หรือเวลาจะด้อยกว่าที่อื่น"},"BTeFih1":{"a":"ถ้าความสัมพันธ์มีปัญหา ฉันมักชวนคุยว่าต้องเปลี่ยนอะไรบ้างให้เป็นข้อตกลงที่ทำได้จริง แม้บรรยากาศจะเหมือนคุยงานไปหน่อย","b":"ถ้าความสัมพันธ์มีปัญหา ฉันมักถามตัวเองก่อนว่าเรื่องนี้แตะสิ่งที่ฉันให้ค่าตรงไหน แม้อีกฝ่ายจะยังไม่รู้ว่าฉันคิดอะไรอยู่"},"BTeFiy0":{"a":"ฉันเลือกแนวทางชีวิตจากว่ามันพาไปถึงเป้าที่วัดได้ไหม แม้จะไม่ค่อยตรงกับใจ","b":"ฉันเลือกแนวทางชีวิตจากว่าใจรู้สึกว่าใช่ไหม แม้จะวัดผลออกมาไม่ได้ชัด"},"BNeSiz0":{"a":"ความฝันของฉันมักแตกออกไปได้หลายทาง และอยากลองหลายแบบ แม้จะยังไม่ได้ลงลึกสักทาง","b":"ความฝันของฉันมักต่อยอดจากสิ่งที่ทำอยู่และคุ้นเคย แม้จะไม่ค่อยได้ลองทางที่ต่างออกไป"},"BNiSej0":{"a":"ทริปที่ดีคือทริปที่กลับมาแล้วเห็นภาพชัดขึ้นว่าชีวิตตัวเองกำลังไปทางไหน","b":"ทริปที่ดีคือทริปที่ได้ซึมซับรส กลิ่น เสียง และผู้คนตรงหน้าเต็มที่"},"BNeSij1":{"a":"ระหว่างทริป ฉันมักนึกต่อว่าจากตรงนี้ไปไหนต่อได้อีกบ้าง แล้วลองไปทางที่ยังไม่รู้จัก แม้บางทางจะเสียเวลาเปล่า","b":"ระหว่างทริป ฉันมักเลือกร้านหรือที่แวะแบบที่คล้ายกับที่เคยชอบ แม้จะไม่ค่อยได้เจออะไรแปลกใหม่"},"BTiFej0":{"a":"เลือกที่พักกับแก๊ง ฉันมักตั้งเกณฑ์ในหัวว่าอะไรสำคัญกว่า แล้วไล่เทียบทีละที่ แม้จะใช้เวลาเลือกนานไปหน่อย","b":"เลือกที่พักกับแก๊ง ฉันมักดูว่าที่ไหนทุกคนโอเคด้วย แล้วเลือกที่นั้น แม้บางทีจะได้ที่ที่ไม่มีใครชอบเป็นพิเศษ"},"BTeFin0":{"a":"ฉันมักอ่านข่าวที่เอาไปใช้ตัดสินใจเรื่องงานหรือเงินได้ แม้จะไม่ได้อินด้วย","b":"ฉันมักอ่านข่าวเรื่องที่ใจฉันแคร์ แม้จะไม่ได้เอาไปใช้ตัดสินใจอะไรต่อ"},"BTiFeu1":{"a":"เปิดเพลงในวง ฉันมักเลือกเพลงที่โครงเพลงเรียบเรียงลงตัวในความเห็นฉัน แม้บางเพลงคนในวงจะไม่คุ้น","b":"เปิดเพลงในวง ฉันมักเลือกเพลงที่ทุกคนร้องตามได้ แม้จะเป็นเพลงที่ฟังกันจนเบื่อแล้ว"},"EIen3":{"E":"นั่งรถไปไหนนาน ๆ กับเพื่อน ฉันมักชวนคุยไปเรื่อย ๆ ตลอดทาง แม้บางคนในรถอยากงีบ","I":"นั่งรถไปไหนนาน ๆ กับเพื่อน ฉันมักนั่งเงียบ ๆ อยู่กับความคิดตัวเอง แม้เพื่อนอยากชวนคุย"},"EIeq1":{"E":"ในวงคุย ฉันชอบตอนที่วงคึก มีเสียงหัวเราะแทรกกันไปมา แม้บางทีจะคุยกันไม่ค่อยรู้เรื่อง","I":"ในวงคุย ฉันชอบตอนที่วงเบา ๆ คุยกันทีละคนช้า ๆ แม้บางทีจะดูเงียบไปหน่อย"},"Niy0":"เวลาอ่านแนวคิดเรื่องชีวิตจากหลายแหล่ง ฉันชอบหาแก่นเดียวที่ทุกแนวพูดถึงอยู่ลึก ๆ แม้บางทีแนวที่ไม่เข้ากับแก่นนั้นจะถูกมองข้ามไป","Siy0":"หลักเล็ก ๆ ที่ฉันใช้มานาน เช่น ถ้าลังเลก็เลือกแบบที่เคยเลือก พอได้ทำตามแบบเดิมแล้วรู้สึกมั่นคง แม้บางทีจะพลาดทางที่อาจเหมาะกว่า","Sey0":"หลักคิดเรื่องชีวิตจะชัดกับฉันขึ้นมาก ตอนได้เห็นคนใช้มันจริงต่อหน้า จนหลักที่แค่อ่านเจอมักผ่านไปเฉย ๆ","Sey3":"สำหรับฉัน ช่วงที่ชีวิตมีรสชาติคือตอนได้อยู่กับสีสันและเสียงตรงหน้าเต็มที่ แม้จะเป็นแค่ตอนเดินตลาดใกล้บ้าน","Tey2":"ฉันชอบเปลี่ยนสิ่งที่ตั้งใจไว้ เช่น เป้าปีใหม่ ให้เป็นแผนที่มีขั้นตอนและเส้นตาย จนบางเป้ากลายเป็นงานที่ต้องตามเช็กจนไม่สนุก","Fiy3":"บางอย่างที่ฉันทำเป็นประจำ เช่น เขียนโน       var head = q.ei ? "คำถามหลัก · เลือกข้างที่ใกล้ตัวคุณกว่า"

            '<p class="side" id="sa"><b>ก.</b> ' + esc(q.ta) + '</p><p class="side" id="sb"><b>ข.</b> ' + esc(q.tb) + '</p></div>' + helper +
          '<div class="ab"><span>ใกล้ตัว ก. กว่า</span><span>ใกล้ตัว ข. กว่า</span></div>'
        : '<h1 class="q" tabindex="-1"><span class="sr">ข้อ ' + (idx - base + 1) + ' จาก ' + span + ' </span>' + esc(q.t) + '</h1>' +
          '<div class="ab"><span>ตรงกับฉัน</span><span>ไม่ตรงกับฉัน</span></div>';
      var canBack = canGoBack();
      app.innerHTML =
        '<div class="top"><span class="brand">' + BRAND + '</span><span class="count">' + counter + '</span></div>' +
        '<div class="progress" role="progressbar" aria-label="ความคืบหน้า" aria-valuemin="0" aria-valuemax="' + span + '" aria-valuenow="' + (idx - base) + '"><i style="width:' + pct + '%"></i></div>' +
        '<section class="card">' +
          '<span class="tag">' + tag + '</span>' + body +

          '<p class="sr">ใช้ลูกศรเลือก แล้วกด Enter</p>' +

        '</section>' +
        '<div id="topicslot"></div>' +
        '<div class="qnav"><button type="button" class="btn small ghost" id="back"' + (canBack ? '' : ' disabled') + '>← ย้อน 1 ข้อ</button><button type="button" class="btn small" id="pause">พักไว้ก่อน</button></div>' +
        '<p class="hint" id="qstatus" role="status" aria-live="polite">' + (tape.length ? "บันทึกข้อก่อนหน้าแล้ว" : "") + '</p>';

        if (i < 0) return;

        if (e.key === "ArrowRight" || e.key === "ArrowDown") n = Math.min(btns.length - 1, i + 1);

        else if (e.key === "Home") n = 0;

    function syncTopic() {
      var slot = document.getElementById("topicslot");

      slot.innerHTML = "";
      if (!skipPrompt) return;
      var t = skipPrompt;
      slot.innerHTML = '<div class="warn"><p>ดูเหมือนเรื่อง' + esc(CTX_NAME[t]) + 'จะไม่เกี่ยวกับคุณ</p><div class="mini"><button type="button" class="btn small" id="dropyes">ข้ามทั้งเรื่องนี้</button><button type="button" class="btn small ghost" id="dropno">ไม่ ข้ามแค่ข้อนี้</button></div></div>';

    function canGoBack() {
      if (backUsed || !tape.length) return false;
      var last = tape[tape.length - 1];
      if (last.charAt(0) === "D" || last.charAt(0) === "K") return false;
      if (mainN && idx === mainN) return false;
      return true;
    }

      var st = document.getElementById("qstatus"); if (st) st.textContent = "ย้อนกลับมาแล้ว ตอบข้อนี้ใหม่ได้";
    }
    function choose(v) {

      var wasMain = !mainN;
      tape.push(symOf(v)); backUsed = false;
      var prompt = applyAnswer(idx, v);
      if (prompt) skipPrompt = prompt;
      app.querySelectorAll(".opt").forEach(function (b) { b.setAttribute("aria-checked", String(Number(b.getAttribute("data-v")) === v)); });
      var na = document.getElementById("na"); if (na) na.setAttribute("aria-pressed", String(v === "na"));
      if (wasMain && firstOpen() < 0) { closeMain(); save(); advTimer = setTimeout(function () { advTimer = null; busy = false; if (ph === 2) renderIntro(); else renderResult(); }, 220); return; }

      if (firstOpen() < 0) { advTimer = setTimeout(function () { advTimer = null; busy = false; renderResult(); }, 220); return; }
      var done = answeredCount();
      var cp = !mainN && CHECKPOINTS.indexOf(done) >= 0 && cps.indexOf(done) < 0;
      advTimer = setTimeout(function () {
        advTimer = null; busy = false; idx = firstOpen();
        if (cp) { cps.push(done); save(); renderPause("checkpoint"); } else renderQuestion();
      }, 220);
    }

      document.getElementById("go2").addEventListener("click", function () { ph = 3; idx = firstOpen(); busy = false; backUsed = true; save(); renderQuestion(); window.scrollTo(0, 0); });

    /* ----- หน้าผลลัพธ์ ----- */

      return sorted.map(function (f) {
        var w = Math.max(3, Math.min(100, 50 + 25 * c[f]));

        return '<div class="fbar"><div class="lab"><b>' + f + '</b>' + (pos >= 0 && show ? ' · ' + ROLE[pos] : '') + '<span class="val">' + fix(c[f]) + '</span><small>' + FNAME[f] + '</small></div>' +
          '<div class="bar" aria-hidden="true"><i class="' + (on ? "on" : "") + '" style="width:' + w + '%"></i></div></div>';

    function shortSide(t) {

          '<a class="btn sh" data-fb="1" href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(link) + '" target="_blank" rel="noopener noreferrer">Facebook</a>' +
          '<a class="btn sh" href="' + M.gmail + '" target="_blank" rel="noopener noreferrer">อีเมล</a></div>' +
        '<p class="small">กดปุ่มแพลตฟอร์มแล้วระบบจะคัดลอกข้อความให้ก่อน ถ้าแอปไม่เติมข้อความให้ วางเองได้เลย · <a href="' + M.mailto + '">ใช้แอปอีเมลอื่น</a></p>' +
        '<h3 class="sec2">สตอรี่ IG</h3><p class="small">Instagram ไม่มีปุ่มแชร์จากเว็บ ให้สร้างรูปสตอรี่ แล้วโพสต์เอง ใส่สติกเกอร์ลิงก์ด้วยลิงก์ที่คัดลอกไว้</p>' +
        '<div class="sharebtns"><button type="button" class="btn primary" id="mkstory">สร้างรูปสตอรี่ 9:16</button><button type="button" class="btn" id="copylink">คัดลอกลิงก์ไว้ใส่สติกเกอร์ลิงก์</button></div>' +
        '<div id="storyout" aria-live="polite"></div>' +
        (recv ? compareHtml(S, recv) : '<p class="small">ชวนแฟนหรือเพื่อนมาทำ แล้วส่งลิงก์ผลให้กัน เปิดลิงก์ของอีกคนแล้วกด “ลองทำของคุณ” จะได้เห็นผลเทียบกันตรงนี้ (ไม่มีคะแนนความเข้ากัน)</p>') +
        igCta() + '</section>';
    }
    function igCta() {
      return '<div class="ftcta"><img src="img/firstthread-icon.png" alt="" width="56" height="56"><div><p class="cta-h">ได้ผลแล้ว กลับมาแชร์กัน</p><p>แท็ก <a href="' + IG_URL + '" target="_blank" rel="noopener noreferrer">@firstthread.app</a> บนไอจี</p><p class="small">เพื่อสำรวจตัวเอง ไม่ใช่การวินิจฉัย</p></div></div>';
    }
    function bindShare(V, hide) {
      var ci = document.getElementById("copyinvite");
      if (ci) ci.addEventListener("click", function () { copyText(ART_URL, ci, "คัดลอกลิงก์แบบทดสอบแล้ว"); });
      if (hide) return;
      var S = summaryOf(V), link = ART_URL + "#" + encodeShare(S), cap = captionOf(S, link);
      document.getElementById("copycap").addEventListener("click", function () { copyText(cap, this, "คัดลอกข้อความและลิงก์แล้ว"); });
      document.getElementById("copylink").addEventListener("click", function () { copyText(link, this, "คัดลอกลิงก์แล้ว"); });
      app.querySelectorAll("a.sh").forEach(function (a) {
        a.addEventListener("click", function () {
          copyText(cap, a, a.getAttribute("data-fb") ? "คัดลอกข้อความแล้ว วางในโพสต์ได้เลย (ตัวอย่างลิงก์ของ Facebook ไม่แสดงผล)" : "คัดลอกข้อความไว้แล้ว ถ้าแอปไม่เติมให้ วางเองได้เลย");
        });
      });
      document.getElementById("mkstory").addEventListener("click", function () { buildStory(S); });
      var cr = document.getElementById("clearrecv");
      if (cr) cr.addEventListener("click", function () { try { localStorage.removeItem(RECV); } catch (e) {} var w = cr.parentNode; if (w) w.remove(); });
    }

    /* ----- รูปสตอรี่ 1080x1920 วาดด้วย canvas (ตัวอักษรและรูปทรงเท่านั้น) ----- */
    function wrapLines(ctx, text, maxW) {
      var segs = [];
      try { if (window.Intl && Intl.Segmenter) { var sg = new Intl.Segmenter("th", { granularity: "word" }); for (var it of sg.segment(text)) segs.push(it.segment); } } catch (e) { segs = []; }
      if (!segs.length) segs = text.split("");
      var lines = [], cur = "";
      segs.forEach(function (s) {
        if (ctx.measureText(cur + s).width > maxW && cur) { lines.push(cur.trim()); cur = s.trimStart ? s.trimStart() : s; }
        else cur += s;
      });
      if (cur.trim()) lines.push(cur.trim());
      return lines;
    }
    function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
    function buildStory(S) {
      var out = document.getElementById("storyout");
      out.innerHTML = '<p class="small">กำลังสร้างรูป…</p>';
      var fontsReady = (document.fonts && document.fonts.load) ? Promise.all([
        document.fonts.load('700 200px "Kanit"'), document.fonts.load('600 64px "Kanit"'), document.fonts.load('500 36px "IBM Plex Sans Thai"')
      ]).catch(function () {}) : Promise.resolve();
      var icon = new Image(), iconP = new Promise(function (res) { icon.onload = function () { res(true); }; icon.onerror = function () { res(false); }; });
      icon.src = "img/firstthread-icon.png";
      Promise.all([fontsReady, iconP]).then(function (r) {
        var res = drawStory(S, r[1] ? icon : null), url;
        try { url = res.toDataURL("image/png"); } catch (e) { res = drawStory(S, null); url = res.toDataURL("image/png"); }
        showStory(S, res, url);
      }).catch(function () { out.innerHTML = '<p class="warn">สร้างรูปไม่ได้ในเบราว์เซอร์นี้ ลองแคปหน้าจอผลแทน</p>'; });
    }
    function drawStory(S, icon) {
        var W = 1080, H = 1920, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
        var x = cv.getContext("2d");
        var g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, "#FF8A96"); g.addColorStop(1, "#F2566A");
        x.fillStyle = g; x.fillRect(0, 0, W, H);
        x.fillStyle = "rgba(255,255,255,0.12)"; x.beginPath(); x.arc(950, 220, 260, 0, 7); x.fill(); x.beginPath(); x.arc(120, 1750, 300, 0, 7); x.fill();
        var D = "'Kanit', 'Noto Sans Thai', sans-serif", B = "'IBM Plex Sans Thai', 'Noto Sans Thai', sans-serif";
        x.fillStyle = "#FFFFFF"; x.textAlign = "center";
        x.font = "600 54px " + D; x.fillText("คุณเป็นไทป์ไหน?", W / 2, 190);
        rr(x, 70, 260, W - 140, 1340, 56); x.fillStyle = "#FFFFFF"; x.fill();
        x.fillStyle = "#D42A3C"; x.font = "500 40px " + D; x.fillText(S.alt ? "ไทป์ของฉันใกล้เคียง" : "ไทป์ของฉัน", W / 2, 360);
        x.font = "700 " + (S.alt ? 150 : 210) + "px " + D; x.fillText(S.alt ? S.code + " / " + S.alt : S.code, W / 2, S.alt ? 540 : 580);
        x.fillStyle = "#2B1519"; x.font = "600 60px " + D; x.fillText(TYPES[S.code].n, W / 2, 680);
        var st = STACKS[S.code];
        x.fillStyle = "#7A5761"; x.font = "500 38px " + B; x.fillText("หลัก " + st[0] + " · รอง " + st[1], W / 2, 750);
        var fs = FUNCS.slice().sort(function (a, b) { return S.bars[b] - S.bars[a]; });
        x.textAlign = "left";
        fs.forEach(function (f, i) {
          var y = 840 + i * 74;
          x.fillStyle = "#2B1519"; x.font = "600 36px " + D; x.fillText(f, 150, y + 30);
          rr(x, 250, y + 4, 400, 34, 17); x.fillStyle = "#FBE4E8"; x.fill();
          rr(x, 250, y + 4, Math.max(34, 400 * S.bars[f] / 15), 34, 17); x.fillStyle = i < 2 ? "#D42A3C" : "#F59AA6"; x.fill();
          x.fillStyle = "#7A5761"; x.font = "500 28px " + B; x.fillText(FNAME[f], 672, y + 31, 270);
        });
        x.textAlign = "center"; x.fillStyle = "#D42A3C"; x.font = "600 40px " + D; x.fillText(EI_BAND_TXT[S.ei], W / 2, 1490);
        x.fillStyle = "#7A5761"; x.font = "500 28px " + B;
        wrapLines(x, "แบบสะท้อนตัวเองจากฟังก์ชันการคิด 8 แบบ ไม่ใช่แบบทดสอบ MBTI ทางการ และไม่ใช่การวินิจฉัย", 820).forEach(function (l, i) { x.fillText(l, W / 2, 1545 + i * 46); });
        x.fillStyle = "#FFFFFF"; x.font = "600 50px " + D; x.fillText("ลองทำแล้วมาเทียบกัน", W / 2, 1730);
        if (icon) {
          x.save(); x.beginPath();
          if (x.roundRect) x.roundRect(W / 2 - 250, 1785, 72, 72, 16); else x.rect(W / 2 - 250, 1785, 72, 72);
          x.clip(); x.drawImage(icon, W / 2 - 250, 1785, 72, 72); x.restore();
        }
        x.textAlign = "left"; x.font = "600 46px " + D; x.fillText("@firstthread.app", W / 2 - 160, 1838);
        return cv;
    }
    function showStory(S, cv, url) {
        var out = document.getElementById("storyout"), st = STACKS[S.code], fname = "firstthread-" + S.code + ".png";
        var alt = "รูปสตอรี่ผลไทป์ " + typeLine(S) + " หน้าที่หลัก " + st[0] + " รอง " + st[1] + " " + EI_BAND_TXT[S.ei];
        out.innerHTML = '<img class="storyimg" src="' + url + '" alt="' + esc(alt) + '"><p class="small">แตะค้างที่รูปเพื่อบันทึก หรือใช้ปุ่มด้านล่าง</p>' +
          '<div class="sharebtns"><button type="button" class="btn" id="savestory" hidden>บันทึกรูป</button><button type="button" class="btn" id="fullstory">เปิดเต็มจอเพื่อแคป</button></div>';
        document.getElementById("fullstory").addEventListener("click", function () {
          var ov = document.createElement("div"); ov.className = "storyfull"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-label", "การ์ดสตอรี่เต็มจอ");
          ov.innerHTML = '<img src="' + url + '" alt="' + esc(alt) + '"><button type="button" class="btn small" id="closefull">ปิด</button>';
          document.body.appendChild(ov);
          document.getElementById("closefull").addEventListener("click", function () { ov.remove(); });
        });
        downloadsCap().then(function (dl) {
          var sb = document.getElementById("savestory");
          if (!dl || !sb) return;
          sb.hidden = false;
          sb.addEventListener("click", function () {
            cv.toBlob(function (blob) {
              if (!blob) return;
              dl.save({ filename: fname, data: blob }).then(function () { toast("บันทึกรูปแล้ว"); }, function (e) {
                if (e && e.code === "declined") return;
                sb.hidden = true; toast("บันทึกจากปุ่มไม่ได้ในหน้านี้ แตะค้างที่รูปเพื่อบันทึกแทน");
              });
            }, "image/png");
          });
        });
    }

    /* ----- หน้าผลที่มีคนแชร์มา (#s) ----- */
    function renderShared(S) {
      app.innerHTML =
        '<div class="top"><span class="brand">' + BRAND + '</span><span class="count">ผลที่ถูกแชร์</span></div>' +
        '<section class="card result shared">' +
          '<p class="warn">ผลที่ผู้ทำแชร์เอง ไม่ใช่ผลยืนยัน</p>' +
          '<div class="type-head"><span class="small">แชร์เมื่อ ' + dateTxt(S.days) + (S.alt ? ' · ผลก้ำกึ่ง ใกล้เคียงสองประเภท' : '') + '</span><div class="code' + (S.alt ? ' code2' : '') + '">' + esc(S.alt ? S.code + ' / ' + S.alt : S.code) + '</div><h1 class="tname" tabindex="-1" id="h1focus">' + TYPES[S.code].n + '</h1></div>' +
          '<p class="desc">ตามทฤษฎี ประเภทนี้มัก' + TYPES[S.code].d + '</p>' +
          '<h2 class="sec">แถบฟังก์ชัน</h2>' + miniBars(S) +
          '<p class="small">เทียบกันเองในตัวคนนั้น ไม่ใช่เทียบกับคนอื่น · ' + EI_BAND_TXT[S.ei] + '</p>' +
          '<p class="small">แบบสะท้อนตัวเองที่เขียนขึ้นใหม่ ไม่ใช่แบบทดสอบ MBTI ทางการ ยังไม่ผ่านการตรวจสอบความตรง ใช้เพื่อสำรวจตัวเอง ไม่ใช่การวินิจฉัย</p>' +
          '<button type="button" class="btn primary block" id="tryme">ลองทำของคุณ แล้วมาเทียบกัน</button>' +
        '</section>' + '<p class="handle"><img src="img/firstthread-icon.png" alt="" width="22" height="22"><a href="' + IG_URL + '" target="_blank" rel="noopener noreferrer">@firstthread.app</a></p>';
      document.getElementById("tryme").addEventListener("click", function () {
        try { localStorage.setItem(RECV, encodeShare(S)); } catch (e) {}
        var s = loadLocal();
        if (s && replay(s.seed, s.chosen, s.L, s.tape)) { bestFit = s.best || null; cps = s.cps || []; backUsed = true; renderResume("local"); }
        else renderSetup();
      });
      var hf = document.getElementById("h1focus"); if (hf) hf.focus({ preventScroll: true });
    }

    /* ----- เริ่มต้น ----- */
    var h0 = "";
    try { h0 = (location.hash || "").slice(1); } catch (e) {}
    var sh0 = h0.indexOf("s1.") === 0 ? decodeShare(h0) : null;
    if (sh0) renderShared(sh0);
    else if (h0.indexOf("r1.") === 0) {
      var d0 = decodeResume(h0);
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
      if (!d0.err && replay(d0.seed, d0.chosen, d0.L, d0.tape)) { backUsed = true; cps = CHECKPOINTS.filter(function (n) { return n <= answeredCount(); }); save(); renderResume("link"); }
      else renderSetup(RESUME_ERR[d0.err || "bad"]);
    } else {
      var s0 = loadLocal();
      if (s0 && replay(s0.seed, s0.chosen, s0.L, s0.tape)) {
        bestFit = s0.best || null; cps = s0.cps || []; backUsed = true;
        if (s0.ph === 3 && ph === 2) ph = 3;
        if (mainN && firstOpen() < 0 && mineLoaded) renderResult();
        else renderResume("local");
      } else {
        var v10 = null; try { v10 = localStorage.getItem("ft10_progress"); if (v10) localStorage.removeItem("ft10_progress"); } catch (e) {}
        /* rev12: รอบที่ทำค้างจากเวอร์ชันก่อน (เช่น rev11) แจ้งให้รู้แล้วลบทิ้ง */
        try {
          for (var oi = localStorage.length - 1; oi >= 0; oi--) {
            var ok0 = localStorage.key(oi);
            if (ok0 && ok0.indexOf(RUNPFX) === 0) { var orun = null; try { orun = JSON.parse(localStorage.getItem(ok0)); } catch (e) {} if (orun && orun.v !== BANKV) { v10 = v10 || "old"; localStorage.removeItem(ok0); } }
          }
        } catch (e) {}
        renderSetup(v10 ? "แบบทดสอบที่ทำค้างไว้มาจากเวอร์ชันเก่า คำถามเปลี่ยนไปแล้ว ทำต่อไม่ได้ เริ่มใหม่ได้เลย" : undefined);
      }
    }
  })();
}
</script>
