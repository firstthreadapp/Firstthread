var R11_ST = {"w":{"Ni":["ในงาน ฉันมักเห็นแนวโน้มจากสัญญาณเล็ก ๆ หลายอย่างรวมกัน จนบางทีอธิบายให้ทีมฟังไม่ทันว่าเห็นอะไร","เวลาได้รับโจทย์งาน ฉันมักติดอยู่กับคำถามว่า “จริง ๆ แล้วเรื่องนี้คือเรื่องอะไร” ก่อนจะเริ่มลงมือ","ถ้าระบบในงานล่มซ้ำหลายรอบในเดือนเดียว ฉันมักเห็นภาพว่ามันกำลังพาวิธีทำงานของทีมไปทางไหน จนเรื่องที่ต้องแก้วันนี้ยังค้างอยู่ในมือ"],"Ne":["ฉันมักเริ่มหลายไอเดียไว้พร้อมกัน แล้วค่อยดูว่าอันไหนน่าไปต่อ แม้บางอันจะค้างไว้ไม่เสร็จ","เวลาคุยงานกับลูกค้าหรือเพื่อนร่วมงาน ฉันมักเห็นว่าเรื่องนี้แตกต่อเป็นโอกาสใหม่ได้อีกหลายทาง","ต้องเลือกแอปมาใช้กับงานชิ้นเล็ก ฉันมักเปิดลองหลายตัวว่าแต่ละตัวพลิกไปใช้แบบไหนได้บ้าง จนเวลาที่ตั้งใจใช้เลือกยืดออกไป"],"Si":["ฉันมักจำว่างานแต่ละแบบเคยติดปัญหาตรงไหน แล้วเตรียมเผื่อไว้แบบเดิม แม้บางครั้งงานรอบใหม่จะไม่ได้เป็นแบบนั้นแล้ว","ฉันทำงานได้สบายใจเมื่อโต๊ะ เครื่องมือ และลำดับงานเป็นแบบที่ฉันคุ้นมือ","สั่งข้าวช่วงพักกลางวัน ฉันมักเลือกเมนูเดิมที่รู้ว่ากินแล้วบ่ายนั้นตัวไม่หนัก แม้ร้านจะมีเมนูใหม่ให้ลอง"],"Se":["ระหว่างทำงาน ความสนใจของฉันอยู่กับสิ่งที่เกิดขึ้นตรงหน้า เช่น เสียงเครื่องหรือของที่วางผิดที่ แล้วปรับตามตรงนั้น","หน้างาน ฉันมักตัดสินใจจากสิ่งที่เห็นและได้ยินตอนนั้น เช่น สภาพของหรือเสียงเครื่อง แม้จะต่างจากที่วางไว้","ระหว่างทำงานแล้วไฟดับ ฉันมักหยิบสิ่งที่ใช้ได้ตรงหน้ามาทำต่อเลย เช่น เปิดงานในมือถือ แม้ไฟล์ที่แก้ในมือถือจะต้องตามมาจัดใหม่อีกรอบ"],"Ti":["เวลาเอกสารหรือระบบในงานใช้คำเดียวกันแต่หมายถึงคนละอย่าง ฉันจะสะดุดจนต้องหยุดแก้ให้ตรงกันก่อน","ฉันมักไล่เหตุผลของแผนงานเองตั้งแต่ต้นจนจบ แม้ทีมจะตกลงกันไปแล้ว","จะตั้งชื่อไฟล์งานชุดใหม่ ฉันมักคิดให้ลงตัวก่อนว่าแต่ละส่วนของชื่อหมายถึงอะไร แม้จะเสียเวลากับเรื่องเล็กไปหน่อย"],"Te":["ฉันมักตัดงานที่ไม่ส่งผลต่อเป้าหมายออกไป แม้บางงานจะเป็นสิ่งที่ทีมทำกันมานาน","เวลามีหลายงานเข้ามาพร้อมกัน ฉันเรียงลำดับตามผลที่จะได้ แล้วบอกตรง ๆ ว่างานไหนต้องรอ","ไฟล์งานเปิดไม่ขึ้นก่อนประชุมไม่กี่นาที ฉันมักเลือกทางที่เร็วที่สุดก่อน เช่น เอาฉบับเก่ามาแก้แค่ตัวเลข แม้งานจะไม่ครบอย่างที่ตั้งใจ"],"Fi":["ถ้างานไหนยังไม่มีความหมายกับฉันเอง ฉันมักต้องหามุมที่ตัวเองเห็นคุณค่าก่อน ถึงจะมีแรงลงมือ","ถ้าวิธีทำงานที่ใช้กันอยู่ไม่ค่อยตรงกับใจ ฉันมักทำตามทีมไปพร้อมกับเก็บคำถามนั้นไว้ในใจ แม้จะยังรู้สึกค้าง ๆ อยู่สักพัก","เลือกของวางบนโต๊ะทำงาน ฉันมักหยิบสิ่งที่มีความหมายกับฉันเอง แม้คนเดินผ่านจะดูไม่ออกว่ามันคืออะไร"],"Fe":["ก่อนส่งข้อความในกลุ่มงาน ฉันมักอ่านซ้ำว่าน้ำเสียงจะทำให้ใครรู้สึกไม่ดีไหม จนบางทีส่งช้า","เวลามีคนใหม่เข้าทีม ฉันมักคอยดูว่าเขาเข้ากับคนอื่นได้หรือยัง จนบางทีเข้าไปช่วยเชื่อมมากกว่าที่เขาต้องการ","ถ้าฝนตกหนักจนต้องเลื่อนงานนอกสถานที่ ฉันมักไล่ถามทีละคนว่าวันไหนไม่กระทบแผนส่วนตัว จนกว่าจะได้วันใหม่ก็กินเวลาไปทั้งบ่าย"]},"r":{"Ni":["คำพูดธรรมดาบางประโยคของคนใกล้ตัวค้างอยู่ในใจฉันหลายวัน จนวันหนึ่งฉันเข้าใจว่าเขาหมายถึงอะไรจริง ๆ","ฉันมักรู้สึกว่าความสัมพันธ์กับใครกำลังเปลี่ยนทิศ ก่อนจะมีเหตุการณ์ชัด ๆ ให้เห็น แม้บางครั้งจะคิดไปเองก่อน","เลือกของขวัญวันเกิดให้คนใกล้ตัว ฉันมักเลือกสิ่งที่เข้ากับทางที่ชีวิตเขากำลังมุ่งไป แม้ตอนนี้เขาอาจยังไม่ได้ใช้"],"Ne":["ฉันชอบชวนคนในบ้านลองทำเรื่องเดิม ๆ แบบใหม่ เช่น จัดวันเกิดในแบบที่ยังไม่ได้ลอง แม้บางคนจะอยากได้แบบเดิม","เวลาคนใกล้ตัวเล่าปัญหา ฉันมักนึกถึงหลายมุมที่เรื่องนี้อาจเป็นไปได้ ก่อนจะช่วยเลือกทางใดทางหนึ่ง","ทริปกับคนใกล้ตัวต้องยกเลิกเพราะพายุเข้า ฉันมักนึกแผนสำรองออกมาหลายแบบ เช่น เที่ยวในเมืองหรือย้ายไปที่อื่น จนอีกฝ่ายเลือกไม่ถูก"],"Si":["เวลาคนใกล้ตัวทำต่างจากปกติแม้นิดเดียว ฉันมักสะดุดเพราะเทียบกับแบบที่เขาเคยเป็น จนบางทีถามมากไปทั้งที่ไม่มีอะไร","เวลาคุยกับคนใกล้ตัว ฉันมักเล่าย้อนถึงเรื่องที่เคยผ่านมาด้วยกันว่าวันนั้นเป็นอย่างไร","รถไฟดีเลย์ระหว่างไปหาคนใกล้ตัว ฉันมักนึกถึงครั้งก่อนที่เจอแบบนี้ แล้วใช้ทางเดิมที่เคยช่วยได้ แม้แอปจะแนะนำทางใหม่"],"Se":["เวลาคนใกล้ตัวเครียด ฉันมักชวนเขาลุกไปทำอะไรด้วยกันตรงนั้นเลย เช่น ออกไปเดิน แม้บางทีเขาอยากนั่งเล่าให้ฟังมากกว่า","เวลาอยู่กับคนใกล้ตัว ฉันอยากใช้เวลาตรงนั้นให้เต็มที่ มากกว่าคุยเรื่องอนาคตหรือเรื่องที่ผ่านมา","เลือกของฝากให้คนใกล้ตัวระหว่างเที่ยว ฉันมักเลือกจากการได้จับ ได้ดม หรือได้ชิมตรงร้าน แม้จะยังไม่ได้เทียบกับร้านอื่น"],"Ti":["เวลาคนในบ้านให้ช่วยตัดสินว่าใครถูก ฉันมักแยกประเด็นออกเป็นข้อ ๆ ก่อน แม้เขาอยากได้แค่คำตอบสั้น ๆ","ฉันมักสังเกตว่าข้อตกลงเล็ก ๆ ระหว่างฉันกับคนใกล้ตัวบางข้อขัดกันเอง แล้วอดคิดในใจไม่ได้ว่าเหตุผลจริง ๆ ของมันคืออะไร"],"Te":["เวลาคนในบ้านต้องตัดสินใจเรื่องใหญ่ ฉันมักหาข้อมูลมาเทียบเป็นตัวเลือกให้ชัด แม้บางคนอยากใช้ความรู้สึกมากกว่า","ฉันชอบแบ่งงานบ้านให้ชัดว่าใครทำอะไร เมื่อไร จะได้ไม่ต้องมาถามกันซ้ำ","ออกไปข้างนอกกับคนใกล้ตัวแล้วหิวกันทั้งคู่ ฉันมักเปิดแผนที่หาร้านที่ใกล้และคิวสั้นสุดแล้วเสนอให้จบ แม้จะไม่ใช่ร้านที่ตั้งใจลอง"],"Fi":["ฉันแสดงความรักกับคนใกล้ตัวในแบบที่เป็นตัวเอง แม้จะไม่ใช่แบบที่คนส่วนใหญ่คาดหวัง","ถ้าเพื่อนสนิทหรือแฟนเชียร์ให้ฉันเลือกทางที่ไม่ใช่ตัวฉัน ฉันมักค่อย ๆ ยืนยันทางของตัวเอง แม้เขาจะดูผิดหวังอยู่พักหนึ่ง","แผนฉลองกับคนใกล้ตัวพังเพราะฝน ฉันมักถามตัวเองว่าส่วนไหนที่ฉันไม่อยากเสียไปจริง ๆ แล้วหาทางเก็บไว้ แม้จะต้องย้ายไปทำในห้องแคบ ๆ"],"Fe":["เวลาคนในบ้านมีเรื่องดีใจ ฉันอยากให้ทุกคนได้ร่วมยินดีด้วยกัน จนบางทีจัดใหญ่กว่าที่เจ้าตัวอยากได้","เวลาคนใกล้ตัวสองคนเห็นไม่ตรงกัน ฉันมักหาคำพูดที่ทั้งคู่รับได้ จนบางทีความเห็นของตัวเองหายไป","เลือกเพลงเปิดระหว่างเดินทางกับคนใกล้ตัว ฉันมักดูว่าเพลงแบบไหนเข้ากับอารมณ์ของเขาตอนนั้น แม้บางทีจะกดเปลี่ยนถี่จนเขาเริ่มขำ"]},"l":{"Ni":["ทำงานบ้านหรือเดินเล่นเพลิน ๆ ทีไร คำตอบของเรื่องที่ค้างในใจมักโผล่ขึ้นมาเอง จนบางทีลืมว่ากำลังทำอะไรอยู่","เวลาว่าง ฉันมักกลับไปครุ่นคิดเรื่องเดียวซ้ำ ๆ จนเห็นว่าแก่นจริง ๆ ของมันคืออะไร แม้จะไม่ได้ข้อสรุปที่เอาไปใช้ได้ทันที","ทริปวันว่างที่ตั้งใจไว้ต้องยกเลิก ฉันมักนึกเลยไปว่าวันว่างช่วงนี้ของฉันกำลังเปลี่ยนไปทางไหน แม้ยังไม่รู้ว่าวันนั้นจะทำอะไรแทน"],"Ne":["วันว่างของฉันมักเปลี่ยนแผนไปเรื่อย ๆ เพราะระหว่างทางนึกถึงเรื่องน่าลองอย่างอื่นขึ้นมา","ฉันชอบเปิดเรื่องหนึ่งแล้วค้นต่อไปยังเรื่องที่เกี่ยวข้องไปเรื่อย ๆ จนได้รู้เรื่องที่ไม่ได้ตั้งใจหา","กิจกรรมที่จองไว้ในวันว่างปิดเพราะสภาพอากาศ ฉันมักนึกได้หลายอย่างที่น่าเอาเวลานี้ไปลองแทน จนเวลาครึ่งวันหมดไปกับการเลือก"],"Si":["ฉันชอบกลับไปดูหนังหรือฟังเพลงที่เคยชอบซ้ำ ๆ เพราะรู้ว่ามันให้ความรู้สึกแบบไหน","เวลาว่าง ฉันมักรู้ตัวว่าร่างกายต้องการอะไร เช่น อยากนอนเพิ่มหรืออยากกินของอุ่น ๆ แล้วทำตามนั้น","วันหยุดที่ตั้งใจออกไปข้างนอกแล้วฝนตกทั้งวัน ฉันมักกลับไปทำสิ่งที่เคยทำแล้วรู้ว่าสบาย เช่น ทำเมนูประจำแล้วนั่งมุมเดิมของห้อง"],"Se":["ฉันสนุกกับการทำอาหารหรืองานมือที่ได้ดูสี กลิ่น และเนื้อสัมผัส แล้วปรับไปตามที่เห็นตรงหน้า","วันว่างที่ไม่มีแผน ฉันมักตัดสินใจจากสิ่งที่เห็นตรงหน้าตอนนั้น เช่น อากาศดีก็ออกไปเดิน ฝนตกก็หาอะไรทำในบ้าน","เลือกของกินเล่นตอนจะดูหนังที่บ้าน ฉันมักเดินดูของจริงในร้านแล้วหยิบตามที่ตาเห็นว่าน่ากินตอนนั้น"],"Ti":["ดูหนังหรืออ่านนิยาย ฉันมักสะดุดเมื่อกฎของโลกในเรื่องขัดกันเอง จนต้องคิดหาคำอธิบาย","เวลาเห็นเคล็ดลับหรือคำแนะนำในโซเชียล ฉันมักลองคิดเองก่อนว่ามันสมเหตุสมผลจริงไหม จนบางทีไม่ได้ลองทำสักที","ถ้าโมเดลที่ต่อตามคู่มือประกอบไม่เข้า ฉันมักนั่งไล่ว่าเริ่มเบี้ยวตั้งแต่ขั้นไหนก่อนจะถอดต่อใหม่ แม้เวลาว่างจะหมดไปกับขั้นนั้น"],"Te":["ฉันมักเลือกกิจกรรมวันหยุดจากว่าคุ้มเวลาที่สุด เช่น ไปที่ที่ได้ทำหลายอย่างในทีเดียว","วันหยุดยาว ฉันมักใช้โอกาสเคลียร์เรื่องค้างให้จบ เช่น ซ่อมของหรือจัดเอกสาร แม้คนอื่นอยากให้พักจริง ๆ","เลือกอุปกรณ์งานอดิเรกชิ้นแรก ฉันมักเทียบสเปกกับสิ่งที่จะใช้จริงแล้วเลือกชิ้นที่ตอบโจทย์ แม้ชิ้นที่หน้าตาถูกใจกว่าจะอยู่ข้าง ๆ"],"Fi":["ฉันเลือกทำอะไรในเวลาว่างจากว่ามันมีความหมายกับใจแค่ไหน แม้บางอย่างจะไม่ได้ช่วยให้พักหรือสนุกนัก","เพลงหรือหนังที่ฉันรักที่สุด มักตรงกับความรู้สึกบางอย่างในใจ ซึ่งอธิบายให้คนอื่นฟังยาก","ถ้างานที่ตั้งใจไปในวันว่างบัตรหมด ฉันมักไม่รีบหางานอื่นมาแทน เพราะงานนั้นมีความหมายกับฉันเป็นพิเศษ แม้วันนั้นจะว่างไปทั้งวัน"],"Fe":["ชวนเพื่อนมาลองกิจกรรมที่ฉันชอบ ฉันมักคอยถามเขาว่าสนุกไหม จนบางทีเขาต้องบอกว่าไม่ต้องห่วงขนาดนั้น","เวลาว่างที่อยู่บ้านกับคนอื่น ฉันมักดูว่าแต่ละคนอยากพักแบบไหนแล้วปรับตาม จนบางทีไม่ได้พักแบบที่ตัวเองชอบ","เลือกเกมเล่นตอนว่างกับคนอื่น ฉันมักเลือกเกมที่คิดว่าทุกคนน่าจะเล่นแล้วหัวเราะด้วยกัน แม้บางคนจะแค่ขำตามวงไปงั้น ๆ"]},"k":{"Ni":["ฉันมักรู้สึกว่าเหตุการณ์หลายเรื่องที่ดูต่างกัน จริง ๆ เป็นเรื่องเดียวกันที่โผล่มาในรูปต่างกัน","เมื่อเห็นจุดหมายชัดแล้ว ฉันมักตัดทางเลือกอื่นออกไปจากหัว จนบางทีมองข้ามทางที่อาจดีกว่า","ฉันชอบเรื่องที่ต้องค่อย ๆ ขุดลงไปจนเจอแก่นข้างใน มากกว่าเรื่องที่ได้รู้กว้าง ๆ หลายเรื่อง"],"Ne":["ได้ยินประโยคหนึ่ง ฉันมักนึกโยงไปได้อีกหลายความหมาย จนบางทีตอบคนพูดช้าไปจังหวะหนึ่ง","เวลาเริ่มเรื่องใหม่ ฉันมักนึกไปก่อนว่ามันจะออกมาได้กี่แบบ จนบางทีกว่าจะเริ่มลงมือก็ช้า","แม้จะเลือกทางหนึ่งไปแล้ว ฉันก็มักนึกเล่น ๆ ว่าถ้าไปอีกทางจะออกมาเป็นแบบไหนได้บ้าง แม้จะไม่ได้คิดจะเปลี่ยนแล้ว"],"Si":["ฉันมักสังเกตว่าร่างกายตัวเองต่างไปจากปกติ เช่น เหนื่อยกว่าเดิมหรือกินแล้วไม่สบายท้อง","ฉันชอบทำเรื่องใหม่ให้ใกล้กับวิธีที่ตัวเองคุ้นก่อน แล้วค่อย ๆ ปรับทีละนิด","เวลามีคนอธิบายอะไรใหม่ ฉันจะเข้าใจง่ายขึ้นเมื่อเขาเทียบกับสิ่งที่ฉันเคยเจอมาแล้ว"],"Se":["เดินเข้าไปที่ไหน ฉันมักรู้สึกถึงอุณหภูมิ แสง หรือกลิ่นของที่นั่นก่อนเรื่องอื่น","เวลามีเรื่องให้ทำ ฉันอยากลงมือเลยแล้วค่อยปรับระหว่างทาง มากกว่ารอคิดให้ครบก่อน","ฉันชอบความรู้สึกที่ทุกอย่างกำลังเกิดขึ้นสด ๆ ตรงหน้า เช่น ดนตรีสด กีฬาในสนาม หรืออาหารที่เพิ่งทำเสร็จ"],"Ti":["เวลาคนสรุปอะไรกว้างเกินไป ฉันมักนึกหาข้อยกเว้นที่ทำให้ข้อสรุปนั้นไม่จริงทั้งหมด","ถ้ามีสองคำอธิบายที่ฟังขึ้นทั้งคู่ ฉันจะคิดต่อจนรู้ว่าต่างกันตรงไหนกันแน่","ฉันมักอยากแยกให้ชัดว่าอะไรเป็นข้อเท็จจริง อะไรเป็นการตีความ แม้คนส่วนใหญ่จะพูดปนกันเป็นปกติ"],"Te":["เวลามีปัญหา ฉันมักคิดต่อทันทีว่า “ขั้นต่อไปคืออะไร” แล้วลงมือจัดการ แม้บางทีแผนแรกจะต้องรื้อใหม่ทีหลัง","ฉันชอบตัดสินใจจากข้อมูลที่มีให้จบ แล้วค่อยแก้ทีหลัง ดีกว่าปล่อยเรื่องค้างไว้นาน","ฉันชอบจัดเวลาและทรัพยากรให้ลงตัว เช่น วางลำดับว่าจะไปที่ไหนก่อนหลังให้เสียเวลาน้อยที่สุด"],"Fi":["คำพูดตามมารยาทที่ใจไม่ได้รู้สึกจริง ฉันมักพูดไม่ค่อยออก เพราะอยากให้คำพูดตรงกับข้างใน","ฉันใช้เวลานานกว่าจะรู้ว่าตัวเองรู้สึกยังไงกับเรื่องหนึ่ง แต่พอรู้แล้วก็มักไม่เปลี่ยนง่าย ๆ","คำชมหรือคำติจากคนอื่นไม่ค่อยเปลี่ยนสิ่งที่ฉันให้คุณค่า ถ้ามันไม่ตรงกับที่ฉันรู้สึกเอง"],"Fe":["ถ้าต้องปฏิเสธใคร ฉันมักหาวิธีพูดให้เขาไม่เสียความรู้สึก จนบางทีลังเลนานกว่าจะพูดออกไป","ในวงที่มีคนหลายแบบ ฉันมักปรับคำพูดและท่าทีให้เข้ากับคนตรงหน้า จนบางทีพูดไม่ค่อยตรงกับที่คิด","เวลาจะชมหรือติใคร ฉันมักเลือกคำให้เขารับได้ง่าย แม้จะทำให้ประเด็นจริงเบาลงบ้าง"]},"s":{"Ni":["เวลาเรียนเรื่องยาก ฉันมักปล่อยให้มันค้างในหัวสักพัก แล้วความเข้าใจก็มักผุดขึ้นมาทีเดียวทั้งก้อน","ถ้าคลิปสอนสองช่องอธิบายเรื่องเดียวกันไม่ตรงกัน ฉันมักมองหาภาพเดียวที่อยู่ข้างใต้ทั้งสองแบบ แม้รายละเอียดจะยังไม่ลงกันสักที"],"Ne":["พอคนสอนในคลิปยกตัวอย่างหนึ่ง หัวฉันมักแตกไปเป็นตัวอย่างอื่นอีกหลายแบบ จนบางทีหลุดจากที่เขากำลังพูด","เลือกหัวข้อที่จะเรียนเองต่อจากนี้ ฉันมักไล่ดูหลายเรื่องที่โยงต่อกันได้ จนเวลาที่ใช้เลือกยาวกว่าที่ตั้งใจ"],"Si":["ก่อนนั่งเรียนอะไรด้วยตัวเอง ฉันมีขั้นตอนประจำ เช่น จัดโต๊ะแบบเดิม เตรียมของชุดเดิม แล้วหัวจะเข้าโหมดเรียนเอง","เลือกคลิปสอนทักษะใหม่ ฉันมักกลับไปที่ช่องเดิมที่เคยดูแล้วเข้าใจ เพราะคุ้นจังหวะการอธิบาย แม้จะมีช่องใหม่ที่คนพูดถึงกันเยอะ"],"Se":["เวลาฝึกทำอาหารหรือซ่อมของตามคลิป ฉันมักจดจ่อกับสี กลิ่น หรือเสียงที่เปลี่ยนไปตรงหน้า แล้วปรับตามนั้นเลย จนบางทีทำไม่ตรงกับในคลิป","ทำตามคลิปสอนแล้วอุปกรณ์ที่มีไม่เหมือนในคลิป ฉันมักลองกับของที่มีอยู่ตรงหน้าเลย แล้วปรับไปตามที่เห็น แม้ผลจะออกมาต่างจากในคลิปไปมาก"],"Ti":["เวลาเรียน ฉันชอบแยกให้ชัดว่าสองแนวคิดที่ดูคล้ายกันต่างกันตรงไหนกันแน่ จนบางทีใช้เวลากับจุดเล็ก ๆ นานเกินไป","เลือกแหล่งเรียนเรื่องใหม่ ฉันมักเลือกแหล่งที่อธิบายว่าทำไมแต่ละขั้นต้องเป็นแบบนั้น แม้จะยาวกว่าแหล่งที่บอกแค่ขั้นตอน"],"Te":["หลังทำแบบทดสอบท้ายบทแต่ละครั้ง ฉันดูว่าพลาดตรงไหนมากที่สุด แล้วเปลี่ยนวิธีเรียนตามนั้น จนบางทีข้ามส่วนที่ไม่ถูกถามไปเลย","สถิติในแอปเรียนภาษาหายหลังอัปเดต ฉันมักตั้งเป้าใหม่เป็นตัวเลขแล้วเริ่มนับวันนั้นเลย แม้บางวันจะเรียนเพื่อไล่ตัวเลขมากกว่าสนุก"],"Fi":["เวลาคอร์สให้เขียนสะท้อนสิ่งที่เรียน ฉันเขียนตามที่รู้สึกจริง แม้บางทีจะเขียนยาวเกินและออกนอกหัวข้อที่คอร์สถาม","เลือกทักษะใหม่ที่จะเรียนในเวลาว่าง ฉันมักเลือกสิ่งที่ใจผูกพันด้วยจริง ๆ แม้จะไม่ได้ช่วยเรื่องงานเลย"],"Fe":["ตอนนัดเพื่อนมานั่งเรียนเรื่องเดียวกัน ถ้าบรรยากาศเริ่มเครียด ฉันมักอดไม่ได้ที่จะชวนคุยเรื่องเบา ๆ จนวงเรียนกลายเป็นวงคุยเล่น","ถ้าเน็ตหลุดระหว่างติวออนไลน์กับกลุ่มเพื่อน ฉันมักห่วงก่อนว่าทุกคนต้องรอฉันอยู่ไหม จนกลับเข้ามาแล้วไม่กล้าขอให้ใครเล่าส่วนที่พลาดไป"]},"b":{"Ni":["บางครั้งความหมายของหนังสือเล่มหนึ่งมากระจ่างในหัวฉันหลายวันหลังอ่านจบ ตอนที่ไม่ได้คิดถึงมันแล้ว","เลือกเล่มที่จะอ่านต่อ ฉันมักหยิบเล่มที่รู้สึกว่าจะช่วยให้ภาพบางอย่างที่ค้างในหัวช่วงนี้ชัดขึ้น แม้จะบอกไม่ได้ว่าภาพนั้นคืออะไร"],"Ne":["ระหว่างอ่าน ฉันมักจดไอเดียที่ผุดขึ้นมาไว้ข้างหน้ากระดาษ ซึ่งหลายอันไม่เกี่ยวกับเนื้อหาเล่มนั้นเลย","ถ้าเล่มต่อของซีรีส์ที่รออ่านเลื่อนวางขาย ฉันมักเดาไปหลายทางว่าเรื่องจะไปต่อแบบไหน จนแต่งต่อในหัวไว้หลายเวอร์ชัน"],"Si":["พอได้อ่านเล่มเดิมซ้ำ ฉันมักเทียบว่าความรู้สึกรอบนี้ต่างจากตอนอ่านครั้งก่อนตรงไหน","ถ้าหนังสือที่อ่านค้างไว้หายระหว่างเดินทาง ฉันมักหาเล่มเดิมมาอ่านต่อจากหน้าที่จำได้ แม้จะมีเล่มใหม่ที่อยากอ่านรออยู่"],"Se":["เวลาอ่านคู่มือหรือหนังสือฮาวทู ฉันมักลองทำตามไปพร้อมกับที่อ่าน ไม่ค่อยอ่านให้จบก่อน","เลือกเล่มในร้านหนังสือ ฉันมักเปิดอ่านหน้าแรกตรงนั้นเลย ถ้าประโยคแรก ๆ ทำให้เห็นภาพชัดก็หยิบเล่มนั้น แม้จะยังไม่ได้ดูรีวิว"],"Ti":["ถ้าหนังสือสองเล่มอธิบายเรื่องเดียวกันต่างกัน ฉันจะคิดเองจนกว่าจะได้คำอธิบายที่ไม่ขัดกัน","ถ้าอีบุ๊กที่โหลดมาเรียงบทสลับกัน ฉันมักไล่จากเนื้อหาเองก่อนว่าบทไหนต่อจากบทไหน แม้จะใช้เวลานานกว่าโหลดไฟล์ใหม่"],"Te":["ฉันจัดลำดับหนังสือที่จะอ่านตามเป้าหมาย เช่น อ่านเล่มพื้นฐานก่อนแล้วค่อยต่อเล่มที่ลึกขึ้น","เลือกว่าจะอ่านเล่มกระดาษหรืออีบุ๊ก ฉันมักดูว่าแบบไหนได้อ่านมากที่สุดในเวลาที่มี เช่น ระหว่างนั่งรถ แม้จะชอบสัมผัสของกระดาษมากกว่า"],"Fi":["ถ้าหนังสือที่ใคร ๆ ชมไม่ได้แตะใจฉันเลย ฉันก็บอกตรง ๆ ว่าไม่ชอบ โดยไม่ฝืนชมตาม","บังเอิญเห็นสปอยล์ตอนจบของเล่มที่อ่านอยู่ ฉันมักถามใจตัวเองว่ายังอยากอยู่กับตัวละครพวกนี้ต่อไหม แม้เรื่องจะไม่มีอะไรให้ลุ้นแล้ว"],"Fe":["ใครแนะนำหนังสือให้ ฉันมักรีบอ่าน เพราะกลัวเขาเก้อถ้าฉันยังไม่ได้อ่าน จนเล่มที่อยากอ่านเองค้างอยู่หลายเล่ม","จะเขียนรีวิวสั้น ๆ ในกลุ่มนักอ่าน ฉันมักเลือกคำที่คนที่ชอบเล่มนั้นอ่านแล้วไม่รู้สึกแย่ จนรีวิวออกมาไม่ตรงกับที่รู้สึกนัก"]},"m":{"Ni":["ฉันมักเห็นความหมายแฝงในมีมหรือโพสต์ที่คนแชร์กัน ว่ามันสะท้อนอะไรลึก ๆ ของผู้คนในช่วงนั้น","ถ้าจู่ ๆ ฟีดเต็มไปด้วยเรื่องที่ฉันไม่ได้สนใจ ฉันมักนึกว่ามันบอกอะไรเรื่องทิศทางของแอป มากกว่าจะรีบกดซ่อนทีละโพสต์"],"Ne":["ในคอมเมนต์ ฉันชอบเสนอมุมมองอื่นที่ยังไม่มีใครพูดถึง เพื่อดูว่าเรื่องจะไปทางไหนได้อีก","ตอนเลือกรูปโปรไฟล์ใหม่ ฉันมักนึกออกหลายแนวที่อยากลอง จนเปลี่ยนไปมาหลายรอบในสัปดาห์เดียว"],"Si":["ฉันชอบเปิดดูโพสต์หรือรูปเก่าที่ระบบเตือนว่า “วันนี้เมื่อปีก่อน” แล้วนึกย้อนว่าตอนนั้นเป็นอย่างไร","ถ้าแอปเปลี่ยนวิธีเรียงฟีด ฉันมักไล่หาบัญชีที่ติดตามประจำตามลำดับที่คุ้นก่อน แม้จะเลื่อนผ่านโพสต์ใหม่ ๆ ไปเยอะ"],"Se":["เวลามีเรื่องกำลังเกิดขึ้นสด ๆ ฉันชอบเข้าไปดูไลฟ์หรือตามอัปเดตแบบนาทีต่อนาที","จากรูปที่ถ่ายมาหลายสิบรูป ฉันมักเลือกลงรูปที่แสงและบรรยากาศดูมีชีวิตที่สุด แม้บางรูปจะเบลอไปนิด"],"Ti":["เวลาเห็นคำที่คนบนโซเชียลใช้กันจนความหมายเพี้ยน ฉันมักอยากรู้ว่าจริง ๆ แล้วคำนั้นนิยามว่าอะไร","ถ้ารูปที่อัปโหลดออกมาสีเพี้ยนหรือถูกครอปแปลก ๆ ฉันมักอยากเข้าใจก่อนว่าแอปจัดการไฟล์แบบไหน จนรูปนั้นค้างไม่ได้ลงไปพักใหญ่"],"Te":["เวลาในกลุ่มแชตคุยกันวนไปมา ฉันมักพิมพ์สรุปแล้วถามให้ตัดสินใจ แม้บางคนยังอยากคุยต่อ","จะเลือกว่าเรื่องไหนลงสตอรี่ เรื่องไหนลงโพสต์ ฉันมักแยกตามจุดประสงค์ที่ตั้งไว้แล้วตัดสินใจเร็ว จนฟีดดูเป็นทางการไปหน่อย"],"Fi":["ฉันไม่เปลี่ยนความเห็นหรือรสนิยมของตัวเองตามกระแสบนโซเชียล จนบางทีดูเหมือนคนตกกระแส","ถ้าโพสต์ที่ตั้งใจเขียนหายไปก่อนกดลง ฉันมักไม่เขียนใหม่ เพราะรู้สึกว่าใจตอนนั้นผ่านไปแล้ว แม้จะเสียดายเนื้อหาอยู่บ้าง"],"Fe":["เวลาเห็นโพสต์ที่คนเห็นต่างกันแรง ๆ ฉันมักดูก่อนว่าแต่ละฝ่ายรู้สึกยังไง จนความเห็นจริงของตัวเองไม่ได้พิมพ์ออกไป","เขียนแคปชันใต้รูปหมู่ ฉันมักเลือกคำที่ทุกคนในรูปน่าจะโอเค จนแคปชันออกมากลาง ๆ ไม่เหมือนที่ฉันพูดปกติ"]},"g":{"Ni":["หลังเล่นแพ้หลายตา ฉันมักเห็นขึ้นมาเองว่ามีจุดเดียวที่เป็นต้นเหตุของทุกตา","เลือกว่าจะอัปสกิลสายไหนก่อน ฉันมักมีภาพตัวละครตอนท้ายเกมอยู่แล้ว แล้วเลือกตามภาพนั้น แม้ช่วงแรกจะเล่นลำบากกว่าเดิม"],"Ne":["ในเกม ฉันชอบตั้งเงื่อนไขแปลก ๆ ให้ตัวเอง เช่น เล่นโดยไม่ใช้อาวุธ เพื่อดูว่าจะเกิดอะไรขึ้น","ถ้าเซิร์ฟเวอร์เกมล่มตอนนัดเล่นกัน ฉันมักนึกออกหลายอย่างที่เล่นแทนได้ เช่น โหมดออฟไลน์ จนเสนอไปหลายอย่างแต่ยังไม่ได้เล่นสักอย่าง"],"Si":["ฉันตั้งปุ่มและหน้าจอแบบเดียวกันในทุกเกมที่เล่น เพราะมือคุ้นแล้วและเล่นสบายกว่า","เวลาต้องเลือกตัวละครในเกมใหม่ ฉันมักเลือกตัวที่คล้ายกับตัวที่เคยเล่นในเกมก่อน ๆ เพราะพอนึกออกว่าต้องเล่นยังไง"],"Se":["ในเกม ถ้าสิ่งที่เห็นบนจอไม่เป็นอย่างที่คิด ฉันมักเปลี่ยนวิธีเล่นตามนั้นเลย แม้ทีมจะตกลงแผนกันไว้แล้ว","ถ้าเน็ตแล็กกลางตา ฉันมักปรับวิธีเล่นตามอาการบนจอตอนนั้นเลย เช่น เล่นระวังขึ้นหรือรอจังหวะ แทนที่จะออกไปเช็กเน็ตก่อน"],"Ti":["เวลาเกมออกแพตช์ใหม่ ฉันอ่านรายละเอียดที่เปลี่ยนแล้วไล่คิดเองว่ามันกระทบสมดุลของระบบตรงไหน","ก่อนเลือกว่าจะใส่อุปกรณ์ชิ้นไหน ฉันมักคิดเองว่าค่าสถานะแต่ละอย่างส่งผลต่อกันยังไง แม้พอเล่นจริงแล้วจะไม่ต่างกันเท่าไหร่"],"Te":["ถ้าตัวละครหรือวิธีเล่นไหนไม่ได้ผลตามที่ต้องการ ฉันเปลี่ยนไปใช้แบบที่ได้ผลกว่าทันที แม้จะชอบแบบเดิมอยู่","ถ้าเกมอัปเดตนานจนเข้าไม่ได้ ฉันมักสลับไปเคลียร์ภารกิจในเกมอื่นที่ค้างอยู่ ให้เวลาที่กันไว้ไม่เสียเปล่า จนแทบไม่ได้พักเลย"],"Fi":["ถ้าเกมที่ชอบเปลี่ยนไปในทางที่ฉันรู้สึกว่าไม่ใช่แล้ว ฉันมักเลิกเล่นไปเงียบ ๆ แม้เพื่อนในเกมจะยังเล่นกันอยู่","ตั้งชื่อในเกม ฉันมักใช้ชื่อที่มีความหมายกับใจตัวเอง แม้จะต้องเติมตัวเลขต่อท้ายหลายรอบเพราะชื่อซ้ำ"],"Fe":["เวลาเล่นเกมเป็นทีม อารมณ์ของเพื่อนร่วมทีมมักติดมาถึงฉันง่าย ถ้าใครเริ่มหงุดหงิด ฉันก็เล่นไม่ค่อยสนุกไปด้วย","ถ้าเกมเด้งหลุดตอนเล่นเป็นทีม ฉันมักห่วงก่อนว่าคนในทีมจะเล่นต่อลำบากแค่ไหน จนกลับเข้าเกมมาแล้วยังพิมพ์ขอโทษอยู่หลายรอบ"]},"v":{"Ni":["เวลาดูซีรีส์ยาว ๆ ฉันมักรู้สึกถึงธีมเดียวที่ร้อยทุกตอนเข้าด้วยกัน แม้แต่ละตอนจะดูไม่เกี่ยวกัน","ถ้าซีรีส์ที่ดูอยู่ถูกถอดออกจากแอปก่อนดูจบ ฉันมักนึกว่าแก่นจริงของเรื่องคืออะไร แล้วพอใจกับตรงนั้นจนไม่ได้ตามหาตอนที่เหลือ"],"Ne":["ดูหนังจบ ฉันมักนึกต่อว่าถ้าเล่าจากมุมตัวละครอื่น หรือย้ายไปอีกยุค เรื่องจะออกมาแบบไหน","ถ้าหนังที่ตั้งใจดูหาไม่เจอในแอปไหนเลย ฉันมักไหลไปเจอเรื่องอื่นที่โยงกันได้หลายเรื่อง จนลืมไปว่าตอนแรกจะดูเรื่องอะไร"],"Si":["เวลาดูหนังรีเมก ฉันมักเทียบกับฉบับเดิมที่เคยดูทีละฉาก ว่าตรงไหนเหมือนหรือต่างไป","เวลาจองที่นั่งในโรงหนัง ฉันมักเลือกแถวและฝั่งเดิมที่เคยนั่งแล้วสบาย แม้จะมีที่ว่างตรงกลางให้เลือก"],"Se":["เวลาดูหนัง ฉันจดจ่ออยู่กับสิ่งที่เกิดขึ้นบนจอทีละฉาก แทนการคิดเดาล่วงหน้าว่าเรื่องจะไปทางไหน","เวลาเลือกเรื่องจากหน้าแอป ฉันมักกดจากภาพปกหรือตัวอย่างไม่กี่วินาทีที่ดึงตา แล้วดูเลยโดยไม่ได้อ่านเรื่องย่อ"],"Ti":["ฉันมีเกณฑ์ของตัวเองว่าอะไรนับเป็นหนังแนวหนึ่งจริง ๆ เช่น หนังสยองขวัญ แล้วใช้เกณฑ์นั้นแยกหนังแต่ละเรื่อง","ก่อนเลือกว่าจะดูภาคไหนก่อน ฉันมักไล่ลำดับเหตุการณ์ในเรื่องเองว่าดูแบบไหนเรื่องถึงต่อกัน จนยังไม่ได้เริ่มดูสักภาค"],"Te":["เวลาดูซีรีส์ยาว ๆ ฉันกำหนดว่าจะดูวันละกี่ตอนให้จบทันตามที่ตั้งไว้ จนบางทีรู้สึกเหมือนทำงาน","ถ้าเน็ตช้าจนหนังกระตุก ฉันมักลดความละเอียดลงแล้วดูต่อให้จบในเวลาที่กันไว้ แม้ภาพจะไม่สวยอย่างที่ตั้งใจ"],"Fi":["ฉันอึดอัดกับหนังที่ให้ตัวละครทำสิ่งที่ขัดกับคุณค่าที่ฉันยึด แล้วเล่าเหมือนเป็นเรื่องปกติ จนดูต่อไม่สุด","เวลาเลือกว่าจะดูเรื่องไหนต่อ ฉันมักเลือกเรื่องที่รู้สึกว่าตรงกับตัวเองช่วงนี้ แม้เรื่องที่คนพูดถึงกันจะค้างอยู่ในลิสต์นานแล้ว"],"Fe":["เวลาดูหนังกับคนอื่น ถ้าเห็นใครเริ่มเบื่อหรือไม่สบายใจกับบางฉาก ฉันมักเสนอให้ข้าม แม้คนที่กำลังดูอยู่จะเสียอารมณ์ไปด้วย","ถ้าดูหนังกับคนอื่นแล้วจู่ ๆ เสียงหายหรือจอดับ ฉันมักหันไปดูหน้าทุกคนก่อนว่ายังอยากดูต่อหรือเปล่า จนลืมไปช่วยดูที่เครื่อง"]},"d":{"Ni":["เวลากินอาหารจากถิ่นอื่น ฉันมักรู้สึกว่ารสชาติของมันบอกอะไรลึก ๆ เกี่ยวกับวิถีชีวิตของคนที่นั่น","สั่งอาหารในร้านใหม่ ฉันมักกวาดตาดูทั้งเมนูแล้วรู้สึกถึงจานที่เป็นหัวใจของร้าน แล้วสั่งจานนั้น แม้บางทีจะเดาผิดไปไกล"],"Ne":["เวลาเห็นวัตถุดิบหนึ่งอย่าง ฉันนึกเมนูที่เป็นไปได้ต่อกันเป็นทอด ๆ หลายแบบในหัว","เลือกท็อปปิงหรือเครื่องเคียง ฉันมักอยากลองผสมแบบที่ยังไม่ได้ลอง จนบางทีได้รสแปลกเกินกว่าจะกินหมด"],"Si":["เวลาเหนื่อยหรือไม่สบาย ฉันอยากกินอาหารแบบที่คุ้นมาตั้งแต่เด็ก เพราะรู้สึกสบายตัวขึ้น","ถ้าเมนูประจำที่ร้านหมด ฉันมักสั่งจานที่ใกล้เคียงกับที่เคยกินแล้วถูกปากที่สุด แม้จะมีเมนูพิเศษของวันให้ลอง"],"Se":["เวลาทำอาหาร ฉันปรับไฟและเครื่องปรุงตามกลิ่นและเสียงในกระทะตอนนั้น มากกว่าดูสูตร","ถ้าทำอาหารแล้วรสออกมาจัดเกิน ฉันมักเติมน้ำหรือผักลงไปตรงนั้นทีละนิด แล้วชิมไปเรื่อย ๆ โดยไม่ได้กลับไปเปิดสูตรเลย"],"Ti":["ทำอาหารตามสูตรหลายแหล่ง ฉันมักไล่ดูว่าแต่ละสูตรทำต่างกันตรงไหนและเพราะอะไร จนบางทียังไม่ได้เริ่มทำ","ถ้าขนมที่อบออกมาไม่ฟูอย่างที่คิด ฉันมักไล่ในหัวว่าขั้นไหนทำให้เป็นแบบนั้น ถ้ายังไม่เข้าใจก็ยังไม่อยากอบใหม่"],"Te":["ก่อนลองร้านใหม่ ฉันเช็กรีวิวและคะแนนก่อน ร้านที่ข้อมูลไม่ผ่านก็ตัดออก แม้หน้าตาจะน่าลอง","เลือกว่ามื้อเย็นจะทำอะไร ฉันมักเริ่มจากของในตู้เย็นที่ต้องใช้ก่อน แล้วเอาเมนูที่จบในเวลาสั้นที่สุด แม้จะไม่ใช่เมนูที่อยากกิน"],"Fi":["ร้านที่ฉันเลือกไปมักเป็นร้านที่รู้สึกว่า “ใช่” กับใจ แม้คนอื่นจะว่ารสชาติธรรมดาหรือมีที่อร่อยกว่า","ถ้าอาหารที่ทำออกมาหน้าตาไม่เป็นท่า แต่รสยังเป็นแบบที่ใจอยากได้ ฉันก็ยังรู้สึกดีกับจานนั้น แม้จะไม่อยากถ่ายรูปให้ใครเห็น"],"Fe":["เวลามีคนทำอาหารให้ ฉันชมและแสดงให้เขาเห็นว่าชอบ แม้จริง ๆ จะไม่ค่อยถูกปาก","เลือกร้านกินข้าวกับเพื่อนในแชต ฉันมักรอจับน้ำเสียงของแต่ละคนก่อนแล้วค่อยเสนอ จนบางทีมีคนสรุปร้านไปก่อนแล้ว"]},"p":{"Ni":["หลังเล่นหรือดูกีฬามาหลายนัด ฉันมักรู้สึกว่ามีรูปแบบลึก ๆ อย่างหนึ่งวนกลับมา จนบางทีมองข้ามว่าแต่ละนัดต่างกันตรงไหน","ถ้านาฬิกาหรือแอปจับเวลาดับกลางทางวิ่ง ฉันมักวิ่งต่อตามภาพในหัวว่าวันนี้อยากให้จบแบบไหน มากกว่าจะมานั่งกะระยะเอง"],"Ne":["เวลาดูกีฬา ฉันชอบคิดว่า “ถ้าทีมนี้ลองแผนอื่นจะเป็นยังไง” ต่อไปได้อีกหลายฉาก","เลือกว่าวันนี้จะออกกำลังกายแบบไหน ฉันมักนึกได้หลายอย่างแล้วจับมาผสมกันเป็นแบบใหม่ แม้บางแบบที่คิดขึ้นเล่นแล้วจะไม่ค่อยเข้าท่า"],"Si":["ก่อนลงเล่นกีฬา ฉันมีลำดับวอร์มและของใช้ประจำที่ทำเหมือนเดิมแทบทุกรอบ ถ้าขาดไปอย่างหนึ่งจะรู้สึกไม่ค่อยเข้าที่","ถ้ารองเท้าคู่ประจำขาดจนต้องใส่คู่สำรอง ฉันมักรู้สึกถึงความต่างทุกก้าว และเทียบกับความรู้สึกเดิมของเท้าไปทั้งเกม"],"Se":["ฉันชอบดูกีฬาที่สนามจริง เพราะได้ยินเสียง เห็นความเร็ว และรู้สึกถึงแรงปะทะตรงหน้า","เลือกว่าจะวิ่งเส้นไหน ฉันมักดูจากอากาศตอนก้าวออกจากบ้าน เช่น ลมดีหรือแดดอ่อน แล้วไปทางนั้นเลย"],"Ti":["เวลามีคนเถียงเรื่องกติกากีฬา ฉันอยากไล่ให้ชัดว่ากติกาข้อนั้นนิยามไว้ว่าอย่างไรกันแน่","ถ้าจู่ ๆ ตีหรือเตะพลาดติดกันหลายครั้ง ฉันมักหยุดไล่คิดว่ากลไกของท่าเปลี่ยนไปตรงไหน ถ้ายังไม่เจอเหตุผลก็เล่นต่อไม่ค่อยสบายใจ"],"Te":["ในทีมกีฬา ถ้าแผนไหนไม่ได้ผลในสนาม ฉันพูดตรง ๆ ให้เปลี่ยนเลย แม้บางคนจะไม่พอใจ","วันที่มีเวลาซ้อมน้อย ฉันมักตัดเหลือแค่ท่าที่ช่วยเป้าการซ้อมมากที่สุด แม้ท่าที่สนุกกว่าจะต้องรอวันอื่น"],"Fi":["เวลาเชียร์กีฬา ฉันเชียร์ทีมหรือนักกีฬาที่ใจผูกพันจริง ๆ แม้จะไม่ใช่ทีมที่คนส่วนใหญ่เชียร์","ถ้าแข่งแพ้ทั้งที่ได้เล่นในแบบที่ใจอยากเล่น ฉันมักไม่ค่อยเสียดายนัก แม้รู้ว่าถ้าเล่นตามแผนเดิมอาจมีโอกาสมากกว่า"],"Fe":["เวลาเล่นกีฬากับเพื่อน ฉันมักคอยดูว่าทุกคนยังสนุกอยู่ไหม จนบางทีเล่นไม่เต็มที่เท่าคนอื่นในทีม","เลือกกีฬาเล่นกับกลุ่มเพื่อน ฉันมักเสนอกีฬาที่ทุกคนเล่นได้พอ ๆ กัน จนบางทีเกมออกมาเรื่อย ๆ ไม่มีใครได้เล่นเต็มที่สักคน"]},"a":{"Ni":["งานศิลปะหลายชิ้นของฉันดูต่างกัน แต่จริง ๆ วนอยู่รอบแก่นความหมายเดียวที่ฉันยังค้นอยู่","เลือกว่าจะใช้สีโทนไหน ฉันมักรู้สึกถึงโทนเดียวที่ตรงกับความหมายของงานตั้งแต่แรก แล้วตัดโทนอื่นออกหมด แม้ยังไม่ได้ลองเทียบสักโทน"],"Ne":["เวลาเห็นงานศิลปะชิ้นหนึ่ง ฉันมักนึกต่อว่ามันจะกลายเป็นอะไรได้อีก ถ้าเปลี่ยนสื่อหรือบริบท","ถ้าสีหกเลอะบนงานที่วาดอยู่ ฉันมักนึกออกหลายทางว่าจะเปลี่ยนรอยนั้นเป็นอะไรได้บ้าง จนงานไปไกลจากที่ตั้งใจแต่แรก"],"Si":["ฉันเก็บสมุดสเก็ตช์หรืองานเก่าไว้ และชอบเปิดดูเทียบว่าวิธีทำงานของฉันเปลี่ยนไปอย่างไร","เลือกกระดาษหรือพู่กัน ฉันมักหยิบยี่ห้อและขนาดเดิมที่มือคุ้น เพราะรู้ว่าสีจะซึมและลากออกมาแบบไหน"],"Se":["เวลาไปดูนิทรรศการ ฉันถูกดึงด้วยขนาด สี และพื้นผิวของงานจริงตรงหน้า มากกว่าคำอธิบายข้างงาน","ถ้าแสงที่ใช้วาดหรือถ่ายภาพเปลี่ยนกะทันหัน เช่น เมฆบังแดด ฉันมักปรับงานตามแสงที่เห็นตอนนั้นเลย แทนที่จะรอให้แสงกลับมาแบบเดิม"],"Ti":["อ่านคำวิจารณ์งานศิลปะ ฉันมักดูว่าเหตุผลในนั้นไปด้วยกันไหม มากกว่าดูว่าคนเขียนชอบหรือไม่","ก่อนเลือกว่าจะจัดองค์ประกอบแบบไหน ฉันมักไล่คิดเองว่าแต่ละแบบพาสายตาคนดูไปทางไหนเพราะอะไร จนบางทีหน้ากระดาษยังว่างอยู่นาน"],"Te":["ถ้าเทคนิคหรือวัสดุไหนเสียเวลาแต่ผลไม่ต่าง ฉันเปลี่ยนไปใช้ทางที่เร็วกว่าเลย แม้จะเสียเสน่ห์ไปบ้าง","ถ้าสีที่ต้องใช้หมดกลางงาน ฉันมักสั่งสีเพิ่มไว้แล้วข้ามไปทำส่วนที่ไม่ต้องใช้สีนั้นก่อน แม้ลำดับงานจะสลับจากที่วางไว้"],"Fi":["งานศิลปะบางชิ้นฉันเก็บไว้ดูคนเดียว เพราะมันมีความหมายกับฉันเกินกว่าจะให้ใครวิจารณ์","เลือกว่าจะลงงานชิ้นไหนให้คนเห็น ฉันมักเลือกชิ้นที่ใจรู้สึกว่าเป็นตัวเองที่สุด แม้จะไม่ใช่ชิ้นที่ดูเรียบร้อยที่สุด"],"Fe":["เวลาเพื่อนให้ดูงานศิลปะของเขา ฉันมักพูดถึงจุดที่ชอบก่อน จนจุดที่อยากติจริง ๆ ไม่ได้พูดออกไป","ถ้างานที่ตั้งใจทำเป็นของขวัญออกมาไม่อย่างที่คิด ฉันมักห่วงว่าคนรับจะรู้สึกยังไงจนแก้แล้วแก้อีก แม้เขาอาจไม่ได้สังเกตตรงนั้นเลย"]},"t":{"Ni":["ก่อนรับสัตว์เลี้ยง ฉันมักมีภาพในหัวว่าอีกหลายปีชีวิตกับมันจะเป็นแบบไหน แล้วตัดสินใจจากภาพนั้น แม้ยังไม่ได้ดูข้อมูลละเอียด","ถ้าสัตว์เลี้ยงเปลี่ยนนิสัยการกินไปเฉย ๆ ฉันมักนึกเป็นภาพว่ามันกำลังเข้าสู่ช่วงใหม่ของชีวิต แม้สุดท้ายอาจเป็นแค่เบื่ออาหารชั่วคราว"],"Ne":["เวลาสัตว์เลี้ยงทำอะไรแปลกใหม่ ฉันนึกได้หลายความเป็นไปได้ว่ามันอาจกำลังคิดหรืออยากได้อะไร","ถ้าสัตว์เลี้ยงกัดของเล่นชิ้นโปรดพัง ฉันมักนึกได้หลายอย่างว่าจะดัดแปลงของในบ้านเป็นของเล่นใหม่ แม้หลายชิ้นมันจะไม่แตะเลย"],"Si":["ฉันชอบให้กิจวัตรของสัตว์เลี้ยงเป็นแบบเดิมทุกวัน เช่น กินเวลาเดิม เดินเส้นทางเดิม เพราะรู้สึกว่าทุกอย่างเข้าที่","เลือกขนมหรือของเล่นให้สัตว์เลี้ยง ฉันมักซื้อแบบเดิมที่เคยเห็นมันชอบ แม้ที่ร้านจะมีของใหม่ ๆ วางให้เลือกเต็มชั้น"],"Se":["เวลาสัตว์เลี้ยงตื่นตกใจหรือซน ฉันลงมือจัดการตรงหน้าเลย แล้วปรับไปตามที่มันตอบสนอง","เลือกว่าจะพาสัตว์เลี้ยงออกไปเดินช่วงไหน ฉันมักดูจากแดดและพื้นถนนตอนนั้นแล้วออกไปเลย แม้บางวันเดินได้ไม่ถึงหัวซอยก็ต้องพากลับ"],"Ti":["เวลามีคนบอกว่าสัตว์ตัวไหน “ขี้อ้อน” หรือ “ขี้หวง” ฉันมักอยากรู้ว่าเขาใช้คำนั้นหมายถึงพฤติกรรมอะไรแน่","เลือกกรงหรือที่นอนให้สัตว์เลี้ยง ฉันมักไล่คิดเองว่าแต่ละแบบเข้ากับพฤติกรรมของมันเพราะอะไร จนเลือกช้ากว่าซื้อตามที่ร้านแนะนำ"],"Te":["เวลาเลือกอาหารหรือของใช้ให้สัตว์เลี้ยง ฉันดูข้อมูลและผลที่เห็นจริง ถ้าไม่ได้ผลก็เปลี่ยนทันที","ถ้าอาหารที่สัตว์เลี้ยงกินประจำขาดตลาด ฉันมักสั่งยี่ห้อที่หาง่ายและส่งถึงเร็วที่สุดมาก่อน แม้ยังไม่แน่ใจว่ามันจะชอบไหม"],"Fi":["ฉันอยากให้วิธีที่ฉันเลี้ยงสัตว์ตรงกับความรู้สึกจริงของฉัน ไม่ใช่ทำตามกระแสคนเลี้ยงสัตว์","เลือกว่าจะลงรูปสัตว์เลี้ยงไหม ฉันมักเก็บบางช่วงที่ใจรู้สึกว่าเป็นเรื่องของเราสองคนไว้ไม่ลง แม้รูปนั้นจะน่ารักแค่ไหน"],"Fe":["เวลาเพื่อนเล่าว่าสัตว์เลี้ยงของเขาป่วย ฉันมักหนักใจตามไปด้วยจนสลัดออกยาก แม้จะยังไม่ได้เห็นตัวมันเลย","ถ้าสัตว์เลี้ยงตกใจฟ้าร้องจนส่งเสียงดังตอนดึก ฉันมักห่วงว่าห้องข้าง ๆ จะรำคาญไหม จนวุ่นกับการทำให้มันเงียบมากกว่าปลอบมัน"]},"h":{"Ni":["เวลาทะเลาะกันซ้ำ ๆ ฉันมักรู้สึกว่าหลายเรื่องที่ดูต่างกัน จริง ๆ มาจากเรื่องเดียวกันที่ลึกกว่านั้น","การกระทำเล็ก ๆ ของอีกฝ่ายบางอย่าง ติดอยู่ในใจฉันเหมือนสัญญาณว่าเรากำลังไปทางไหน จนบางทีฉันคิดลึกเกินไป","นัดเดทต้องเลื่อนหลายรอบเพราะตารางชนกัน ฉันมักเห็นภาพว่าเราสองคนจะต้องหาจังหวะแบบไหนในระยะยาว แม้ยังไม่ได้คุยเรื่องนี้กัน"],"Ne":["เวลาอีกฝ่ายเล่าเรื่องที่ชอบ ฉันมักต่อยอดเป็นไอเดียที่เราอาจลองทำด้วยกันได้อีกหลายอย่าง จนบางทีเขายังเล่าไม่จบ","ตอนเริ่มรู้จักใคร ฉันมักเห็นหลายด้านในตัวเขาที่อาจพัฒนาไปได้อีกหลายทาง จนบางทียังสรุปไม่ได้ว่ารู้สึกยังไง","เลือกหนังดูกับคนที่คบ ฉันมักหยิบแนวที่เรายังไม่เคยดูด้วยกัน เพราะนึกได้ว่าดูจบจะคุยต่อได้หลายทาง แม้บางเรื่องจะไม่เข้าทาง"],"Si":["กลิ่นน้ำหอมหรือเพลงบางเพลง พาให้ฉันนึกถึงช่วงเวลากับคนที่เคยรักได้ละเอียดเหมือนเพิ่งเกิดขึ้น","ฉันรู้สึกปลอดภัยกับความรักที่ค่อย ๆ คุ้นเคยกันทีละนิด มากกว่าความรักที่จังหวะเปลี่ยนไปมาบ่อย ๆ","ถ้าร้านประจำที่ไปกับคนที่คบปิดในวันนั้น ฉันมักพาไปร้านที่คล้ายกันซึ่งเคยไปแล้วรู้ว่านั่งสบาย แม้จะต้องนั่งรถต่อไปอีกไกล"],"Se":["ฉันแสดงความรักผ่านสิ่งที่ทำด้วยกันตรงหน้า เช่น จับมือ ทำอาหารด้วยกัน หรือพาไปลองของอร่อย","ถ้าเดทไม่เป็นไปตามแผน ฉันสนุกกับการด้นสดไปตามสิ่งที่เจอระหว่างทาง","เลือกร้านสำหรับเดท ฉันมักเลือกจากรูปบรรยากาศจริง แสงไฟ และหน้าตาอาหาร มากกว่าตัวเลขคะแนนรีวิว"],"Ti":["เจอคำแนะนำเรื่องความรักแบบสูตรตายตัว ฉันชอบคิดเองก่อนว่ามันจริงแค่ไหน และใช้ได้ในกรณีไหน","ถ้ารู้สึกหึง ฉันมักถามตัวเองก่อนว่ามันมาจากอะไรและฟังขึ้นตรงไหน แม้บางทีอีกฝ่ายจะมองว่าฉันคิดเยอะไป","จะเลือกวันครบรอบไว้ฉลองกับคนที่คบ ฉันมักอยากนิยามให้ชัดก่อนว่าจะนับจากวันไหน แม้สุดท้ายวันที่ได้จะต่างกันแค่ไม่กี่วัน"],"Te":["ถ้าจะคบกันจริงจัง ฉันอยากคุยเป้าหมายชีวิตให้ชัดตั้งแต่ต้น เช่น จะอยู่ที่ไหน แม้มันจะฟังดูไม่โรแมนติก","ถ้าความสัมพันธ์ไหนลากยาวโดยไม่ขยับไปไหน ฉันมักตัดสินใจให้ชัดว่าจะไปต่อหรือพอแค่นี้","กดบัตรคอนเสิร์ตที่จะไปกับคนที่คบไม่ทัน ฉันมักรีบหางานอื่นที่ใกล้เคียงที่สุดในวันเดียวกันแล้วจองให้จบ แม้จะไม่ใช่งานที่ตั้งใจ"],"Fi":["ฉันจะบอกรักใครก็ต่อเมื่อรู้สึกจริงในใจ ต่อให้จังหวะนั้นอีกฝ่ายจะรอฟังอยู่ก็ตาม","ฉันมักถามตัวเองว่าความรักแบบนี้ตรงกับคนที่ฉันอยากเป็นไหม ไม่ใช่แค่ว่าดูดีในสายตาคนอื่น","เลือกรูปคู่ที่จะเก็บไว้ ฉันมักเลือกรูปที่ตรงกับความรู้สึกจริงของวันนั้น แม้จะไม่ใช่รูปที่ดูดีที่สุด"],"Fe":["ถ้าคนที่คบอารมณ์ไม่ดี ฉันมักเปลี่ยนแผนของเราตามเขาทันที จนเขาเองแทบไม่รู้ว่าฉันอยากทำอะไร","ฉันมักนึกว่าคนรอบตัวจะรู้สึกยังไงกับความสัมพันธ์ของเรา จนบางทีแฟนรู้สึกว่าฉันห่างไปเวลาอยู่กับคนอื่น","ถ้าเดทที่วางไว้ต้องยกเลิกเพราะฝนหนัก ฉันมักคิดวนว่าอีกฝ่ายจะผิดหวังแค่ไหน ทั้งที่เขาอาจแค่ดีใจที่ได้นอนพักอยู่บ้าน"]},"y":{"Ni":["บางประโยคจากหนังสือหรือคำพูดของใครสักคน มักติดอยู่ในใจฉันหลายวัน จนวันหนึ่งความหมายของมันก็ชัดขึ้นมาเองกับชีวิตตอนนั้น","ความเข้าใจเรื่องชีวิตของฉันมักผุดขึ้นมาเองหลังปล่อยเรื่องนั้นไว้สักพัก จนบางทีอธิบายให้คนอื่นฟังไม่ถูก","ต้องเลือกระหว่างสองทางเล็ก ๆ ที่ดีพอกัน ฉันมักรอจนรู้สึกว่าทางหนึ่ง “เข้าทาง” กับภาพรวมของชีวิตช่วงนี้ แม้เรื่องจะค้างไปหลายวัน"],"Ne":["เจอคำถามใหญ่เรื่องชีวิต ฉันชอบถือคำตอบที่เป็นไปได้หลายแบบไว้พร้อมกัน มากกว่ารีบเลือกคำตอบเดียว","คุยกับเพื่อนเรื่องว่าชีวิตแบบไหนถึงเรียกว่าดี ฉันมักแตกประเด็นไปหลายทาง จนวงคุยไปไกลจากเรื่องที่เริ่มไว้","เวลาแผนชีวิตสะดุดเพราะเรื่องสุดวิสัย หลักของฉันคือมองหาว่ามันเปิดทางให้ลองอะไรได้อีก จนบางทีทางเลือกเยอะจนยังไม่ได้เริ่มสักทาง"],"Si":["เวลาใจไม่นิ่ง ฉันมักกลับไปทำสิ่งที่เคยทำแล้วสงบ เช่น เดินเส้นทางเดิม นั่งที่เดิม หรือฟังเพลงเดิม","เวลาต้องตัดสินใจเรื่องใหญ่ ฉันมักเทียบความรู้สึกในตัวตอนนี้กับครั้งก่อนที่เจอเรื่องคล้ายกัน เช่น ใจหวิวหรือตัวเบา แล้วใช้ช่วยเลือก","วันไหนสะดุดตั้งแต่เช้า เช่น นาฬิกาปลุกไม่ดัง ฉันมักยึดหลักเดิมที่เคยใช้ คือทำทีละอย่างตามลำดับที่คุ้น แม้จะช้ากว่าลัดขั้นไปเลย"],"Se":["ช่วงที่ฉันรู้สึกว่าชีวิตลงตัว มักเป็นตอนอยู่กับธรรมชาติตรงหน้า เช่น ลมเย็น แสงเช้า หรือเสียงน้ำ","ถ้าได้ยินวิธีคิดใหม่เรื่องชีวิต ฉันอยากลองใช้เลย แล้วปรับไปตามที่เจอจริง มากกว่าคิดทบทวนนาน ๆ ก่อน","หลักที่ฉันใช้กับเรื่องเล็ก ๆ คือดูจากสิ่งตรงหน้าตอนนั้น เช่น ร้านไหนเปิดอยู่ก็กินร้านนั้น โดยไม่ค่อยคิดย้อนว่าร้านอื่นจะดีกว่าไหม"],"Ti":["ก่อนคุยเรื่องชีวิตต่อ ฉันอยากให้ชัดก่อนว่าคำอย่าง “ความสำเร็จ” หรือ “ความสุข” ที่ใช้กันอยู่หมายถึงอะไรกันแน่","ต่อให้เป็นหลักคิดที่ฉันใช้เอง ถ้าเจอจุดที่ขัดกันเอง ฉันก็อยากรื้อคิดใหม่ แม้จะรู้สึกไม่มั่นคงไปพักหนึ่ง","เจอเรื่องไม่คาดคิด เช่น ของที่เพิ่งซื้อพังเร็ว ฉันมักไล่คิดว่ามันเกิดจากอะไรก่อนจะสรุปเป็นข้อคิด แม้บางเรื่องจะเป็นแค่ความบังเอิญ"],"Te":["ฉันเลือกหยิบแนวคิดเรื่องชีวิตมาใช้เป็นข้อ ๆ ข้อไหนช่วยให้ใช้ชีวิตคล่องขึ้นก็เก็บไว้ ที่เหลือก็ปล่อยไป","หลักของฉันคืองานไหนทำร่วมกันต้องมีลำดับและหน้าที่ชัด จนบางทีคนอื่นรู้สึกว่าฉันรวบรัดไปกับเรื่องสบาย ๆ","เรื่องเล็กที่เลือกทุกวัน เช่น กินอะไรหรือใส่ชุดไหน ฉันมักเลือกทางที่ทำให้วันนั้นเดินเร็วที่สุด แม้บางทีจะรีบจนต้องกลับมาเปลี่ยน"],"Fi":["ถ้าค่านิยมที่คนรอบตัวถือกันขัดกับสิ่งที่ฉันรู้สึกว่าถูก ฉันมักยังทำตามได้ แต่ในใจจะรู้ชัดว่ามันไม่ใช่ตัวฉัน","หลักที่ฉันยึดลึก ๆ มักมาจากสิ่งที่รู้สึกข้างในมากกว่าสิ่งที่ได้ยินต่อกันมา แม้บางทีจะทำให้คิดไม่เหมือนคนรอบตัว","แผนที่รอมานานถูกเลื่อนเพราะสุดวิสัย ฉันมักถามตัวเองว่าที่อยากทำเพราะอะไร แล้วเลือกทางแทนจากตรงนั้น แม้คนอื่นจะงงว่าเปลี่ยนไปทำไม"],"Fe":["เวลาคนในวงมีหลักคิดเรื่องชีวิตต่างกัน ฉันมักหยิบจุดร่วมมาพูดให้ทุกคนสบายใจ จนบางทีไม่ได้บอกว่าตัวเองคิดอะไรจริง ๆ","เวลาเพื่อนเล่าเป้าหมายชีวิตที่ต่างจากฉันมาก ฉันมักคอยดูว่าเขาอยากให้ตอบรับแบบไหน จนบางทีจำรายละเอียดที่เขาเล่าได้ไม่ครบ","เรื่องเล็กที่ใช้ร่วมกัน เช่น นั่งโต๊ะไหน หลักของฉันคือถามให้ครบทุกคนก่อน จนเรื่องที่ควรจบในนาทีเดียวกลายเป็นคุยกันนาน"]},"z":{"Ni":["ฉันมักรู้สึกว่าเรื่องที่ผ่านมาทั้งดีและร้าย ค่อย ๆ ชี้ไปทางเดียวกัน แม้จะอธิบายเป็นเหตุผลทีละข้อไม่ค่อยได้","รายละเอียดความฝันของฉันเปลี่ยนได้เรื่อย ๆ แต่แก่นข้างใต้ยังเป็นภาพเดิม จนบางทีแผนที่เคยวางไว้ก็ถูกทิ้งไปง่าย ๆ","เวิร์กช็อปที่สมัครไว้ลองตามฝันถูกเลื่อนไม่มีกำหนด ฉันมักปล่อยเรื่องนี้ค้างในใจ จนวันหนึ่งก็เห็นเองว่ามันเข้ากับภาพใหญ่ยังไง"],"Ne":["ถ้ามีคนเล่าความฝันให้ฟัง ฉันมักช่วยคิดต่อว่ามันแตกไปทำอะไรได้อีกบ้าง จนบางทีไอเดียไปไกลกว่าที่เขาตั้งใจ","ฉันได้แรงบันดาลใจจากการจับเรื่องที่ไม่เกี่ยวกันมาคู่กัน เช่น งานอดิเรกกับงานประจำ แล้วเห็นทางใหม่","ต้องตั้งชื่อให้โปรเจกต์ส่วนตัว ฉันมักคิดชื่อออกมาหลายแบบที่แต่ละชื่อพาไปอีกทาง แม้บางชื่อจะไปไกลจนไม่เหลือเค้าของโปรเจกต์เลย"],"Si":["เวลาตั้งเป้าใหม่ ฉันมักดูจากสิ่งที่เคยทำมาแล้วว่าตัวเองไปได้แค่ไหน แล้วค่อยขยับต่อจากตรงนั้น","ก่อนลงมือทำสิ่งที่ฝัน ฉันมีเพลงหรือของประจำที่หยิบมาใช้ซ้ำ ๆ เพราะมันทำให้ใจเข้าที่","เลือกที่จดไอเดียเรื่องที่ฝัน ฉันมักใช้สมุดหรือแอปแบบเดิมที่จดมาหลายปีแล้วเปิดหาง่าย แม้จะมีตัวใหม่ที่ดูน่าใช้กว่า"],"Se":["ความฝันของฉันชัดขึ้นเมื่อได้ไปเห็นของจริงตรงหน้า เช่น ไปดูงาน หรือไปยืนอยู่ในที่ที่อยากทำงาน","ถ้าความฝันเริ่มดูไกลเกินไป ฉันเลือกโฟกัสสิ่งที่ทำได้วันนี้ และสนุกกับมันตรงหน้า","งานที่ตั้งใจไปหาแรงบันดาลใจถูกเลื่อนเพราะฝน ฉันมักหาที่ใกล้ ๆ ที่มีของจริงให้ดูแทน เช่น แกลเลอรีแถวนั้น แม้จะไม่ตรงกับที่ฝันไว้"],"Ti":["ก่อนตั้งเป้าตามคนอื่น ฉันชอบถามตัวเองว่าคำว่า “ชีวิตที่ดี” ที่คนพูดกัน หมายถึงอะไรกันแน่","ฟังเรื่องเส้นทางชีวิตของคนที่ไปถึงฝัน ฉันชอบไล่หาว่าปัจจัยไหนเป็นเหตุจริง ส่วนไหนแค่เรื่องบังเอิญ","เลือกคำที่จะใช้เล่าความฝันของตัวเอง ฉันมักหาคำที่ตรงกับที่คิดที่สุด จนบางทีคนถามแค่ว่าอยากทำอะไร ฉันก็ยังตอบไม่ออก"],"Te":["ฉันแตกความฝันใหญ่เป็นเป้าย่อยรายเดือน แล้วเช็กทุกสิ้นเดือนว่าได้ตามที่ตั้งไว้ไหม แม้บางเดือนจะกดดันตัวเอง","ถ้าต้องเลือกระหว่างความฝันสองอย่าง ฉันเทียบว่าอันไหนมีโอกาสเกิดจริงมากกว่า แล้วทุ่มให้อันนั้น","ถ้าเครื่องที่ใช้ทำโปรเจกต์ส่วนตัวเสียไปหลายวัน ฉันมักตัดส่วนที่ไม่จำเป็นออกให้ทันวันที่ตั้งไว้ แม้งานจะบางกว่าที่วาดภาพไว้มาก"],"Fi":["เห็นคนรอบตัวไปได้ไกลในทางไหน ฉันมักถามตัวเองก่อนว่าทางนั้นใช่ของฉันไหม จนบางทีปล่อยโอกาสที่คนอื่นว่าดีผ่านไป","ความฝันบางอย่างฉันยังเก็บไว้ แม้ดูแล้วไม่น่าเป็นไปได้ เพราะใจยังรู้สึกว่ามันเป็นของฉันจริง ๆ","เลือกว่าจะเล่าความฝันให้ใครฟัง ฉันมักเก็บไว้กับตัวจนกว่าจะรู้สึกว่ามันเป็นของฉันจริง ๆ แม้บางทีจะไม่มีใครรู้ว่าฉันกำลังทำอะไรอยู่"],"Fe":["ฉันมักมีแรงทำตามฝันมากขึ้นเมื่อรู้ว่ามันทำให้คนที่ฉันห่วงสบายใจไปด้วย ถ้าเขาไม่ค่อยเห็นด้วย แรงของฉันก็หายไปเยอะ","บางครั้งฉันปรับความฝันของตัวเองให้เข้ากับแผนของคนใกล้ตัว เช่น แฟนหรือเพื่อนสนิท จนภาพที่ตัวเองอยากได้ค่อย ๆ จางลง","ตลาดนัดที่ตั้งใจเอาของทำมือไปขายเลื่อนไปไม่มีกำหนด ฉันมักรีบไล่บอกคนที่เคยบอกว่าจะมาแวะทีละคน แม้บางคนอาจลืมไปแล้วว่าเคยพูดไว้"]},"j":{"Ni":["ระหว่างเที่ยว ฉันมักมีช่วงที่จู่ ๆ ก็เข้าใจอะไรบางอย่างเกี่ยวกับชีวิตตัวเอง ทั้งที่ไม่ได้ตั้งใจคิด","ดูรูปทริปเก่า ๆ ทีไร ฉันมักเห็นว่ามีเรื่องเดียวกันซ่อนอยู่ในทุกทริปที่ฉันเลือกไป","เลือกเมืองสำหรับทริปหน้า ฉันมักเลือกที่ที่ภาพในหัวกลับมาวนบ่อยที่สุดช่วงนี้ แม้จะยังไม่ได้เทียบกับที่อื่นเลย"],"Ne":["ได้ยินว่ามีที่ไหนน่าสนใจ ฉันนึกต่อทันทีว่าจะเอาไปผสมกับทริปไหนได้บ้าง จนลิสต์ที่อยากไปยาวไม่จบ","ฉันชอบเที่ยวแบบตั้งโจทย์แปลก ๆ เช่น นั่งรถเมล์สายสุ่ม หรือตามหาของบางอย่างให้ทั่วเมือง","เลือกร้านมื้อเย็นระหว่างทริป ฉันมักไล่ดูหลายแบบที่ยังไม่ได้กิน จนเดินเลยร้านที่ตั้งใจไว้ไปหลายร้าน"],"Si":["ฉันมีสไตล์เที่ยวประจำที่รู้ว่าเหมาะกับตัวเอง เช่น ตื่นเวลาไหน พักแบบไหน และไม่ค่อยเปลี่ยน","เวลาเที่ยว ฉันฟังร่างกายตัวเองจากที่เคยเจอมา เช่น เหนื่อยระดับไหนต้องพัก หรือกินอะไรแล้วท้องไม่ไหว","ถ้าแบตมือถือหมดกลางทริป ฉันมักหาทางจากสิ่งที่จำได้ตอนเดินผ่านมา เช่น ร้านหรือหัวมุมที่เห็นไว้ แล้วค่อย ๆ เทียบไปทีละจุด"],"Se":["ระหว่างทาง ถ้าได้ยินเสียงดนตรีหรือได้กลิ่นอาหารจากที่ไหน ฉันมักเดินตามไปดู แม้จะต้องตัดบางที่ในแผนออก","เวลาถ่ายรูปตอนเที่ยว ฉันจดจ่อกับแสง สี และจังหวะตรงหน้า ว่ามุมนี้ตอนนี้กำลังสวย","ถ้าฝนตกลงมากลางทาง ฉันมักหลบเข้าร้านหรือซอยที่อยู่ตรงหน้าแล้วเที่ยวต่อตรงนั้นเลย แม้จะไม่ได้กลับไปที่ที่ตั้งใจไว้อีก"],"Ti":["ฉันมีหลักเที่ยวของตัวเองไม่กี่ข้อที่ใช้คิดได้กับทริปหลายแบบ และคอยปรับให้มันไม่ขัดกันเอง","เวลามีคนบอกว่าที่ไหน “ต้องไป” ฉันอยากรู้ก่อนว่าเพราะอะไร ถ้าเหตุผลไม่ชัดฉันก็ไม่ค่อยอยากไป"],"Te":["พอทริปมีปัญหา เช่น เที่ยวบินดีเลย์ ฉันมักรีบเลือกทางใหม่แล้วจัดการต่อเลย แม้บางคนในกลุ่มยังอยากรอดูก่อน","กลับจากเที่ยว ฉันมักสรุปว่าอะไรคุ้ม อะไรไม่คุ้ม แล้วจดไว้ใช้วางทริปครั้งหน้า","เลือกว่าจะไปต่อแต่ละจุดด้วยอะไร ฉันมักเทียบเวลากับค่าเดินทางแล้วเอาทางที่เร็วที่สุด แม้ทางอื่นจะได้เห็นวิวมากกว่า"],"Fi":["ของที่ฉันซื้อกลับจากเที่ยว มักเป็นของชิ้นเล็กที่มีความหมายกับใจฉัน แม้คนอื่นดูแล้วอาจไม่เข้าใจ","ไปเที่ยวกับกลุ่ม ฉันมักแอบเก็บสิ่งเล็ก ๆ ที่มีความหมายกับใจตัวเองไว้ทำด้วย แม้บางทีจะต้องเดินตามกลุ่มให้ทันทีหลัง","ถ้าที่ที่ตั้งใจมาที่สุดปิดปรับปรุง ฉันมักเลือกที่แทนจากว่าที่ไหนยังรู้สึกเป็นทริปของฉันอยู่ แม้จะไม่ใช่ที่ที่คนแนะนำกันมากที่สุด"],"Fe":["ก่อนเสนอที่เที่ยวในกลุ่ม ฉันมักเลือกที่ที่คิดว่าคนส่วนใหญ่น่าจะชอบ แม้ที่ที่ฉันอยากไปเองจะเงียบหายไปจากลิสต์","ถ้าในทริปเริ่มมีคนไม่พอใจกัน ฉันมักรู้สึกตึงตามไปด้วยจนเที่ยวไม่ค่อยสนุก แม้เรื่องนั้นจะไม่เกี่ยวกับฉัน","เที่ยวกับเพื่อน ฉันมักคอยดูว่าใครเริ่มหิวหรือเหนื่อย แล้วเสนอร้านใกล้สุดก่อน จนบางทีรีบพาเข้าร้านทั้งที่ยังไม่มีใครหิวจริง"]},"n":{"Ni":["ข่าวบางเรื่องฉันอ่านแล้ววางไว้ก่อน แล้วอีกหลายวันถึงนึกออกว่ามันหมายถึงอะไรจริง ๆ","ฉันมักสนใจว่าข่าวหนึ่งสะท้อนอะไรลึก ๆ ของสังคม มากกว่าตัวเหตุการณ์ว่าใครทำอะไรที่ไหน","ถ้าอ่านข่าวค้างไว้แล้วหาลิงก์เดิมไม่เจอ ฉันมักจำได้แค่ใจความรวม ๆ ว่าเรื่องนั้นกำลังชี้ไปทางไหน แม้รายละเอียดจะหายไปเกือบหมด"],"Ne":["อ่านข่าวแปลก ๆ แล้ว ฉันชอบเดาเล่น ๆ หลายแบบว่าเบื้องหลังมันเป็นไปได้กี่ทาง จนบางทีเพื่อนตามไม่ทัน","ข่าวเล็ก ๆ บางข่าวทำให้ฉันปิ๊งไอเดียไปเรื่องที่ไม่เกี่ยวกันเลย เช่น โปรเจกต์ส่วนตัวที่คิดค้างไว้","เลือกว่าจะอ่านข่าวไหนก่อนจากหน้าแรก ฉันมักกดเรื่องที่พาดหัวชวนให้คิดต่อได้หลายทาง จนข่าวที่ตั้งใจจะอ่านถูกเลื่อนไปท้ายสุด"],"Si":["ข่าวที่เกิดในที่ที่ฉันเคยไป ฉันนึกภาพสถานที่นั้นตามที่จำได้ขึ้นมา แล้วเทียบว่าเปลี่ยนไปแค่ไหน","ฉันจำได้ละเอียดว่าตอนข่าวใหญ่ ๆ ในอดีตออกมา ตัวเองอยู่ที่ไหน กำลังทำอะไรอยู่","ถ้าแอปข่าวที่ใช้ประจำเปิดไม่ขึ้น ฉันมักหันไปหาแหล่งที่เคยใช้ก่อนหน้านั้น เพราะรู้แล้วว่าหน้าตาและการจัดข่าวเป็นแบบไหน"],"Se":["เวลาดูภาพข่าว ฉันสังเกตรายละเอียดในภาพ เช่น สีหน้าคน ป้าย หรือสภาพถนน มากกว่าอ่านคำบรรยาย","พอมีข่าวเตือนเรื่องพายุหรือน้ำท่วม ฉันออกไปดูท้องฟ้ากับถนนจริงก่อน แล้วตัดสินใจจากที่เห็น","เลือกว่าจะอ่านข่าวไหน ฉันมักกดเรื่องที่มีภาพหรือคลิปเหตุการณ์จริงให้เห็นก่อน แม้พาดหัวจะไม่ได้บอกอะไรมาก"],"Ti":["อ่านข่าวทีไร ฉันอดไม่ได้ที่จะแยกว่าประโยคไหนเป็นข้อเท็จจริง ประโยคไหนเป็นความเห็น จนอ่านข่าวสบาย ๆ ไม่ค่อยได้","เจอคำศัพท์ใหม่ในข่าว ฉันต้องหาความหมายที่แน่ชัดก่อน ไม่อย่างนั้นจะรู้สึกว่ายังไม่เข้าใจจริง","ถ้าข่าวที่เคยอ่านถูกแก้ตัวเลขทีหลัง ฉันมักกลับไปไล่ว่าข้อสรุปเดิมยังต่อกันได้ไหมเมื่อตัวเลขเปลี่ยน จนหมดเวลากับข่าวเดียวไปเยอะ"],"Te":["ฉันจำกัดเวลาอ่านข่าวแต่ละวันไว้ชัด ๆ และข้ามข่าวที่ไม่มีผลกับเป้าหมายของฉัน แม้จะตกเรื่องที่คนอื่นคุยกัน","ถ้าข่าวกระทบที่ทำงานหรือชุมชน ฉันมักเป็นคนสรุปว่าแต่ละคนต้องเตรียมอะไร จนบางทีดูเหมือนรีบสั่งการ","เลือกว่าจะเก็บข่าวไหนไว้อ่านต่อ ฉันมักคัดเฉพาะเรื่องที่ต้องใช้ในสัปดาห์นี้ แล้วลบที่เหลือทิ้ง แม้บางเรื่องจะน่าสนใจอยู่"],"Fi":["ข่าวเดียวกัน ฉันอาจรู้สึกต่างจากคนส่วนใหญ่มาก เพราะมันไปแตะเรื่องที่ฉันให้ความสำคัญเป็นการส่วนตัว","ฉันเลิกตามสำนักข่าวหรือเพจที่ทำสิ่งที่ฉันรับไม่ได้ แม้เขาจะนำเสนอข่าวเร็วและครบ","ถ้าเรื่องที่ตามอยู่หายไปจากฟีดเพราะระบบเปลี่ยน ฉันมักตามกลับไปเฉพาะเรื่องที่ใจผูกไว้ แม้บางเรื่องที่ปล่อยไปจะยังอยากรู้ตอนจบ"],"Fe":["เวลาคุยข่าวกับคนที่คิดต่าง ฉันเลือกคำพูดให้อีกฝ่ายไม่รู้สึกถูกตัดสิน แม้จะพูดได้ไม่ตรงอย่างที่คิด","พอมีข่าวร้ายเกี่ยวกับคนรู้จัก ใจฉันมักไปค้างอยู่กับความรู้สึกของคนที่เกี่ยวข้อง จนทำเรื่องอื่นไม่ค่อยลง","เลือกข่าวส่งเข้ากลุ่มแชต ฉันมักดูก่อนว่าช่วงนี้ทุกคนคุยกันแนวไหน แล้วเลือกให้เข้ากับวง จนกว่าจะส่งได้ วงก็คุยเรื่องอื่นไปแล้ว"]},"i":{"Ni":["ไอเดียการลงทุนของฉันมักไม่ได้มาจากการค้นหา แต่ผุดขึ้นมาเองหลังจากครุ่นคิดเรื่องหนึ่งอยู่นาน","ฉันสนใจว่าเรื่องเล่าที่คนในตลาดพูดต่อ ๆ กัน สะท้อนความเชื่อลึก ๆ อะไรอยู่ข้างใต้","เห็นของชิ้นไหนกำลังเป็นกระแส ฉันมักนึกไปถึงว่าอีกสักพักคนจะมองมันแบบไหน แล้วตัดสินจากภาพนั้น แม้จะพลาดช่วงที่ใคร ๆ กำลังสนุกกับมัน","ถ้าของที่ตั้งใจซื้อหมดกะทันหัน ฉันมักนึกย้อนไปว่าที่จริงของชิ้นนั้นมีไว้เพื่อเรื่องอะไรในชีวิต จนบางทีได้ของคนละประเภทกลับมาแทน","เลือกระหว่างของสองชิ้นที่ใกล้เคียงกัน ฉันมักเลือกชิ้นที่รู้สึกว่าจะเข้ากับชีวิตช่วงหน้า จนบางทีชิ้นนั้นวางรอเป็นเดือนกว่าจะได้ใช้"],"Ne":["คุยเรื่องลงทุนกับใคร ไอเดียหนึ่งมักพาฉันไปนึกถึงอีกหลายไอเดีย จนสิ่งที่อยากลองมีมากกว่าที่ลงมือจริง","เห็นสินค้าแปลกใหม่ในชีวิตประจำวัน ฉันมักนึกเล่น ๆ ว่าใครอยู่เบื้องหลัง และมันจะต่อยอดไปได้อีกกี่ทาง","ถ้าสีหรือไซซ์ที่อยากได้หมด ฉันมักนึกต่อว่าเอาแบบอื่นมาใช้ได้อีกกี่แบบ จนเลือกไม่ถูกเพราะมีทางที่น่าลองหลายทาง","ก่อนกดซื้อ ฉันมักเผลอคิดต่อว่าของชิ้นนั้นพลิกไปใช้ทำอะไรอื่นได้บ้าง แม้ได้มาแล้วจะใช้อยู่แค่แบบเดียว"],"Si":["ฉันจำได้ชัดว่าตอนขาดทุนครั้งแรกรู้สึกยังไง และความรู้สึกนั้นยังใช้เตือนตัวเองถึงทุกวันนี้","ฉันสังเกตอาการของตัวเองเวลาจะตัดสินใจเรื่องเงิน เช่น ใจเต้นหรือมือเย็น แล้วใช้เป็นสัญญาณให้ช้าลง","ฉันมีลำดับเดินซูเปอร์มาร์เก็ตของตัวเอง เริ่มจากโซนเดิมไล่ไปจนครบ จนถ้าร้านย้ายชั้นวางก็ต้องตั้งหลักใหม่","ถ้าของที่ใช้ประจำเลิกผลิตไป ฉันมักไล่หาตัวที่ใกล้เคียงของเดิมที่สุด ทั้งกลิ่น เนื้อ และขนาด แม้จะต้องลองหลายยี่ห้อกว่าจะเจอ","จะซื้อของประเภทที่ใหม่สำหรับฉัน ฉันมักเอาของใกล้เคียงที่เคยใช้แล้วโอเคมาเป็นตัวเทียบ จนบางทีได้ของหน้าตาคล้ายชิ้นเดิม"],"Se":["ฉันชอบตอบสนองกับจังหวะตลาดตรงหน้า และปรับการตัดสินใจไปตามสิ่งที่เกิดขึ้นจริงในวันนั้น","เวลาเดินห้างหรือตลาด ฉันสังเกตว่าร้านไหนมีคนต่อคิว ร้านไหนเงียบเหงา แล้วเก็บไว้เป็นข้อมูลเรื่องธุรกิจ","ดูของออนไลน์ ฉันมักเลือกดูคลิปหรือรูปที่เห็นของจริงถูกจับ บิด หรือส่องกับแสง มากกว่าอ่านคำบรรยายสินค้า","ถ้าพัสดุที่สั่งไว้ล่าช้าจนไม่ทันใช้ ฉันมักหาของแทนจากร้านใกล้ ๆ ที่เห็นอยู่ตอนนั้นเลย แม้จะไม่ใช่ชิ้นที่ตั้งใจไว้แต่แรก","ถ้าหลายร้านขายของชิ้นเดียวกัน ฉันมักเลือกร้านที่มีของวางให้เห็นและหยิบกลับได้เลย แม้ร้านที่ต้องรอสั่งจะมีแบบให้เลือกมากกว่า"],"Ti":["ฉันชอบถามว่าคำที่คนในตลาดใช้กัน เช่น “หุ้นถูก” หมายถึงถูกเมื่อเทียบกับอะไรกันแน่","ถ้ามีคนบอกว่ากลยุทธ์หนึ่งได้ผล ฉันอยากรู้ก่อนว่ามันได้ผลเพราะอะไร จนบางทีพลาดจังหวะไป","ถ้าคำอธิบายสินค้าบอกว่าทั้งเบาและทนกว่าทุกรุ่น ฉันมักหยุดคิดว่าสองอย่างนี้ไปด้วยกันได้ยังไง จนบางทีปิดหน้านั้นไปก่อนได้ดูของจริง ๆ","ถ้ากดจ่ายเงินแล้วแอปค้าง ฉันมักไล่คิดก่อนว่ามันน่าจะติดที่ขั้นไหน แล้วค่อยกดซ้ำ แม้ระหว่างนั้นโค้ดส่วนลดจะหมดเวลาไป","เลือกระหว่างของที่ดูคล้ายกันมาก ฉันมักต้องหาให้เจอก่อนว่าต่างกันตรงไหนจริง ๆ จนบางทีใช้เวลากับของชิ้นเล็ก ๆ เป็นชั่วโมง"],"Te":["ฉันตั้งเป้าการลงทุนเป็นตัวเลขและระยะเวลาชัด ๆ แล้วเช็กความคืบหน้าเป็นช่วง ๆ แม้คนรอบตัวจะว่าเคร่งไป","เวลาต้องเลือก ฉันเทียบทางเลือกเป็นตาราง ทั้งข้อดีข้อเสียและค่าธรรมเนียม แล้วเลือกตัวที่คุ้มที่สุด","ก่อนสั่งของออนไลน์ ฉันมักกรองด้วยเงื่อนไขชัด ๆ เช่น วันส่ง คะแนนร้าน และการคืนของ แม้จะตัดร้านที่น่าสนใจออกไปด้วย","ถ้าของที่สั่งไว้เลื่อนวันส่งกะทันหัน ฉันมักเทียบทางเลือกที่มีจากวันที่จะได้ของ แล้วสลับไปทางที่ได้ก่อน แม้ต้องยกเลิกออเดอร์เดิม","ถ้าหลายร้านขายของชิ้นเดียวกัน ฉันมักตั้งเกณฑ์สองสามข้อแล้วตัดสินตามนั้นเลย แม้ร้านที่ตกรอบจะเป็นร้านที่ฉันชอบมากกว่า"],"Fi":["บางการตัดสินใจเรื่องเงิน ฉันต้องรอให้ใจนิ่งก่อนว่ามันรู้สึก “ใช่” จริงไหม แม้ตัวเลขจะดูโอเคแล้ว","ถ้าคนรอบตัวชวนลงทุนในสิ่งที่ฉันไม่ศรัทธา ฉันปฏิเสธตรง ๆ แม้บรรยากาศจะแปลก ๆ ไปบ้าง","ของที่ใคร ๆ ก็บอกว่าต้องมี ถ้าฉันรู้สึกว่ามันไม่ใช่ชีวิตแบบของฉัน ฉันมักผ่านไปเงียบ ๆ แม้บางครั้งจะไม่สะดวกตอนที่ต้องใช้จริง","ถ้าของที่มาถึงสีต่างจากที่เห็นในจอไปนิดหนึ่ง ฉันมักต้องถามใจก่อนว่ายังเป็นแบบที่อยากใช้ไหม แม้คนอื่นจะมองว่าแทบไม่ต่างกัน","เลือกสีของของใช้ ฉันมักเลือกสีที่อยากอยู่ด้วยในช่วงนั้น จนบางทีของในห้องสีตีกันไปหมด"],"Fe":["เวลามีคนมาปรึกษาเรื่องเงิน ฉันฟังว่าเขากังวลอะไรก่อน แล้วคุยในแบบที่เขาสบายใจ แม้จะไม่ได้พูดที่คิดจริงทั้งหมด","เวลาต้องตัดสินใจเรื่องเงินร่วมกับคนอื่น ฉันมักเลือกทางที่ทุกฝ่ายสบายใจ แม้จะไม่ใช่ทางที่ฉันคิดว่าคุ้มที่สุด","เวลาเลือกของที่จะใช้ร่วมกับคนอื่น ฉันมักเลือกแบบที่คิดว่าทุกคนใช้แล้วโอเค จนบางทีเลือกนานกว่าซื้อของให้ตัวเองหลายเท่า","ถ้าของที่สั่งรวมกับเพื่อนส่งช้า ฉันมักรีบบอกในกลุ่มก่อนเพราะห่วงว่าใครจะรอเก้อ จนต้องส่งข้อความแก้วันส่งตามไปอีกหลายรอบ","ถ้าเพื่อนที่ไปด้วยดูไม่ค่อยปลื้มกับของที่ฉันหยิบ ฉันมักวางลงแล้วเลือกชิ้นอื่น แม้ในใจยังชอบชิ้นแรกอยู่"]},"u":{"Ni":["เพลงบางเพลงฉันฟังผ่าน ๆ มานาน จนวันหนึ่งความหมายของมันก็ชัดขึ้นมาเองแบบไม่ได้ตั้งใจ","เวลาฟังผลงานของศิลปินคนหนึ่งตั้งแต่ชุดแรก ฉันชอบมองว่าเขากำลังเดินไปสู่ปลายทางแบบไหน","เลือกว่าจะฟังอัลบั้มไหนต่อ ฉันมักเลือกอัลบั้มที่ฟังแล้วเหมือนมีเรื่องเดียวร้อยทั้งชุดไว้ แม้อัลบั้มใหม่ที่รอฟังจะค้างอยู่"],"Ne":["ฟังเพลงหนึ่งแล้ว ฉันชอบไล่ต่อไปหาเพลงต้นฉบับ เพลงที่ถูกแซมเปิล และศิลปินที่ได้แรงบันดาลใจไปเรื่อย ๆ","ระหว่างฟังเพลง ฉันมักมีไอเดียแตกไปเรื่องอื่น เช่น เรื่องที่อยากเขียนหรือของที่อยากลองทำ จนลืมฟังเนื้อร้อง","ถ้าแอปเล่นเพลงสุ่มไปคนละแนวกับที่ตั้งใจ ฉันมักปล่อยให้มันพาไปต่อ แล้วนึกโยงไปหาศิลปินอื่นอีกหลายคน จนลืมเพลย์ลิสต์เดิมไปเลย"],"Si":["ได้ยินเพลงเก่าบางเพลง ฉันจำได้ละเอียดว่าตอนนั้นอยู่ที่ไหน อากาศเป็นยังไง หรือใครอยู่ด้วย","ถ้าเพลงที่ฟังมานานถูกรีมาสเตอร์หรือร้องใหม่ ฉันจะสะดุดตรงจุดที่ต่างไปจากเวอร์ชันที่จำได้","ตั้งค่าเสียงหูฟังตัวใหม่ ฉันมักปรับให้ใกล้ค่าเดิมที่หูคุ้น แม้หูฟังจะมีโหมดเสียงให้ลองหลายแบบ"],"Se":["เวลาเล่นดนตรีหรือร้องเพลง ฉันชอบด้นไปตามจังหวะและเสียงที่ได้ยินตรงนั้น มากกว่าเล่นตามที่ซ้อมมาเป๊ะ ๆ","ฉันชอบลองเครื่องดนตรีหรือลำโพงของจริงด้วยมือและหูตัวเอง มากกว่าดูสเปกหรืออ่านรีวิว","ถ้าหูฟังแบตหมดกลางทาง ฉันมักหันมาฟังเสียงรอบตัวแทน เช่น เสียงรถ เสียงคน หรือเพลงจากร้านข้างทาง จนบางทีเดินเลยจุดที่ต้องเลี้ยว"],"Ti":["ฟังเพลงแนวที่ชอบ ฉันมักแยกในหัวว่าอะไรทำให้เป็นแนวนั้น แล้วสะดุดถ้าเพลงไหนไม่เข้าเกณฑ์","เวลาอ่านรีวิวเพลง ฉันชอบเช็กว่าเหตุผลที่คนรีวิวให้ ใช้ได้กับเพลงอื่นแบบเดียวกันด้วยไหม","เลือกว่าจะฟังเวอร์ชันไหนของเพลงเดียวกัน ฉันมักฟังเทียบเองว่าการเรียบเรียงแต่ละแบบต่างกันเพราะอะไร จนเพลงวนไปหลายรอบกว่าจะเลือกได้"],"Te":["ถ้าจะฝึกเครื่องดนตรี ฉันตั้งเป้าเป็นขั้น ๆ เช่น สัปดาห์นี้ต้องจบกี่เพลง แล้ววัดผลตามนั้น แม้จะสนุกน้อยลงบ้าง","เวลาต้องจัดเพลงให้งานหรือกิจกรรม ฉันมักรับเป็นคนวางลำดับ แบ่งช่วงเวลา และแจกว่าใครดูแลส่วนไหน แม้บางคนอยากเปิดตามอารมณ์","ถ้าเพลย์ลิสต์ที่ใช้ตอนทำงานหายไปจากแอป ฉันมักรีบรวมเพลงชุดใหม่ที่ช่วยให้งานเดินแล้วทำงานต่อ แม้จะเลือกเพลงไม่ประณีตเท่าเดิม"],"Fi":["เพลงที่ฉันชอบมาก ๆ บางเพลง ฉันไม่ค่อยอยากเปิดให้ใครฟัง เพราะรู้สึกว่ามันเป็นเรื่องส่วนตัวเกินไป","ถ้าศิลปินที่ฉันชอบทำสิ่งที่ขัดกับคุณค่าของฉัน ฉันฟังเพลงเขาต่อไม่ลง แม้เพลงจะยังเพราะเหมือนเดิม","เลือกเพลงตั้งเป็นเสียงปลุก ฉันมักเลือกเพลงที่ฟังแล้วรู้สึกว่าเป็นเช้าแบบของฉัน แม้จะเป็นเพลงช้าที่ปลุกไม่ค่อยตื่น"],"Fe":["เวลาไปคอนเสิร์ตกับเพื่อน ฉันคอยดูว่าทุกคนสนุกด้วยไหม จนบางทีตัวเองก็ไม่ได้อินกับโชว์เต็มที่","ถ้ามีคนเปิดเพลงที่ฉันไม่ได้ชอบ ฉันก็ร้องตามหรือชมไปด้วย เพื่อไม่ให้เขารู้สึกเก้อ","ถ้าเพลงที่เปิดให้เพื่อนฟังเงียบไปกลางคัน ฉันมักถือโอกาสเปลี่ยนเป็นเพลงที่คิดว่าวงน่าจะชอบกว่า แม้บางคนอาจกำลังอินกับเพลงเดิมอยู่"]},"f":{"Ni":["ฉันมักเลือกงานอดิเรกจากความรู้สึกลึก ๆ ว่ามันกำลังพาไปสู่อะไรบางอย่าง แม้ตอนเริ่มยังบอกไม่ได้ว่าอะไร","ฝึกงานอดิเรกไปสักพัก ฉันมักเห็นแก่นเดียวที่ร้อยทุกเทคนิคเข้าด้วยกัน แล้วหันมาฝึกจากแก่นนั้นแทน","ฉันมีภาพปลายทางชัดว่าอยากไปถึงจุดไหนในงานอดิเรกนี้ จนบางทีลืมสนุกกับระหว่างทาง","ของสะสมของฉันร้อยกันเป็นเรื่องเดียวในใจ ชิ้นที่ไม่เข้ากับเรื่องนั้น ต่อให้หายาก ฉันก็ไม่ค่อยเก็บ","บางครั้งฉันเลิกงานอดิเรกเพราะรู้สึกล่วงหน้าว่ามันพาฉันไปต่อไม่ได้แล้ว ทั้งที่ยังสนุกกับมันอยู่","ติดขัดในงานอดิเรกเมื่อไร ฉันมักวางมันไว้สักพัก แล้ววิธีแก้ก็โผล่ขึ้นมาเองตอนที่ไม่ได้คิดถึงมัน"],"Ne":["ฝึกงานอดิเรกอย่างหนึ่งอยู่ ฉันมักนึกถึงทางเอาไปผสมกับอีกอย่าง เช่น เอาการถ่ายรูปไปรวมกับการทำขนม","เวลาเริ่มงานอดิเรกใหม่ ฉันมักนึกต่อว่ามันจะผสมกับงานอดิเรกอื่นที่ทำอยู่ได้แบบไหนบ้าง แม้บางไอเดียจะยังไม่ได้ลองจริง","เรียนงานอดิเรกจากคลิป ฉันมักแตกสูตรหรือวิธีออกไปหลายทาง แทนที่จะทำตามทีละขั้นจนจบ","ได้อุปกรณ์มาชิ้นหนึ่ง ฉันชอบนึกว่ามันเอาไปใช้แบบอื่นที่ไม่ได้ออกแบบมาได้อีกกี่แบบ","คุยกับคนในกลุ่มงานอดิเรก ฉันชอบโยนคำถามว่า “ถ้าลองแบบนี้ล่ะ” จนบทสนทนาแตกไปหลายทาง","ของสะสมของฉันมักแตกแขนงไปเรื่อย ๆ เพราะชิ้นหนึ่งมักพาให้ฉันไปสนใจอีกสายหนึ่งต่อ"],"Si":["ฉันมักฝึกงานอดิเรกในช่วงเวลาเดิมและมุมเดิม แล้วรู้สึกถึงความคุ้นมือที่ค่อย ๆ สะสม แม้บางวันจะดูซ้ำ ๆ","ฉันมักเก็บความรู้สึกในมือตอนที่ทำได้ครั้งแรกไว้ แล้วใช้มันเป็นหลักเทียบเวลาฝึกรอบต่อ ๆ ไป","อุปกรณ์ที่ใช้จนเข้ามือแล้ว ฉันมักใช้ต่อไปเรื่อย ๆ แม้รุ่นใหม่จะช่วยให้ทำได้ง่ายขึ้น","เริ่มงานอดิเรกใหม่ ฉันชอบฝึกพื้นฐานแบบที่คนทำกันมานานให้แน่นก่อน แม้จะนานกว่าจะได้ลองอะไรสนุก ๆ","ฉันจดบันทึกงานอดิเรกไว้ละเอียด แล้วชอบเปิดย้อนดูว่าครั้งก่อน ๆ ทำอะไรไป และรู้สึกแบบไหน","ฉันมักกลับไปทำงานอดิเรกเก่าที่เคยทำตอนเด็ก เพราะมือยังจำได้ และทำแล้วรู้สึกเหมือนได้กลับบ้าน"],"Se":["ฉันเลือกงานอดิเรกจากการได้ไปลองจับลองทำจริงก่อน เช่น ไปคลาสทดลอง มากกว่าการนั่งหาข้อมูล","ระหว่างทำงานอดิเรก ฉันปรับมือตามสิ่งที่เห็นตรงหน้าทันที เช่น แป้งเหนียวไปก็เติมน้ำ ปลากินเหยื่อก็ผ่อนสาย","ระหว่างทำงานอดิเรก ฉันมักจดจ่อกับเสียง กลิ่น และสัมผัสตรงหน้า จนลืมดูเวลาไปเลย","จะซื้ออุปกรณ์ ฉันต้องไปจับของจริงที่ร้านก่อน ลองน้ำหนัก ผิวสัมผัส และเสียงตอนใช้งาน","ไปงานมีตติ้งของกลุ่มงานอดิเรก ฉันชอบเดินดูผลงานจริงของแต่ละคนใกล้ ๆ ทั้งสี ผิว และรอยมือในแต่ละชิ้น","เวลาแชร์งานอดิเรกให้เพื่อน ฉันชอบยื่นของให้เขาลองจับลองทำตรงนั้นเลย มากกว่าการเล่าให้ฟัง"],"Ti":["ฉันอยากเข้าใจว่าทำไมเทคนิคหนึ่งถึงได้ผล ถ้ายังอธิบายเองไม่ได้ ฉันจะฝึกต่อแบบไม่ค่อยสนิทใจ","ฉันมักสร้างวิธีฝึกของตัวเองจากหลักที่เข้าใจ แทนที่จะทำตามคอร์สที่มีคนวางไว้ แม้จะช้ากว่าก็ตาม","ถ้าคำแนะนำในกลุ่มงานอดิเรกขัดกันเอง ฉันจะอยากไล่จนรู้ว่าแบบไหนสมเหตุสมผลกว่า แม้คนอื่นจะปล่อยผ่านไปแล้ว","ก่อนซื้ออุปกรณ์ ฉันแกะสเปกจนเข้าใจว่าแต่ละส่วนมีผลกับการใช้งานยังไง แม้จะใช้เวลานานกว่าคนอื่น","ฉันชอบตั้งนิยามให้ชัดว่า “ทำเป็น” ในงานอดิเรกนี้หมายถึงอะไรกันแน่ แล้วใช้นิยามนั้นเช็กตัวเอง","ถ้าเริ่มเบื่องานอดิเรก ฉันอยากแยกให้ชัดก่อนว่าเบื่อที่ตัวงาน หรือเบื่อวิธีที่ฉันทำมันอยู่"],"Te":["ฉันตั้งเป้าที่วัดได้ให้งานอดิเรก เช่น ลดเวลาวิ่งห้ากิโลลงกี่นาที แล้วคอยดูตัวเลขว่าขยับไปถึงไหน","ก่อนเริ่มงานอดิเรกใหม่ ฉันดูว่าคนที่ทำแล้วได้ผลใช้วิธีไหน แล้ววางขั้นตอนตามนั้น จะได้ไม่เสียเวลาลองผิดลองถูก","ถ้าฝึกแล้วไม่เห็นความคืบหน้า ฉันจะเปลี่ยนวิธีหรือพักมันไว้เลย แม้บางคนจะมองว่าฉันเลิกเร็วไป","ฉันมักตั้งเป้าการฝึกเป็นขั้น ๆ แล้วซื้ออุปกรณ์ตามขั้นนั้นเท่านั้น จนบางทีต้องไปซื้อเพิ่มอีกหลายรอบ","ในกลุ่มงานอดิเรก ฉันมักตั้งเป้าให้แต่ละนัดว่าต้องได้อะไร แม้บางคนอยากมาเจอกันแบบชิล ๆ","ฉันชอบพางานอดิเรกไปสู่ผลที่จับต้องได้ เช่น ลงแข่ง สอบวัดระดับ หรือรับงานเล็ก ๆ"],"Fi":["ฉันเลือกงานอดิเรกที่รู้สึกว่าใช่ตัวเองจริง ๆ แม้จะไม่ใช่สิ่งที่คนรอบตัวทำกัน","ถ้างานอดิเรกเริ่มกลายเป็นการแข่งกันหรือทำเอาไว้โชว์ ฉันจะรู้สึกว่ามันไม่ใช่ของฉันแล้ว และมักถอยออกมา","ฉันมักดูความก้าวหน้าในงานอดิเรกจากความอิ่มใจของตัวเอง จนบางทีไม่รู้เลยว่าฝีมือจริง ๆ ขยับไปถึงไหน","ของสะสมของฉันเป็นชิ้นที่ฉันรู้สึกผูกพันจริง ๆ ไม่ได้เก็บตามที่คนในวงการบอกว่าต้องมี","ฉันไม่ค่อยอยากทำตามสูตรที่คนอื่นกำหนด ถ้ามันทำให้งานออกมาไม่ตรงกับสิ่งที่ฉันรู้สึก","งานอดิเรกบางอย่างมีความหมายกับฉันมาก จนถ้ามีคนพูดถึงมันแบบเล่น ๆ ฉันมักรู้สึกเหมือนโดนแตะเรื่องส่วนตัว"],"Fe":["ฉันมักเริ่มงานอดิเรกใหม่เพราะเพื่อนหรือคนในบ้านชวน และสนุกกับการได้ทำไปพร้อมกัน","ในกลุ่มงานอดิเรก ฉันมักทำตามธรรมเนียมของกลุ่ม เช่น วิธีทักทายหรือมารยาทในวง แม้บางข้อจะดูไม่จำเป็นสำหรับฉัน","เพื่อนชวนลองงานอดิเรกที่เขากำลังอิน ฉันมักตอบตกลงไปตามบรรยากาศ ทั้งที่ใจยังไม่ได้อยากลองนัก","ถ้าคนในกลุ่มเห็นไม่ตรงกันเรื่องวิธีเล่น ฉันมักเอนตามแบบที่คนส่วนใหญ่ในกลุ่มสบายใจ แม้จะชอบอีกแบบมากกว่า","ทำงานอดิเรกกับคนอื่น ฉันมักปรับจังหวะตามคนที่มาด้วย จนบางทีกลับบ้านมาแล้วรู้สึกว่ายังไม่ได้ทำเต็มที่","บางครั้งฉันยังทำงานอดิเรกต่อเพราะไม่อยากทิ้งเพื่อนในกลุ่ม แม้ตัวเองจะเริ่มหมดไฟแล้ว"]},"q":{"Ni":["เวลาเลือกเสื้อผ้า ฉันมักนึกก่อนว่าลุคนี้จะสื่อความหมายอะไร แล้วค่อยหาชิ้นที่พาไปถึงภาพนั้น แม้บางทีจะหาไม่เจอสักที","จะจัดห้อง ฉันนึกถึงฟีลรวมเดียวที่อยากให้ห้องสื่อออกมาก่อน แล้วค่อยเลือกของให้เข้ากับฟีลนั้น","เห็นเทรนด์ใหม่ ฉันมักรู้สึกลึก ๆ ว่ามันกำลังสะท้อนอะไรบางอย่างของยุคนี้ จนบางทีคิดไปไกลเกินกว่าแค่เสื้อผ้า","ฉันชอบของที่มีความหมายซ่อนอยู่ เช่น ลวดลายหรือสีที่สื่อถึงบางอย่างลึกกว่าความสวยที่เห็น","รสนิยมของฉันค่อย ๆ ตกผลึก วันหนึ่งก็รู้ชัดว่าไม่ใช่สไตล์เดิมแล้ว ทั้งที่บอกไม่ได้ว่าเปลี่ยนตอนไหน","เลือกของให้ตัวเอง ฉันมักนึกภาพว่าตัวเองกำลังเปลี่ยนไปทางไหน แล้วเลือกของที่เข้ากับตัวฉันในอีกไม่กี่ปีข้างหน้า","เลือกโปสเตอร์หรือภาพติดผนัง ฉันมักเลือกภาพที่ดูแล้วเหมือนมีเรื่องซ่อนอยู่ให้ค่อย ๆ ตีความ แม้ตอนนี้จะดูไม่ค่อยเข้ากับห้อง"],"Ne":["ฉันชอบจับของที่ดูไม่น่าเข้ากันมาแต่งรวมกัน เช่น เสื้อวินเทจกับรองเท้ากีฬา เพื่อดูว่าออกมาเป็นลุคไหนได้บ้าง","ห้องของฉันเปลี่ยนการจัดวางอยู่เรื่อย ๆ เพราะฉันมักนึกออกว่ามุมนี้น่าจะลองเป็นแบบอื่นได้อีก","เห็นของชิ้นเดียว ฉันมักนึกออกว่าเอาไปใช้ได้อีกหลายแบบ เช่น ผ้าพันคอที่เป็นได้ทั้งผ้าคลุมโต๊ะและที่คาดผม","เห็นเทรนด์ใหม่ ๆ ฉันสนุกกับการนึกว่าจะหยิบบางส่วนมาผสมกับสไตล์ตัวเองได้กี่แบบ","รสนิยมของฉันกว้างจนเพื่อนเดายาก วันหนึ่งชอบมินิมอล อีกวันก็ไปชอบลายจัดเต็ม","เลือกของขวัญ ฉันชอบหาของที่คนรับคาดไม่ถึง แต่พอเห็นแล้วนึกออกว่าจะเอาไปเล่นต่อได้หลายทาง","ถ้าชุดที่ตั้งใจใส่เปื้อนก่อนออกจากบ้าน ฉันมักนึกได้หลายแบบที่จะจับชิ้นอื่นมาแทน จนเกือบออกจากบ้านช้า"],"Si":["ฉันมีเสื้อผ้าทรงประจำที่ใส่แล้วรู้ว่าเข้ากับตัวและสบาย พอตัวเก่าหมดสภาพ ฉันก็มักซื้อทรงเดิมมาแทน","ฉันชอบให้ห้องมีกลิ่นอายของบ้านที่โตมา เช่น ผ้าปูลายแบบที่เคยใช้ หรือโคมไฟทรงเก่า เพราะอยู่แล้วอุ่นใจ","ฉันมักเลือกของใช้จากความรู้สึกตอนใช้ที่จำได้ เช่น ผ้าแบบนี้ใส่แล้วคันไหม แก้วทรงนี้จับแล้วเข้ามือหรือเปล่า","ฉันมักรอดูเทรนด์ไปสักพัก แล้วค่อยรับเฉพาะส่วนที่เข้ากับสิ่งที่ฉันใช้แล้วเวิร์กมาตลอด","สำหรับฉัน รสนิยมดีคือของที่ผ่านการพิสูจน์ด้วยเวลา ใช้กี่ปีก็ยังดูดีและใช้ได้เหมือนวันแรก","จัดห้องใหม่ ฉันมักวางของตามตำแหน่งเดิมที่คุ้นมือ จนห้องดูแทบเหมือนเดิมแม้จะซื้อของใหม่มา","ถ้าฝนตกจนชุดที่ตั้งใจใส่ยังไม่แห้ง ฉันมักหยิบชุดที่เคยใส่ไปที่แบบนี้แล้วสบายตัวมาแทน แม้ในตู้จะมีชุดใหม่ที่ยังไม่ได้ลองใส่"],"Se":["ฉันเลือกเสื้อผ้าจากการได้จับเนื้อผ้าและลองใส่จริง ดูว่ามันทิ้งตัวและขยับไปกับตัวยังไง","เปิดตู้ตอนเช้า ฉันแต่งตัวตามที่เจอในวันนั้น เช่น อากาศ แสงแดด หรือที่ที่จะไป มากกว่าวางชุดไว้ล่วงหน้า","เข้าห้องหรือร้านไหน ฉันมักสังเกตรายละเอียดรอบตัวก่อน เช่น แสงไฟอุ่นหรือเย็น ผิวโต๊ะ หรือเสียงในห้อง","จัดห้อง ฉันชอบลองวางของจริงแล้วถอยออกมาดู ขยับไปมาจนตาบอกว่าใช่ มากกว่าวางแผนบนกระดาษ","สำหรับฉัน ของที่มีรสนิยมคือของที่หยิบแล้วสัมผัสได้ถึงความตั้งใจ เช่น น้ำหนักพอดีมือ ผิวเนียน สีที่ดูมีชีวิต","เห็นเทรนด์ที่สะดุดตา ฉันอยากลองใส่หรือลองใช้จริงสักครั้ง ก่อนตัดสินว่ามันดีหรือไม่ดี","เลือกน้ำหอมหรือโลชั่น ฉันมักลองทาที่ข้อมือตรงนั้นแล้วเลือกจากกลิ่นที่ได้ตอนนั้นเลย แม้จะยังไม่ได้รอดูว่ากลิ่นจะเปลี่ยนไปยังไง"],"Ti":["เวลาแต่งตัว ฉันมีหลักของตัวเองเรื่องสัดส่วนและโทนสี ที่คิดมาแล้วว่าทำไมแบบนั้นถึงลงตัว","เวลาชอบของชิ้นไหน ฉันมักถามตัวเองว่าเหตุผลที่ชอบใช้กับของอื่นแบบเดียวกันได้ไหม จนบางทีตัดสินใจซื้อช้า","จัดห้อง ฉันอยากให้ทุกอย่างอยู่ในหลักเดียวกัน ถ้ามีชิ้นไหนขัดกับหลักที่วางไว้ ฉันจะรู้สึกค้างจนต้องแก้","ฉันชอบถามตัวเองว่าที่ชอบของชิ้นนี้ เพราะดีไซน์มันลงตัวจริง หรือเพราะเห็นบ่อยจนชินตา","เลือกของใช้ ฉันมักดูว่าแต่ละส่วนของรูปทรงมีที่มาที่ไปไหม ถ้ามีส่วนที่ใส่มาเฉย ๆ ฉันจะไม่ค่อยชอบ","ฉันมักนิยามให้ตัวเองชัดว่า “มินิมอล” หรือ “วินเทจ” หมายถึงอะไรแน่ แล้วใช้นิยามนั้นตอนเลือกของ แม้บางทีจะเลือกนานกว่าที่ตั้งใจ","ของที่สั่งออนไลน์สีไม่ตรงกับในจอ ฉันมักไล่ดูว่าต่างเพราะแสงในรูป จอ หรือเนื้อวัสดุ จนบางทีลืมตัดสินว่ายังชอบมันไหม"],"Te":["ฉันจัดตู้เสื้อผ้าเป็นระบบ มีชิ้นหลักไม่กี่ชิ้นที่จับคู่กันได้หมด เพื่อตัดเวลาเลือกตอนเช้า แม้จะแต่งออกมาคล้าย ๆ เดิม","ก่อนซื้อของแต่งบ้าน ฉันมักวัดพื้นที่ เช็กรีวิว และเทียบตัวเลือกเป็นตาราง จนบางทีคนที่ไปด้วยเบื่อรอ","สำหรับฉัน ของที่รสนิยมดีต้องใช้งานได้ด้วย ถ้าสวยแต่ใช้ไม่สะดวก ฉันก็ตัดออก แม้จะชอบหน้าตามัน","ฉันแต่งตัวตามเป้าหมายของวันนั้น เช่น ไปคุยงานหรือไปสัมภาษณ์ แล้วเลือกลุคที่ช่วยให้เรื่องนั้นเดินไปได้","ฉันเคลียร์ของที่ไม่ได้ใช้ออกจากห้องเป็นรอบ ๆ ตามเกณฑ์ เช่น ไม่ได้ใช้เกินหกเดือนก็ปล่อย แม้บางชิ้นจะมีความหลัง","เลือกของขวัญ ฉันมักถามคนรับตรง ๆ ว่าต้องการอะไร แล้วซื้อตามนั้น แม้จะไม่มีเซอร์ไพรส์","เลือกเสื้อผ้าออนไลน์ ฉันมักดูว่าตัวไหนใส่ได้หลายโอกาสที่สุดแล้วเลือกตัวนั้น แม้ตัวที่สะดุดตากว่าจะใส่ได้แค่งานเดียว"],"Fi":["ฉันแต่งตัวตามสิ่งที่รู้สึกว่าเป็นตัวเอง แม้บางวันจะไม่ตรงกับที่คนรอบตัวคาดไว้","ห้องของฉันเต็มไปด้วยของที่มีความหมายกับฉัน แม้มันจะไม่ได้เข้าชุดกันหรือดูเป็นธีมเดียว","ถ้าแบรนด์ที่ชอบทำอะไรขัดกับสิ่งที่ฉันเชื่อ ฉันก็ไม่อยากใช้ต่อ แม้ของจะยังสวยถูกใจอยู่","ฉันตัดสินว่าของชิ้นไหนสวยจากใจตัวเองเป็นหลัก แม้บางทีจะอธิบายให้คนอื่นเข้าใจไม่ได้","เทรนด์ที่ฉันรู้สึกว่าไม่ใช่ตัวเอง ต่อให้คนรอบตัวใส่กันหมด ฉันก็ไม่ค่อยอยากตาม แม้จะถูกถามบ่อยว่าทำไมไม่ลองบ้าง","เวลาซื้อของ ฉันมักถามตัวเองว่าชิ้นนี้ “เป็นฉัน” ไหม มากกว่าดูว่าคุ้มหรือใช้บ่อยแค่ไหน จนบางทีได้ของที่ไม่ค่อยได้ใช้","ถ้ารองเท้าคู่โปรดเริ่มพัง ฉันมักใส่ต่อไปอีกนาน เพราะยังรู้สึกว่าคู่นี้เป็นฉันมากกว่าคู่ใหม่ แม้คนรอบตัวจะทักว่าเปลี่ยนได้แล้ว"],"Fe":["ไปงานไหน ฉันมักแต่งตัวให้กลืนไปกับธีมของงาน จนบางทีในรูปแทบไม่เห็นสไตล์ของตัวเองเลย","จัดบ้าน ฉันมักเลือกสไตล์ที่คนมาเยี่ยมเห็นแล้วคุ้นและสบายใจ แม้ใจจริงจะอยากลองอะไรที่แปลกกว่านี้","เลือกของใช้ส่วนตัว ฉันมักนึกว่าคนรอบตัวจะมองว่ามันเหมาะกับฉันไหม จนบางทีไม่ได้เลือกชิ้นที่ชอบที่สุด","เพื่อนถามว่าชุดนี้โอเคไหม ฉันมักดูสีหน้าเขาก่อนว่ามั่นใจแค่ไหน แล้วเลือกคำตามนั้น จนบางทีตอบอ้อม ๆ ไปหน่อย","ช็อปปิ้งกับเพื่อน ถ้าเขาดูไม่ปลื้มชิ้นที่ฉันหยิบ ฉันมักวางคืน แล้วกลับมาก็ยังคิดถึงชิ้นนั้น","เทรนด์ที่คนรอบตัวกำลังชอบ ฉันมักลองตามบ้างเพื่อให้มีเรื่องคุยด้วยกัน แม้มันจะไม่ใช่แนวของฉันนัก","เลือกสีเสื้อตอนนัดถ่ายรูปกลุ่ม ฉันมักถามในแชตก่อนว่าคนอื่นใส่สีอะไร แล้วเลือกให้เข้ากัน จนแชตวนคุยเรื่องสีเสื้อนานกว่าเรื่องนัด"]},"x":{"Ni":["เวลาเพื่อนเล่าปัญหาซ้ำ ๆ ฉันมักเห็นแพตเทิร์นเดียวที่วนกลับมา จนบางทีพูดออกไปตอนที่เขายังไม่พร้อมฟัง","ฉันมักรู้สึกได้ก่อนว่ากลุ่มเพื่อนกลุ่มหนึ่งกำลังจะค่อย ๆ แยกย้าย ทั้งที่ทุกคนยังนัดเจอกันตามปกติ","พอมองย้อนมิตรภาพแต่ละช่วง ฉันมักเห็นเส้นเรื่องเดียวที่ร้อยเพื่อนแต่ละกลุ่มเข้ากับช่วงชีวิตตอนนั้น","บางทีผ่านไปหลายวันหลังคุยกับเพื่อน ฉันถึงเพิ่งเข้าใจขึ้นมาเองว่าที่เขาพูดวันนั้นจริง ๆ หมายถึงอะไร","เวลาให้คำแนะนำเพื่อน ฉันมักพูดถึงจุดสำคัญจุดเดียวที่ฉันเห็น มากกว่าไล่ทางเลือกให้หลาย ๆ ทาง","ฉันมักมีภาพในใจว่าเพื่อนคนไหนจะยังอยู่ในชีวิตฉันไปอีกนาน แม้ตอนนี้จะยังไม่ได้สนิทกันมากนัก","รถไฟที่จะไปทริปกับเพื่อนดีเลย์ยาว ฉันมักนึกภาพว่าทั้งทริปจะต้องขยับไปเป็นแบบไหน ทั้งที่ยังไม่มีใครพูดถึง"],"Ne":["ฉันชอบนึกเล่น ๆ ว่าเพื่อนจากต่างกลุ่มถ้าได้รู้จักกันจะคลิกกันแบบไหน แม้ส่วนใหญ่จะไม่ได้แนะนำให้เจอกันจริง","พอเพื่อนชวนนัด ฉันมักโยนไอเดียที่เที่ยวหรือกิจกรรมมาหลายแบบ จนบางทีกลุ่มตัดสินใจไม่ได้สักที","ในแชทกลุ่ม ฉันมักต่อจากเรื่องหนึ่งไปอีกเรื่อง จนบทสนทนาไหลไปไกลจากเรื่องที่เริ่มคุยกัน","เวลาเพิ่งรู้จักเพื่อนใหม่ ฉันมักนึกต่อจากเรื่องเล็ก ๆ ที่เขาเล่าว่าเขาน่าจะชอบอะไรอีกหลายอย่าง จนบางทีเดาเขาไปไกลเกินตัวจริง","สิ่งที่ทำให้ฉันอยากสนิทกับใคร มักเป็นตอนที่คุยกันแล้วไอเดียแตกยอดต่อกันไปได้เรื่อย ๆ","มุกภายในกลุ่มเพื่อนของฉันมักเกิดจากการเอาเรื่องที่ไม่เกี่ยวกันเลยมาโยงกันแบบเพี้ยน ๆ","เลือกของขวัญวันเกิดให้เพื่อน ฉันมักนึกได้หลายไอเดียต่อกันไปเรื่อย ๆ จนกว่าจะเลือกลงก็ใกล้วันเข้ามาแล้ว"],"Si":["ฉันจำบรรยากาศทริปหรือวันสำคัญกับเพื่อนได้เป็นฉาก ๆ เช่น ใครนั่งตรงไหน วันนั้นกินอะไรกัน","นัดเจอเพื่อน ฉันมักเสนอร้านหรือที่เดิมที่เคยไปด้วยกัน เพราะรู้แล้วว่าทุกคนนั่งสบาย","ฉันมักจำได้ว่าเพื่อนแต่ละคนปกติตอบแชทแบบไหน พอเขาเปลี่ยนไปนิดเดียว ฉันก็สะดุดใจจนต้องย้อนอ่านแชทเก่า","เวลาเพื่อนเจอปัญหา ฉันมักนึกถึงตอนที่ตัวเองเคยเจอเรื่องคล้ายกัน แล้วเล่าว่าตอนนั้นทำยังไง แม้บางทีเพื่อนแค่อยากให้ฟัง","มุกเก่าของกลุ่มที่เล่าซ้ำมาหลายปี ฉันก็ยังขำได้อีก เพราะมันพาความรู้สึกตอนนั้นกลับมา","ฉันชอบเลื่อนดูแชทหรือรูปเก่ากับเพื่อน แล้วนึกออกเลยว่าตอนนั้นเรารู้สึกกันยังไง","เลือกที่นั่งในร้านตอนไปกับเพื่อน ฉันมักเลือกมุมแบบที่เคยนั่งแล้วสบายตัว เช่น ไม่โดนแอร์เป่า แม้จะไม่ใช่มุมที่วิวดีที่สุด"],"Se":["นัดกับเพื่อนแล้วแผนพัง เช่น ร้านปิด ฉันมักหาอะไรทำแถวนั้นต่อทันที แม้บางคนยังอยากหาร้านแบบเดิม","ถ้าเพื่อนเจอเรื่องด่วน ฉันมักขยับลงมือตรงหน้าไปก่อน เช่น ขับรถไปหา จนบางทีไปผิดจุดเพราะยังไม่ได้ถามรายละเอียด","ในวงเพื่อน ตาฉันมักจับอยู่กับสิ่งที่เกิดตรงหน้า เช่น อาหารที่เพิ่งมาเสิร์ฟหรือใครเดินเข้าร้าน จนบางทีหลุดจากเรื่องที่คุยกันอยู่","มุกของกลุ่มเรามักเกิดจากเหตุการณ์ตรงหน้า เช่น ใครทำอะไรพลาดตอนนั้น แล้วฉันหยิบมาเล่นต่อทันที","ถ้ามีเรื่องไม่เข้าใจกันกับเพื่อน ฉันมักดูว่าเรื่องหนักแค่ไหนจากสีหน้าท่าทางตอนเจอกันจริง มากกว่าจากข้อความในแชท","ในแชทกลุ่ม ฉันมักส่งรูปหรือคลิปสิ่งที่เจออยู่ตรงหน้าตอนนั้นเลย เช่น ร้านที่เดินผ่านหรือแมวข้างทาง","เที่ยวกับเพื่อนแล้วแบตมือถือหมดกลางทาง ฉันมักหันไปสนุกกับสิ่งที่เห็นตรงนั้นแทน แม้จะไม่มีรูปเก็บไว้เลยทั้งวัน"],"Ti":["เวลาเพื่อนขอคำแนะนำ ฉันมักถามไล่ให้ชัดก่อนว่าปัญหาจริง ๆ คืออะไร จนบางทีเพื่อนรู้สึกเหมือนโดนสัมภาษณ์","เวลาเพื่อนเล่าเรื่องที่ได้ยินต่อมา ฉันมักไล่ในหัวว่าแต่ละช่วงต่อกันติดไหม จนบางทีลืมรับมุกตามจังหวะ","ถ้ากติกาในกลุ่มเพื่อนขัดกันเอง เช่น เรื่องใครได้เลือกร้าน ฉันมักค้างใจจนอยากไล่ให้รู้ว่าหลักที่ลงตัวจริง ๆ คือแบบไหน","ฉันมีนิยามของตัวเองว่า “เพื่อนสนิท” ต่างจาก “เพื่อน” ตรงไหน และใช้มันเป็นหลักเวลาวางตัวกับแต่ละคน","เวลาเพื่อนทำอะไรที่ฉันไม่เข้าใจ ฉันมักไล่หาเหตุผลในหัวจนกว่ามันจะต่อกันติด แม้เพื่อนจะไม่ได้อยากให้วิเคราะห์","ฉันสนุกกับการถกกับเพื่อนว่าข้อโต้แย้งไหนฟังขึ้นกว่า แม้เป็นเรื่องไร้สาระ เช่น หนังเรื่องไหนพล็อตโหว่","เลือกเกมเล่นตอนรวมกลุ่มเพื่อน ฉันมักชอบเกมที่กติกาต่อกันลงตัวไม่มีช่องโหว่ จนบางทีนั่งอ่านกติกานานกว่าเล่นจริง"],"Te":["พอแชทกลุ่มนัดกันไม่ลงตัว ฉันมักสรุปตัวเลือกให้ทุกคนโหวตแล้วปิดเรื่อง แม้บางคนยังอยากคุยกันต่อ","เวลาเพื่อนเจอเรื่องใหญ่ เช่น ตกงาน ฉันมักรีบช่วยหาข้อมูลหรือลิสต์สิ่งที่ต้องทำให้เขา แม้บางทีเขาอยากได้แค่คนฟัง","ทริปกับเพื่อน ฉันมักขอให้ทุกคนตอบให้ชัดว่าใครจองอะไรภายในวันไหน แม้บางคนจะรู้สึกเหมือนโดนตามงาน","ถ้าเพื่อนคนไหนเบี้ยวนัดบ่อย ฉันจะบอกเขาตรง ๆ ว่าขอให้ยืนยันก่อน เพื่อให้คนอื่นวางแผนได้","เวลาเพื่อนลังเลเรื่องสำคัญ ฉันมักช่วยชั่งข้อดีข้อเสีย แล้วบอกตรง ๆ ว่าถ้าเป็นฉันจะเลือกทางไหน","ฉันดูว่าเพื่อนคนไหนพึ่งพาได้ จากสิ่งที่เขาทำจริงเวลามีเรื่อง มากกว่าจากคำพูดหรือความสนิท","ไปถึงร้านที่ตั้งใจกับเพื่อนแล้วคิวยาวมาก ฉันมักเปิดแผนที่หาร้านที่รอน้อยที่สุดแล้วพาไปเลย แม้ร้านใหม่จะไม่ใช่แนวที่ตั้งใจไว้"],"Fi":["ถ้าเพื่อนสนิททำสิ่งที่ขัดกับหลักในใจฉัน ความรู้สึกที่ฉันมีต่อเขามักเปลี่ยนไป แม้ปากจะยังไม่ได้พูดอะไร","กลุ่มเพื่อนกลุ่มไหนที่ทำให้ฉันต้องทำตัวไม่เป็นตัวเอง ฉันมักค่อย ๆ ถอยออกมา แม้กลุ่มนั้นจะสนุกก็ตาม","เพื่อนที่ฉันผูกพันลึก ๆ มักเป็นคนที่ให้ค่ากับเรื่องเดียวกับที่ใจฉันให้ค่า แม้จะไม่ได้เจอกันบ่อย","เวลาเพื่อนมาปรึกษา ฉันมักเล่าว่าถ้าเป็นฉัน สิ่งไหนที่ใจฉันให้ค่า แล้วให้เขาเลือกเอง แม้คำตอบนั้นอาจไม่ตรงกับเขานัก","ถ้าวงเพื่อนพากันชอบอะไรที่ฉันไม่ได้รู้สึกด้วย ฉันมักไม่ทำเป็นชอบตาม แม้จะดูไม่เข้าพวกไปบ้าง","ถ้าเพื่อนชวนทำอะไรที่กลุ่มเห็นว่าไม่เป็นไร แต่ใจฉันไม่โอเค ฉันมักขอไม่ทำด้วย แม้เพื่อนจะแซวว่าคิดมาก","เลือกชุดไปงานธีมที่เพื่อนจัด ฉันมักเลือกแบบที่ใส่แล้วยังรู้สึกเป็นตัวเอง แม้จะเข้าธีมไม่ค่อยสุด"],"Fe":["ถ้าเพื่อนเล่าเรื่องสำคัญในแชทกลุ่มแล้วเงียบ ฉันมักอึดอัดแทนเขา จนต้องรีบพิมพ์อะไรสักอย่าง แม้ยังไม่รู้จะพูดอะไรดี","ในแชทกลุ่ม ฉันมักเลือกคำและสติกเกอร์ให้เข้ากับอารมณ์ของวงตอนนั้น จนบางทีไม่ได้พูดสิ่งที่อยากพูดจริง ๆ","ถ้าเพื่อนในกลุ่มเริ่มตึงใส่กัน ฉันมักหาเรื่องอื่นมาคุยให้บรรยากาศเบาลง แม้เรื่องที่ค้างอยู่จะยังไม่ได้เคลียร์","ถ้าเพื่อนในกลุ่มคนหนึ่งดูเงียบไปผิดปกติ ฉันมักไม่สบายใจจนต้องทักเขาแยก แม้บางทีเขาแค่อยากอยู่เงียบ ๆ แล้วรู้สึกเหมือนโดนจับตา","เวลาเพื่อนมาระบาย ฉันมักพูดในแบบที่ทำให้เขารู้สึกดีขึ้นก่อน แม้ในใจจะคิดว่าเขามีส่วนผิดอยู่บ้าง","ฉันมักรับปากช่วยเพื่อนไปก่อน เพราะไม่อยากให้เขาผิดหวัง แล้วค่อยมาเหนื่อยเองทีหลัง","ทริปกับเพื่อนต้องเลื่อนเพราะเที่ยวบินถูกยกเลิก ฉันมักเลือกวันใหม่ตามคนที่ดูรอทริปนี้มากที่สุด แม้อีกหลายคนจะไม่ค่อยสะดวก"]},"c":{"Ni":["อยู่ห้องไหนไปสักพัก ฉันมักรู้สึกได้เองว่าที่นี่จะเป็นแค่ทางผ่านหรือที่อยู่ยาว จนบางทีไม่แต่งห้องเลยทั้งที่สุดท้ายอยู่ไปหลายปี","จะซื้อของชิ้นใหญ่เข้าห้อง ฉันมักนึกภาพว่าอีกสองสามปีชีวิตในห้องจะเป็นแบบไหน แล้วเลือกตามภาพนั้น แม้ตอนนี้จะดูเกินความจำเป็น","จะย้ายมุมทำงานในห้องไปไว้ไหน ฉันมักปล่อยให้คำตอบตกผลึกเองสักพัก แม้ระหว่างนั้นจะนั่งทำงานแบบไม่เข้าที่","วันหยุดอยู่บ้าน ฉันมักมีเรื่องหนึ่งค่อย ๆ เด่นขึ้นมาเป็นแกนของวัน แล้วทั้งวันก็หมุนรอบเรื่องนั้น แม้เรื่องที่วางไว้จะถูกพับไปหมด"],"Ne":["มองมุมว่าง ๆ ในห้อง ฉันมักเห็นไปหลายแบบว่ามันเป็นมุมอ่านหนังสือ มุมกาแฟ หรือมุมต้นไม้ได้ จนของในมุมนั้นย้ายเข้าย้ายออกอยู่บ่อย ๆ","จะมีคนมาที่ห้อง ฉันมักนึกได้หลายทางว่าจะชวนทำอะไร ตั้งแต่ทำอาหารด้วยกันจนถึงปูเสื่อดูหนัง จนเลือกไม่ถูก","ของในห้องพังกลางคัน ฉันมักนึกทางแก้ขัดตาทัพได้หลายแบบจากของที่มี แล้วอยากลองทีละแบบ แม้แบบแรกก็พอใช้แล้ว","ไฟดับไปทั้งเย็น ฉันมักนึกสนุกว่าคืนนี้จะทำอะไรแปลก ๆ ในห้องได้บ้าง จนบางทีลืมหาไฟฉายสำรอง","จะทำอะไรกินจากของที่เหลือในตู้เย็น ฉันมักนึกเมนูผสมได้หลายแบบ แล้วเลือกแบบที่ยังไม่ได้ลอง แม้อาจออกมาแปลก","จะเปลี่ยนผ้าม่านหรือผ้าปู ฉันมักเปิดดูหลายแนวที่ต่างกันมาก แล้วลังเลไปมาระหว่างแนวใหม่ ๆ จนเลือกนานกว่าที่ตั้งใจ"],"Si":["ทำความสะอาดห้อง ฉันมักรู้ว่าเสร็จเมื่อของทุกชิ้นได้กลับที่เดิม ถ้ายังไม่ครบจะรู้สึกค้าง ๆ แม้ห้องจะดูสะอาดแล้ว","ย้ายไปอยู่ห้องใหม่ ฉันมักจัดกิจวัตรให้เหมือนที่เก่าก่อน เช่น ตื่นมาทำอะไรก่อนหลัง แม้ห้องใหม่จะไม่เอื้อแบบเดิม","ของในบ้านที่ใช้มานานเริ่มรวน ฉันมักแก้ตามนิสัยของมันที่จำได้ เช่น ต้องเคาะตรงไหนหรือรอกี่นาที แม้คราวนี้อาการจะไม่เหมือนเดิมนัก","พัดลมหรือแอร์เสียกลางหน้าร้อน ฉันมักกลับไปใช้วิธีคลายร้อนที่รู้ว่าตัวเองสบาย เช่น นั่งมุมเดิมที่เย็นกว่า แม้ยังไม่ได้เรียกช่าง","เลือกน้ำยาซักผ้าหรือน้ำยาถูพื้น ฉันมักเลือกจากกลิ่นที่จำได้ว่าทำให้ห้องรู้สึกเหมือนบ้าน แม้จะไม่ได้รู้เลยว่ากลิ่นอื่นอาจถูกใจกว่า","จะซื้อหมอนหรือผ้าปูชุดใหม่ ฉันมักเลือกแบบที่สัมผัสเหมือนชุดเดิมที่นอนแล้วหลับสบาย จนห้องนอนหน้าตาแทบไม่เปลี่ยนมาหลายปี"],"Se":["อยู่ในห้อง ฉันมักรู้สึกถึงสภาพห้องผ่านร่างกาย เช่น พื้นเหนียวเท้าหรืออากาศอับ แล้วลุกไปแก้ตรงนั้นเลย แม้งานอื่นค้างอยู่","อยู่บ้านวันหยุด ฉันมักเพลินไปกับสัมผัสรอบตัว เช่น ผ้าปูที่เพิ่งซักหรือลมจากหน้าต่าง จนเรื่องที่ตั้งใจทำเลื่อนไป","หลอดไฟหรือก๊อกน้ำเสีย ฉันมักลงมือจัดการจากที่เห็นตรงหน้าเลย ลองขันลองขยับทีละจุด แม้จะรื้อของออกมาวางเต็มพื้น","ฝนสาดเข้าห้องกะทันหัน ฉันมักคว้าของใกล้มือมากันน้ำไว้ก่อน เช่น ผ้าขนหนูหรือกะละมัง จนบางทีผ้าที่คว้ามาเป็นผืนที่เพิ่งซักเสร็จ","จะซื้อต้นไม้มาวางในห้อง ฉันมักเลือกต้นที่สะดุดตาที่ร้านจากสีใบและทรงของจริง แม้บางต้นจะไม่ค่อยเหมาะกับแสงในห้อง","วันหยุดจะทำงานบ้านอะไรก่อน ฉันมักเริ่มจากจุดที่สะดุดตาตอนเดินผ่าน แล้วไหลไปทำจุดข้าง ๆ ต่อ แม้งานที่ตั้งใจไว้ยังไม่ได้แตะ"],"Ti":["หม้อหุงข้าวหรือพัดลมทำงานแปลก ๆ ฉันมักอยากรู้ว่ากลไกข้างในเป็นยังไงถึงออกมาแบบนั้น จนบางทีนั่งหาข้อมูลอยู่นานทั้งที่มันยังใช้ได้","ป้ายวิธีใช้ที่ติดมากับเครื่องใช้ในบ้าน เช่น ห้ามใช้ปลั๊กพ่วง ฉันมักนึกเองว่ามันห้ามเพราะกลไกอะไร แม้จะยังทำตามอยู่เหมือนคนอื่น","เบรกเกอร์ในห้องตัดซ้ำ ๆ ฉันมักไล่คิดทีละขั้นว่าเกิดจากปลั๊กไหนหรือเครื่องไหนเปิดพร้อมกัน แม้ต้องนั่งในห้องมืดอยู่นาน","ผนังห้องน้ำขึ้นคราบดำซ้ำที่เดิม ฉันมักคิดต่อว่าเพราะความชื้นหรือทางลมตรงไหน จนบางทีคิดนานกว่าเวลาที่ใช้ขัด","จะแขวนชั้นบนผนัง ฉันมักคิดก่อนว่าน้ำหนักลงตรงไหน ผนังแบบนี้รับได้เพราะอะไร แม้ชั้นจะวางพิงผนังรอไปหลายวัน","เลือกน้ำยาทำความสะอาด ฉันมักอ่านส่วนผสมแล้วคิดเองว่ามันจัดการคราบแบบไหนได้เพราะอะไร แม้จะยืนหน้าชั้นอยู่นาน"],"Te":["ของใช้ในบ้านที่หมดบ่อย ฉันมักตั้งรอบสั่งซื้อไว้เป็นตาราง จะได้ไม่ต้องคอยเช็กเอง แม้บางทีของจะล้นตู้ก่อนใช้หมด","จะมีคนมาที่ห้อง ฉันมักแตกเรื่องที่ต้องเตรียมเป็นรายการพร้อมเวลา จนบางทีแขกมาถึงแล้วฉันยังไล่ติ๊กรายการอยู่","เครื่องซักผ้าค้างกลางรอบ ฉันมักหาทางให้ผ้าแห้งทันใช้ก่อน เช่น ยกไปร้านซัก แล้วปล่อยเรื่องซ่อมไว้ จนบางทีเครื่องค้างอยู่เป็นสัปดาห์","ห้องน้ำรั่วซึม ฉันมักเลือกทางที่ปิดปัญหาได้ในรอบเดียวก่อน เช่น ปิดวาล์วแล้วเรียกช่าง แม้จะยังไม่ได้ดูเองเลยว่าน้ำมาจากตรงไหน","วันหยุดจะทำงานบ้านอะไรก่อน ฉันมักเลือกงานที่ส่งผลกับทั้งบ้านมากสุดก่อน แม้งานจุกจิกจะกองรอไปอีกหลายวัน","เลือกอุปกรณ์ทำความสะอาด ฉันมักเลือกชิ้นที่ช่วยตัดขั้นตอนได้มากที่สุด แม้หน้าตาจะไม่เข้ากับห้องเลย"],"Fi":["ฉันใช้ชีวิตในห้องตามจังหวะของใจตัวเอง เช่น ทำความสะอาดตอนดึกหรือนั่งทำงานริมหน้าต่างแทนโต๊ะ แม้คนที่แวะมาจะงงอยู่บ้าง","ของที่ชอบมากในห้องแตก ฉันมักอยู่กับความเสียดายนั้นสักพักก่อนจะคิดเรื่องซ่อมหรือหาใหม่ แม้เป็นแค่ของชิ้นเล็ก ๆ","ของในห้องต้องรื้อออกเพราะน้ำรั่ว พอจะจัดกลับเข้าที่ ฉันมักจัดตามที่ใจอยากให้ห้องเป็นตอนนี้ แม้แบบเดิมจะใช้พื้นที่ได้คุ้มกว่า","วันหยุดอยู่บ้าน ฉันมักเลือกทำเรื่องที่ใจเรียกร้องในวันนั้นก่อน เช่น ปลูกต้นไม้ แม้งานบ้านที่วางไว้จะเลื่อนออกไป","จะซื้อแก้วหรือจานใบใหม่ ฉันมักรอจนเจอใบที่มีอะไรบางอย่างตรงกับใจ จนบางทีเดินดูมาหลายร้านแล้วก็ยังไม่ได้ซื้อสักใบ"],"Fe":["มีคนมาที่ห้อง ฉันมักคอยดูสีหน้าเขาว่านั่งสบายไหม ร้อนไปไหม แล้วขยับพัดลมหรือหมอนให้ จนเขาต้องขยับที่นั่งตามอยู่หลายรอบ","มีคนมาพักค้างที่ห้อง ฉันมักคอยถามว่าเขาอยากปิดไฟหรือตื่นกี่โมง จนบางทีถามบ่อยจนเขาต้องบอกว่าทำตามสบายได้เลย","น้ำไม่ไหลตอนมีเพื่อนค้างที่ห้อง ฉันมักห่วงก่อนว่าเพื่อนจะอึดอัดไหม แล้วชวนคุยให้บรรยากาศไม่ตึง จนลืมดูว่าน้ำเป็นอะไร","อาหารที่ทำรับเพื่อนที่ห้องออกมาไม่เป็นอย่างที่คิด ฉันมักห่วงว่าเพื่อนจะฝืนกินไหม แล้วรีบหาของมาเสริม จนของเสริมเยอะกว่าจานหลัก","จะเลือกกิจกรรมตอนเพื่อนมาที่ห้อง ฉันมักเลือกสิ่งที่ทุกคนน่าจะสนุกด้วยกัน จนบางทีได้แต่แบบเดิม ๆ ซ้ำไปซ้ำมา","ซื้อขนมติดห้อง ฉันมักเลือกแบบที่คนส่วนใหญ่กินได้เผื่อมีคนแวะมา จนขนมบางห่อหมดอายุก่อนมีใครมาเปิด"]},"e":{"Ni":["แอปที่ใช้อยู่ค่อย ๆ เพิ่มอะไรเข้ามา ฉันมักสัมผัสได้ว่ามันกำลังจะกลายเป็นแอปแบบไหน จนบางทีย้ายออกก่อนแล้วมันก็ไม่ได้เป็นแบบนั้น","มีเครื่องมือ AI ใหม่ออกมาหลายตัว ฉันมักนึกภาพรวมว่าทั้งหมดจะพาวิธีทำเรื่องต่าง ๆ ของฉันไปทางไหน จนบางทียังไม่ได้ลองสักตัว","ถ้าแอปที่ใช้ประจำเริ่มค้างบ่อยขึ้น ฉันมักเริ่มเห็นภาพว่าเรื่องนี้จะไปจบแบบไหน ก่อนจะสนใจว่าวันนี้ค้างเพราะอะไร","ถ้าไฟล์หายไปทั้งโฟลเดอร์ ฉันมักนิ่งไปพักหนึ่งจนเห็นภาพรวมว่าช่วงนั้นเก็บของในเครื่องไปทางไหน แม้ระหว่างนั้นจะดูเหมือนไม่ได้ลงมือหา","จะเลือกแอปจดโน้ตสักตัว ฉันมักเลือกตัวที่รู้สึกว่าเข้ากับทางที่ฉันจะใช้ในอีกหลายปี แม้ตอนนี้จะยังขาดฟีเจอร์ที่ใช้อยู่ทุกวัน","ตอนต้องเลือกว่าจะเก็บหรือลบรูป ฉันมักเก็บไว้แค่รูปที่รู้สึกว่าเป็นใจความของช่วงนั้น แม้บางรูปที่ลบไปจะมีความทรงจำดี ๆ อยู่"],"Ne":["เห็นฟีเจอร์ใหม่ในแอป ฉันมักนึกต่อว่ามันเอาไปใช้กับเรื่องอื่นได้อีกหลายแบบ จนบางทีลืมเรื่องที่ตั้งใจจะทำตอนแรก","เห็นเมนูที่ยังไม่เคยกดในแอป ฉันมักเดาเล่น ๆ ไว้หลายแบบว่าข้างในน่าจะมีอะไร ก่อนกดเข้าไปดู แม้ตอนนั้นไม่ได้จะใช้อะไรเลย","ถ้าแอปที่ใช้ประจำเลิกให้บริการ ฉันมักไล่นึกถึงทางอื่นอีกหลายทาง จนลองไว้หลายตัวแล้วยังไม่ได้เลือกสักตัว","ถ้าเน็ตล่มกลางคัน ฉันมักเริ่มคิดว่าเวลาที่ว่างขึ้นมานี้เอาไปทำอะไรได้บ้าง แล้วแตกไปอีกหลายเรื่อง แม้เรื่องเดิมจะค้างอยู่","จะเลือกแอปมาใช้สักตัว ฉันมักเอนไปทางตัวที่ดูมีลูกเล่นให้เอาไปต่อยอดเล่นได้ แม้ตัวเรียบ ๆ จะพอสำหรับเรื่องที่ใช้อยู่แล้ว","ตอนจะจัดหมวดรูปในเครื่อง ฉันมักนึกได้หลายวิธีแบ่ง เช่น ตามคน ตามที่ ตามโทนภาพ แล้วอยากลองทีละแบบ แม้จะยังไม่ได้เริ่มจัดจริง"],"Si":["เวลาหารูปหรือไฟล์เก่า ฉันมักนึกถึงว่าตอนนั้นทำอะไรอยู่ อยู่ที่ไหน แล้วไล่หาจากช่วงเวลานั้น แม้การพิมพ์ค้นหาอาจเร็วกว่า","ฉันมักทำเรื่องในมือถือตามลำดับเดิมทุกวัน เช่น เปิดแอปไหนก่อนหลัง จนถ้าลำดับสลับก็รู้สึกแปลก ๆ","ถ้าแอปอัปเดตแล้วเมนูย้ายที่ ฉันมักหาทางตั้งให้กลับมาใกล้เคียงแบบเดิมก่อน แม้จะเสียเวลาไปกับการตั้งค่าอยู่พักใหญ่","เวลาเครื่องรวนแปลก ๆ ฉันมักนึกว่าครั้งก่อนที่เป็นแบบนี้ทำอะไรแล้วหาย แล้วลองแบบนั้นก่อน แม้ครั้งนี้อาจเป็นคนละสาเหตุ","จะเลือกแอปมาใช้สักตัว ฉันมักเลือกตัวที่หน้าตาและวิธีกดคล้ายกับที่เคยใช้ แม้ตัวอื่นจะมีอะไรให้ลองมากกว่า","ตอนต้องเลือกว่าจะเก็บหรือลบรูป ฉันมักเปิดดูทีละรูปแล้วนึกถึงวันนั้น จนบางทีนั่งไปนานแต่ลบได้ไม่กี่รูป"],"Se":["เจอแอปใหม่ ฉันมักกดลองตรงนั้นเลยว่าอะไรเกิดขึ้น แล้วเรียนรู้ไปจากสิ่งที่เห็นบนจอ แม้จะข้ามหน้าคำแนะนำไปหมด","เปิดแอปที่มีหน้าตาใหม่ ฉันมักไล่ดูสี ภาพเคลื่อนไหว และเสียงตอนกดตรงหน้าไปเรื่อย ๆ จนบางทีกดเล่นอยู่นานกว่าจะเริ่มใช้งานจริง","ถ้าแอปค้างกลางทาง ฉันมักลองกดย้อนกลับ เลื่อนจอ หรือปิดเปิดดูเลยว่าแบบไหนขยับ แม้จะยังไม่รู้ว่ามันค้างเพราะอะไร","ถ้าแบตใกล้หมดตอนอยู่ข้างนอก ฉันมักมองรอบตัวทันทีว่ามีปลั๊กหรือที่ชาร์จตรงไหน แม้จะยังไม่ได้คิดว่าแบตเหลือพอถึงเมื่อไหร่","จะเลือกแอปแต่งรูปสักตัว ฉันมักเปิดลองกับรูปจริงในเครื่องแล้วเลือกจากภาพที่ออกมาตรงหน้า แม้จะยังไม่ได้ดูว่ามันทำอะไรได้อีก","ตอนเลือกเสียงแจ้งเตือนหรือแบบการสั่น ฉันมักกดฟังและลองสั่นในมือทีละแบบ แล้วเลือกจากที่ได้ยินและรู้สึกตอนนั้น"],"Ti":["ใช้เครื่องมือ AI ฉันมักอยากรู้ว่ามันได้คำตอบแบบนี้มาจากอะไร จนบางทีถามย้อนเรื่องที่มาของคำตอบมากกว่าเรื่องที่ตั้งใจถาม","ฉันมักแบ่งโฟลเดอร์ตามหลักที่ตัวเองคิดขึ้น แล้วคอยดูว่าแต่ละหมวดไม่ทับกัน จนบางทีใช้เวลาวางระบบนานกว่าตอนใช้จริง","ถ้าแอปเด้งออกเอง แม้เปิดใหม่แล้วจะใช้ได้ปกติ ฉันก็ยังอยากรู้ว่ามันเด้งเพราะอะไร จนบางทีลองทำซ้ำดูว่าจะเด้งอีกไหม","ถ้าตั้งค่าแล้วผลออกมาไม่ตรงกับที่คิด ฉันมักไล่ย้อนในหัวก่อนว่าตัวเองเข้าใจตรงไหนคลาด แม้เรื่องที่ต้องใช้มันจะรออยู่","จะเลือกระหว่างแอปสองตัว ฉันมักอยากเข้าใจก่อนว่าแต่ละตัวออกแบบมาด้วยแนวคิดแบบไหน แม้ตอนใช้จริงจะต่างกันแค่นิดเดียว","ตอนจะเปิดหรือปิดการตั้งค่าสักอย่าง ฉันมักอ่านจนเข้าใจว่ามันไปเปลี่ยนอะไรในเครื่องบ้าง จนบางทีปุ่มเดียวใช้เวลาไปครึ่งชั่วโมง"],"Te":["ใช้แอปไหน ฉันมักใช้แค่ส่วนที่ช่วยให้เรื่องตรงหน้าจบ แล้วไม่ค่อยสนส่วนอื่น แม้จะไม่รู้ว่ามันทำอะไรได้อีกบ้าง","ฉันมักใช้แอปเดียวทำหลายเรื่องถ้ามันพอทำได้ เพื่อลดการสลับไปมา แม้บางเรื่องจะละเอียดไม่เท่าแอปเฉพาะทาง","ถ้าแอปค้าง ฉันมักหาทางอื่นให้งานนั้นเดินต่อไปก่อน เช่น สลับไปทำในเว็บ แม้ส่วนที่ทำค้างไว้ในแอปจะต้องเริ่มใหม่","ถ้าเครื่องแจ้งว่าพื้นที่เต็ม ฉันมักดูว่าอะไรกินที่มากที่สุดแล้วลบก้อนนั้นก่อน แม้จะต้องเสียบางอย่างที่ยังอยากเก็บไว้","จะเลือกแอปมาใช้สักตัว ฉันมักเทียบว่าตัวไหนพาไปถึงสิ่งที่ต้องการได้ตรงที่สุด แม้จะต้องเลิกใช้ตัวที่ใช้มานานจนชินแล้ว","ตอนเลือกว่าจะเปิดแจ้งเตือนแอปไหน ฉันมักเปิดไว้แค่ตัวที่ต้องตอบเร็ว แล้วปิดที่เหลือทั้งหมด แม้จะพลาดเรื่องน่าสนใจไปบ้าง"],"Fi":["ฉันมักจัดเพลย์ลิสต์ในเครื่องตามว่าแต่ละเพลงพูดแทนเรื่องไหนในชีวิตฉัน แม้เวลาหาเพลงสักเพลงจะยากกว่าเรียงตามชื่อ","ตั้งรูปหน้าจอ ฉันมักเลือกภาพที่มีเรื่องส่วนตัวซ่อนอยู่ซึ่งรู้กันอยู่คนเดียว แม้คนที่เห็นจะถามว่ามันคือรูปอะไร","ถ้ารูปในเครื่องหายไปบางส่วน ฉันมักนึกก่อนว่ารูปไหนมีความหมายกับฉันจริง ๆ แล้วตามหาแค่รูปเหล่านั้น แม้รูปที่เหลืออาจกู้คืนได้","ถ้าแอปที่ใช้มานานปิดตัวไป ฉันมักใช้เวลาหาตัวใหม่ที่ใช้แล้วไม่รู้สึกฝืนใจ แม้ระหว่างนั้นจะต้องทำแบบขัด ๆ ไปก่อน","ระหว่างแอปสองตัวที่ทำได้พอ ๆ กัน ฉันมักเลือกตัวที่ใช้แล้วใจรู้สึกว่า “ใช่” แม้ตัวอื่นจะได้คะแนนรีวิวสูงกว่า","ตอนแอปขอเข้าถึงรูปหรือรายชื่อ ฉันมักกดตามว่าใจฉันโอเคกับการให้แค่ไหน แม้บางฟีเจอร์จะใช้ไม่ได้"],"Fe":["เวลาแอปแชตโชว์ว่าฉันอ่านแล้ว ฉันมักนึกว่าอีกฝั่งจะรู้สึกยังไงกับสิ่งที่เขาเห็น จนบางทีเลื่อนการเปิดอ่านออกไปก่อน","ตั้งชื่อหรือรูปโปรไฟล์ในแอปที่ใช้กับคนอื่น ฉันมักเลือกแบบที่คนเห็นแล้วรู้สึกสบาย ๆ จนรูปโปรไฟล์ของฉันดูกลาง ๆ เหมือนของใครก็ได้","ถ้าเน็ตกระตุกตอนวิดีโอคอลกับเพื่อน ๆ ฉันมักคิดก่อนว่าคนในสายจะรำคาญไหม จนบางทีขอวางสายไปเองทั้งที่ไม่มีใครว่าอะไร","ถ้ารูปที่จะส่งให้เพื่อน ๆ หายไปจากเครื่อง สิ่งแรกที่ฉันนึกถึงคือคนที่รออยู่จะรู้สึกยังไง จนบางทีบอกขอโทษไปก่อนจะลองหาจริงจัง","จะเลือกแอปมาใช้ร่วมกับเพื่อน ๆ ฉันมักดูก่อนว่าใครในกลุ่มน่าจะไม่สะดวกใจกับตัวไหน แม้สุดท้ายคนที่ฉันห่วงแทนจะไม่ได้ติดใจอะไรเลย","ตอนจะเปลี่ยนการตั้งค่าในอัลบั้มหรือกลุ่มที่ใช้ร่วมกัน ฉันมักถามคนอื่นก่อนว่าโอเคไหม จนเรื่องเล็ก ๆ ก็ต้องรอคำตอบอยู่นาน"]}};
